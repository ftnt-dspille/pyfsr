# UC-14 -- A CVE report arrives as a FILE: work out what kind of file it is,
# get the CVE list out of it, and classify every CVE the same way regardless of
# which door it came through.
#
# The use case this exists for is the one a vulnerability programme actually
# has: intelligence arrives in whatever shape the sender chose. A government
# partner sends a PDF advisory. A scanner emits a CSV export. Neither is an
# API, neither is going to become one, and an analyst currently reads both by
# hand and decides what matters.
#
#   Ingest CVE Report  (manual, on an ATTACHMENT record)
#     -> Intake Config      (set_variable -- score bands, config names)
#     -> Source Gate        (decision on the file's OWN mimeType)
#          pdf  -> Extract PDF Text  (file-content-extraction, LIVE)
#                  -> Parse PDF      (code-runner -- CVE ids out of prose)
#          csv  -> Read CSV          (csv-data-management, LIVE)
#                  -> Parse CSV      (code-runner -- header map + column sniff)
#          else -> Unsupported Comment -> end
#     -> Findings Gate      (decision)
#          nothing found -> No Findings Comment -> end
#     -> Classify           (workflow_reference -> Classify CVE Findings)
#     -> Done
#
#   Classify CVE Findings  (child, called with findings_json + source label)
#     -> KEV Catalog        (cisa-advisory -- whole CISA KEV, LIVE, one call)
#     -> EPSS Scores        (epss -- ALL cves in ONE call, LIVE)
#     -> NVD Details        (generic-http -- for_each, one call per CVE, LIVE)
#     -> Score And Tier     (code-runner -- severity x exploitability x asset)
#     -> Upsert CVE Records (create_record c_v_es, for_each, upsert on cVEID)
#     -> Ticket Candidates  (code-runner -- which of these is actually WORK)
#     -> Ticket Gate        (decision -- nothing qualified / live / dry run)
#          dry run -> Dry Run Ticket Comment -> Summary Comment
#          live    -> Find CVE Records   (find_record -- IRIs for the ledger)
#                  -> Search Tickets     (jira -- one JQL for the whole batch)
#                  -> Reconcile Tickets  (code-runner -- create vs update)
#                  -> File Tickets       (jira create_ticket, for_each)
#                  -> Update Tickets     (jira add_comment, for_each)
#                  -> Collect Ticket Keys(code-runner -- pair keys to CVEs)
#                  -> Link Tickets       (update_record -- jira:<KEY> ledger)
#     -> Summary Comment
#     -> Done
#
# Six things here are load-bearing.
#
# 1. **The file decides the branch, not the operator.** The Source Gate reads
#    `mimeType` off the attachment's own file record. An analyst who has just
#    been sent a report should not first have to classify it correctly in order
#    to get it classified -- that is the work they came here to avoid. Adding a
#    third format is one branch and one parse step; nothing downstream moves.
#
# 2. **Both parsers emit the SAME contract, so classification is written once.**
#    Each parse step returns `findings_json`: a list of
#    `{cve, cvss_from_source, hosts, host_count, asset_categories, product,
#    solution, evidence}`. Everything specific to PDFs or to CSVs dies at that
#    boundary. This is the whole reason the child playbook can be shared, and
#    the reason the test suite tests classification once rather than per format.
#
# 3. **The CSV parser sniffs its own columns.** It does NOT hardcode a scanner's
#    header names. Live behaviour that forced this: asking the connector for
#    named columns fails outright -- `unable to find column "CVSS"` -- if the
#    export words its header even slightly differently, and every scanner words
#    it differently. So the raw call is made instead (which returns Column0..N
#    with the real header sitting in row 0), row 0 becomes the header map, and
#    the CVE column is found by matching the header and then by matching the
#    VALUES against the CVE pattern. A Tenable export, a Qualys export and a
#    hand-made spreadsheet all land the same way.
#
# 4. **"N/A" is not a CVE, and the connector will hand you one.** An empty cell
#    in the source CSV comes back as the literal string `N/A`, not as empty or
#    null. A truthiness check passes it, and it then becomes a CVE record named
#    "N/A" that no lookup can ever resolve. Every row is validated against the
#    CVE pattern rather than against emptiness. The sample export ships a row
#    with no CVE precisely so a test covers this.
#
# 5. **The source's own severity is recorded but never trusted.** A scan export
#    carries the scanner's opinion (CVSS, VPR, "High"). It is kept as evidence,
#    and the tier is computed from live EPSS + live NVD + the KEV catalog. The
#    sample data makes the disagreement concrete and it is not hypothetical:
#    the export rates CVE-2025-49144 "High" at VPR 8.4, while live EPSS puts it
#    at 0.006 -- the 46th percentile. Shipping the scanner's ranking unexamined
#    is how a queue fills up with work nobody needs to do first.
#
# 6. **A ticket is opened for work, not for severity.** The ticketing leg does
#    not file the top of the ranking; it files what is both urgent AND present
#    in the estate. A KEV-listed P1 the estate does not run gets no ticket at
#    all -- the run still records what it would have been, so the audit trail
#    is intact, but nobody is asked to do anything. Ranking on severity alone
#    is what buries a real queue under other people's emergencies, and this is
#    where that judgement is actually spent rather than merely reported.
#
#    De-duplication is the other half, and it spans use cases: the ticket
#    label is the lowercased CVE id, which is UC-06's convention, so a ticket
#    UC-06 opened off a scanner finding is found and updated here instead of
#    being duplicated. One CVE is one ticket regardless of which door it came
#    through -- file, feed, or scanner.


# ===========================================================================
# ONE COLLECTION, ONE FILE -- AND THAT IS NOT A STYLE CHOICE.
#
# This file is the merge of what used to be three: uc14 (file intake),
# uc15 (TAXII intake) and vuln_demo_reset. They had to become one FILE in
# order to become one COLLECTION, because a collection's uuid is uuid5 over
# its NAME -- so three files declaring the same `collection:` all resolve to
# the same uuid, and `import_from_yaml(replace=True)` hard-deletes any
# collection whose uuid matches before recreating it.
#
# Deploying the second file would therefore have DELETED the first one's
# playbooks, taking `Classify CVE Findings` with it -- which UC-15 calls by
# uuid. Both intake paths would have died, and the failure would have shown up
# as a broken demo rather than as a deploy error.
#
# So: add playbooks to this file. Do not create a second file that names this
# collection.
# ===========================================================================

collection: Demo Library - Vulnerability Management
description: >
  The whole vulnerability-management story in one collection: CVE intelligence
  arriving as files (PDF advisory, CSV scan export) or as a live TAXII 2.1
  subscription, classified once against live EPSS, live NVD CVSS and the CISA
  KEV catalog, joined to a real software inventory so exposure is answered per
  host, ticketed into Jira when it is both urgent and present -- plus the
  estate sync that puts the inventory into the Asset module, and the reset that
  puts the demo back.
visible: true

playbooks:

  # ---------------------------------------------------------------- ingest
  - name: Ingest CVE Report
    description: >
      Run on an attachment holding a CVE report. Detects the format, extracts
      the CVEs, and hands them to Classify CVE Findings.
    tag: uc14
    steps:

      - name: Start
        type: start
        module: attachments
        button_label: Ingest CVE Report
        requires_record: true
        next: Intake Config

      - name: Intake Config
        type: set_variable
        comment: >
          One place to change policy: the score bands that map a composite
          onto a priority tier, and the connector configuration to reach NVD
          with.
        vars:
          nvd_http_config: "nvd-public-http"
          # The software-inventory source. Optional -- see Estate Inventory.
          fleet_config: "patch-fleet"
          # Score bands: what maps a computed 0-100 composite onto a priority
          # tier. KEV membership short-circuits to P1 before these apply.
          #
          # The SLA day table that each tier resolves to lives in Classify CVE
          # Findings, not here -- only scalars survive a workflow_reference
          # argument intact, and a dict crossing that boundary arrives as a
          # Python repr rather than as JSON.
          band_p2: 80
          band_p3: 60
          band_p4: 35
          # --- ticketing ---
          # Ships "no". Every ticket is still decided and written out as a
          # comment showing exactly what would have been filed, so the scoring
          # and the de-duplication can be reviewed against real reports before
          # this is allowed to write into the ITSM. Flip to "yes" once the Jira
          # configuration named below has real credentials; nothing else moves.
          ticketing_enabled: "no"
          jira_config: "jira-demo"
          jira_project: "INC"
          # ONE TICKET, FOREVER. This label is the ticket's identity -- not the
          # CVE id and not the summary. Every run finds the ticket carrying it,
          # regroups the affected products and devices into the description,
          # and comments what changed. A new ticket is opened only if this one
          # has been closed.
          #
          # Per-CVE labels are still written ALONGSIDE it, and that is what
          # keeps `label -> issue key` resolution working: every CVE still
          # resolves to exactly one ticket, it is simply always the same one.
          # UC-06's lowercased-CVE convention therefore still finds this ticket.
          ticket_anchor_label: "vuln-management"
          # Which tiers are worth a ticket. A comma-separated STRING, not a
          # list: only scalars survive a workflow_reference argument intact.
          ticket_tiers: "P1,P2"
          file_iri: "{{ vars.input.records[0].file['@id'] }}"
          file_name: "{{ vars.input.records[0].file.filename }}"
          mime_type: "{{ vars.input.records[0].file.mimeType }}"
        next: Source Gate

      - name: Source Gate
        type: decision
        comment: >
          Dispatch on the file's own mimeType, with a filename fallback because
          a CSV uploaded by some browsers arrives as application/octet-stream.
        conditions:
          - display: PDF advisory
            when: "{{ 'pdf' in vars.mime_type | lower }}"
            next: Extract PDF Text
          - display: CSV export
            # The extension test is a SLICE, not `| last(4)` -- Jinja's `last`
            # filter takes no argument, and the call throws
            # "do_last() takes 2 positional arguments but 3 were given". That
            # kills the whole gate, so it took down the unsupported-format
            # branch too: every non-PDF file has to evaluate this condition.
            when: "{{ 'csv' in vars.mime_type | lower or vars.file_name[-4:] | lower == '.csv' }}"
            next: Read CSV
        default: Unsupported Comment

      # ---- PDF branch ----
      - name: Extract PDF Text
        type: connector
        connector: file-content-extraction
        operation: extract_text
        comment: >
          LIVE. Tika-backed; needs no configuration of its own. Returns
          `extracted_text` plus a large `metadata` block that is deliberately
          ignored -- the provenance that matters is the attachment record.
        params:
          file_iri: "{{ vars.file_iri }}"
        next: Parse PDF

      - name: Parse PDF
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          A PDF advisory has no schema, so the CVE identifier is the only thing
          that can be recovered reliably -- and it is enough, because every
          other attribute is then looked up from NVD, EPSS and KEV rather than
          read out of the prose.

          The surrounding line is kept as `evidence` so a human can see what the
          document actually said about a CVE without reopening the PDF.
        params:
          code: |
            import json, re

            raw = json.loads(r'''{{ vars.steps.Extract_PDF_Text.data | tojson }}''')
            text = raw.get("extracted_text") or ""

            CVE_RE = re.compile(r"CVE-\d{4}-\d{4,7}", re.I)

            # Evidence: the first line mentioning each CVE. Tika pads a PDF's
            # layout with runs of spaces, so lines are squeezed before storing.
            evidence = {}
            for line in text.splitlines():
                for cve in CVE_RE.findall(line):
                    evidence.setdefault(cve.upper(), " ".join(line.split()))

            findings = []
            for cve in sorted(evidence):
                findings.append({
                    "cve": cve,
                    # A PDF advisory carries no scanner score and no host list.
                    # Both stay empty rather than being invented, and the
                    # classifier treats "unknown exposure" as its own case.
                    #
                    # VPR is named and left None for the same reason: it is
                    # Tenable-proprietary, so no door but the scanner export
                    # can honestly produce one. Naming it keeps every door
                    # emitting the SAME finding shape.
                    "cvss_from_source": None,
                    "vpr_from_source": None,
                    "hosts": [],
                    "host_count": 0,
                    "asset_categories": [],
                    "product": "",
                    "solution": "",
                    "evidence": evidence[cve][:300],
                })

            return {
                "kind": "pdf",
                "count": len(findings),
                "findings_json": json.dumps(findings),
                "note": "" if findings else "no CVE identifiers appear in the extracted text",
            }
        set:
          findings_json: "{{ vars.steps.Parse_PDF.data.code_output.findings_json }}"
          finding_count: "{{ vars.steps.Parse_PDF.data.code_output.count }}"
          source_kind: "PDF advisory"
          # The door, as a tag. Tags accumulate through `link:`; the
          # `identifierSource` field cannot, because the upsert replaces it.
          source_tag: "src:tipper"
          parse_note: "{{ vars.steps.Parse_PDF.data.code_output.note }}"
        next: Findings Gate

      # ---- CSV branch ----
      - name: Read CSV
        type: connector
        connector: csv-data-management
        operation: extract_data_from_csv
        comment: >
          LIVE. Deliberately called WITHOUT `columnNames`. Naming columns makes
          the connector reject the whole file when a header word differs -- and
          the point of this step is to accept exports it has never seen. The
          raw call returns Column0..N with the true header as row 0, which
          Parse CSV turns into a header map.
        params:
          input: "File IRI"
          value: "{{ vars.file_iri }}"
        next: Parse CSV

      - name: Parse CSV
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Column sniffing, then grouping. One CVE across forty hosts is one
          piece of work with a prevalence of forty, not forty findings -- so
          rows are collapsed on the CVE and the hosts are carried as evidence.
        params:
          code: |
            import json, re

            raw = json.loads(r'''{{ vars.steps.Read_CSV.data | tojson }}''')
            rows = raw.get("records") or []

            CVE_RE = re.compile(r"^CVE-\d{4}-\d{4,7}$", re.I)

            if not rows:
                return {"kind": "csv", "count": 0, "findings_json": "[]",
                        "note": "the file has no rows"}

            # The connector returns TWO different shapes and which one you get
            # is not under your control:
            #
            #   positional -- keys are Column0..ColumnN and the real header is
            #                 sitting in row 0 as data
            #   named      -- keys are already the real header names
            #
            # Assuming the positional shape crashes on the named one with
            # `invalid literal for int(): 'Department'`, which names a column
            # and not the actual problem. Detect, do not assume.
            positional = all(re.match(r"^Column\d+$", k) for k in rows[0])

            if positional:
                def ordered(row):
                    # Sort numerically, not lexically, or Column10 lands
                    # between Column1 and Column2.
                    return [str(row[k]) for k in
                            sorted(row, key=lambda k: int(k[6:] or 0))]

                if len(rows) < 2:
                    return {"kind": "csv", "count": 0, "findings_json": "[]",
                            "note": "the file has no data rows"}
                header = ordered(rows[0])
                data = [dict(zip(header, ordered(r))) for r in rows[1:]]
            else:
                header = list(rows[0].keys())
                data = [{k: str(v) for k, v in r.items()} for r in rows]

            def find_col(*patterns):
                for pat in patterns:
                    for name in header:
                        if re.search(pat, name, re.I):
                            return name
                return None

            # The CVE column by header, then -- if the header is unhelpful -- by
            # looking at which column actually holds CVE-shaped values.
            cve_col = find_col(r"^cve", r"\bcve\b")
            if not cve_col:
                for name in header:
                    hits = sum(1 for r in data if CVE_RE.match(r.get(name, "").strip()))
                    if hits and hits >= len(data) / 4:
                        cve_col = name
                        break
            if not cve_col:
                return {"kind": "csv", "count": 0, "findings_json": "[]",
                        "note": "no column in this export holds CVE identifiers"}

            host_col = find_col(r"host", r"asset.*name", r"dns", r"netbios", r"^ip$")
            cvss_col = find_col(r"cvss.*base", r"cvss")
            # Tenable's own priority score. It is the ONE signal in this file
            # no other door can produce -- CVSS comes from NVD and EPSS from
            # FIRST, but VPR is Tenable-proprietary and exists only because a
            # scanner looked at the estate. Matched narrowly so a column merely
            # mentioning "priority" cannot be mistaken for it.
            vpr_col  = find_col(r"\bvpr\b", r"vpr.*score")
            cat_col  = find_col(r"asset.*categ", r"categ", r"\btag\b")
            sol_col  = find_col(r"solution", r"remediation", r"fix")
            name_col = find_col(r"^name$", r"plugin.*name", r"title", r"synopsis")

            grouped, skipped = {}, 0
            for r in data:
                cve = (r.get(cve_col) or "").strip().upper()
                # The connector renders an empty cell as the literal "N/A".
                # Validate the SHAPE, never the truthiness.
                if not CVE_RE.match(cve):
                    skipped += 1
                    continue
                g = grouped.setdefault(cve, {
                    "cve": cve, "cvss_from_source": None, "hosts": [],
                    "asset_categories": [], "product": "", "solution": "",
                    "evidence": "",
                    # None, not 0.0. A CVE the scanner never scored and a CVE
                    # the scanner scored zero are different facts, and only
                    # None can say the first one.
                    "vpr_from_source": None,
                })
                if host_col:
                    h = (r.get(host_col) or "").strip()
                    if h and h not in g["hosts"]:
                        g["hosts"].append(h)
                if cat_col:
                    cat = (r.get(cat_col) or "").strip()
                    if cat and cat != "N/A" and cat not in g["asset_categories"]:
                        g["asset_categories"].append(cat)
                if cvss_col and g["cvss_from_source"] is None:
                    try:
                        g["cvss_from_source"] = float(r.get(cvss_col))
                    except (TypeError, ValueError):
                        pass
                if vpr_col and g["vpr_from_source"] is None:
                    try:
                        g["vpr_from_source"] = float(r.get(vpr_col))
                    except (TypeError, ValueError):
                        pass
                if sol_col and not g["solution"]:
                    g["solution"] = (r.get(sol_col) or "").strip()[:300]
                if name_col and not g["product"]:
                    g["product"] = (r.get(name_col) or "").strip()[:120]

            findings = []
            for cve in sorted(grouped):
                g = grouped[cve]
                g["host_count"] = len(g["hosts"])
                g["evidence"] = "{} row(s) in {}".format(g["host_count"] or 1, cve_col)
                findings.append(g)

            note = ""
            if not findings:
                note = "no row carried a valid CVE identifier"
            elif skipped:
                note = "{} row(s) skipped: no CVE identifier".format(skipped)

            return {"kind": "csv", "count": len(findings),
                    "findings_json": json.dumps(findings), "note": note}
        set:
          findings_json: "{{ vars.steps.Parse_CSV.data.code_output.findings_json }}"
          finding_count: "{{ vars.steps.Parse_CSV.data.code_output.count }}"
          source_kind: "CSV scan export"
          source_tag: "src:tenable"
          parse_note: "{{ vars.steps.Parse_CSV.data.code_output.note }}"
        next: Findings Gate

      # ---- converge ----
      - name: Findings Gate
        type: decision
        comment: >
          A report that yields nothing is a legitimate outcome, not a failure,
          and it gets a comment saying what was looked at and why it was empty.
          Silence here is what makes an intake pipeline untrustworthy.
        conditions:
          - display: findings to classify
            when: "{{ vars.finding_count | int > 0 }}"
            next: Classify
        default: No Findings Comment

      - name: Classify
        type: workflow_reference
        target: Classify CVE Findings
        apply_async: false
        comment: >
          Child input params are authored at STEP level, not nested under an
          `arguments:` key -- the compiler rejects that wrapper outright. The
          child reads each one as `vars.input.params.<name>`.
        findings_json: "{{ vars.findings_json }}"
        source_kind: "{{ vars.source_kind }}"
        source_tag: "{{ vars.source_tag }}"
        source_name: "{{ vars.file_name }}"
        source_ref: "{{ vars.input.records[0]['@id'] }}"
        nvd_http_config: "{{ vars.nvd_http_config }}"
        fleet_config: "{{ vars.fleet_config }}"
        band_p2: "{{ vars.band_p2 }}"
        band_p3: "{{ vars.band_p3 }}"
        band_p4: "{{ vars.band_p4 }}"
        ticketing_enabled: "{{ vars.ticketing_enabled }}"
        jira_config: "{{ vars.jira_config }}"
        jira_project: "{{ vars.jira_project }}"
        ticket_tiers: "{{ vars.ticket_tiers }}"
        ticket_anchor_label: "{{ vars.ticket_anchor_label }}"
        next: Done

      - name: No Findings Comment
        type: create_record
        module: comments
        comment: >
          A comment is a `create_record` on the comments module, linked to its
          parent through that module's relation field -- here `attachments`.
          An `update_record` carrying only a `message:` fails with
          "update_data() takes at least 2 positional arguments".
        fields:
          attachments: ["{{ vars.input.records[0]['@id'] }}"]
          content: >
            <p><b>CVE intake: nothing to classify.</b></p>
            <p><code>{{ vars.file_name }}</code> was read as a
            {{ vars.source_kind }}. {{ vars.parse_note }}.</p>
            <p>The file was parsed successfully -- this is an empty result, not
            a read failure.</p>
        next: Done

      - name: Unsupported Comment
        type: create_record
        module: comments
        comment: >
          Named formats only. Guessing at an unknown binary is how a pipeline
          silently produces confident nonsense.
        fields:
          attachments: ["{{ vars.input.records[0]['@id'] }}"]
          content: >
            <p><b>CVE intake: unsupported format.</b></p>
            <p><code>{{ vars.file_name }}</code> is
            <code>{{ vars.mime_type }}</code>. This playbook reads PDF
            advisories and CSV exports.</p>
        next: Done

      - name: Done
        type: end

  # -------------------------------------------------------------- classify
  - name: Classify CVE Findings
    description: >
      Score and tier a normalised list of CVE findings against live EPSS, live
      NVD CVSS and the CISA KEV catalog, then upsert them into the CVE module.
      Called by Ingest CVE Report; source-agnostic by construction.
    tag: uc14
    parameters: [findings_json, source_kind, source_name, source_ref,
                 nvd_http_config, fleet_config, band_p2, band_p3, band_p4,
                 ticketing_enabled, jira_config, jira_project, ticket_tiers,
                 ticket_anchor_label, source_tag]
    steps:

      - name: Start
        type: start
        next: CVE List

      - name: CVE List
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Produces the comma-joined CVE list the bulk EPSS call takes, and the
          plain list the NVD loop iterates. Doing this once keeps the two
          enrichment steps reading from the same ordering.
        params:
          code: |
            import json

            # Interpolating this parameter RAW does not work. It leaves the
            # parent as a JSON string, and the templating layer parses it and
            # re-renders it as a PYTHON repr -- [{'cve': ...}] with single
            # quotes -- which json.loads rejects at "line 1 column 3", naming
            # neither the parameter nor the caller. `ast.literal_eval` is not
            # a way out either: the snippet sandbox has no `ast`.
            #
            # `| tojson` is the fix. Jinja serialises whatever it is holding
            # into real JSON on the way out. The double decode covers both
            # arrival shapes: if the value was already a string, one loads
            # returns that string and the second turns it into the list.
            findings = json.loads(r'''{{ vars.input.params.findings_json | tojson }}''')
            if isinstance(findings, str):
                findings = json.loads(findings)
            cves = [f["cve"] for f in findings]
            return {"cves": cves, "joined": ",".join(cves), "count": len(cves)}
        next: KEV Catalog

      - name: KEV Catalog
        type: connector
        connector: cisa-advisory
        operation: get_known_exploited_vulnerability_cves
        comment: >
          LIVE, unauthenticated, and fetched ONCE for the whole batch -- the
          catalog is ~1,700 entries and membership is a set lookup afterwards.
          KEV is the strongest single signal available here: it is not a
          prediction, it is a record that exploitation has been observed.
        params: {}
        next: EPSS Scores

      - name: EPSS Scores
        type: connector
        connector: exploit-prediction-scoring-system
        operation: get_epss_score_by_cve_id
        comment: >
          LIVE, and one call for the entire batch -- the API accepts a
          comma-separated CVE list, so this does not loop.

          The optional parameters are all passed explicitly. Omitting them
          fails the call with a bare `'orderResult'` KeyError, which reads like
          an outage rather than a missing argument.
        params:
          cve: "{{ vars.steps.CVE_List.data.code_output.joined }}"
          scope: "Time Series"
          byDate: ""
          fields: ""
          sort: ""
          envelope: false
          pretty: false
          orderResult: false
        next: NVD Details

      - name: NVD Details
        type: connector
        connector: generic-http
        operation: http_get
        config: "{{ vars.input.params.nvd_http_config }}"
        comment: >
          LIVE, keyless. One call per CVE -- NVD has no bulk-by-id form.

          Keyless is a deliberate choice, not a workaround: the nist-nvd
          connector mandates an API key, and the key held on this appliance is
          rejected by NVD itself. The public REST API answers without one at a
          lower rate limit, which a batch this size stays inside.

          `for_each` collects results as an ORDERED LIST, one standard
          connector envelope per iteration -- so iteration i lines up with
          cves[i]. Score And Tier depends on that alignment.
        params:
          rest_api: /rest/json/cves/2.0
          parameter:
            cveId: "{{ vars.item }}"
        for_each:
          item: "{{ vars.steps.CVE_List.data.code_output.cves }}"
        next: Severity Picklist

      # ---- picklist resolution ----
      # A picklist field will not accept its own display name here. "High"
      # exists in a dozen unrelated picklists on this appliance, so the write is
      # rejected as ambiguous -- with an error that names the field and the
      # picklist but not the ambiguity, which reads like a wrong value. The
      # option's IRI is unambiguous, and the IRIs differ per appliance, so they
      # are resolved at run time rather than pinned in the YAML.
      - name: Severity Picklist
        type: find_record
        module: picklists
        filters:
          - {field: listName.name, operator: eq, value: Severity}
        limit: 20
        next: KEV Flag Picklist

      - name: KEV Flag Picklist
        type: find_record
        module: picklists
        filters:
          - {field: listName.name, operator: eq, value: YesNoInput}
        limit: 20
        next: KEV Source Picklist

      - name: KEV Source Picklist
        type: find_record
        module: picklists
        filters:
          - {field: listName.name, operator: eq, value: KEVTagSource}
        limit: 20
        next: Ransomware Picklist

      - name: Ransomware Picklist
        type: find_record
        module: picklists
        filters:
          - {field: listName.name, operator: eq, value: "Known to be Used in Ransomware Campaign"}
        limit: 20
        next: Estate Inventory

      - name: Estate Inventory
        type: connector
        connector: generic-http
        operation: http_get
        config: "{{ vars.input.params.fleet_config }}"
        ignore_errors: true
        comment: >
          LIVE, and DELIBERATELY OPTIONAL. One call for the whole estate's
          software inventory, matched per-CVE in Score And Tier.

          `ignore_errors` is the important part. Every other source this
          playbook touches is public, so UC-14 runs against nothing but the
          appliance -- and adding an inventory that only exists in a lab would
          quietly trade that away. When this step cannot reach the inventory
          the run continues and every CVE is marked exposure `unknown`.

          "We could not tell" and "you are not affected" are different answers
          and are never collapsed into one. Reporting the second when you mean
          the first is how a vulnerability programme talks itself out of real
          exposure.
        params:
          rest_api: /api/v1/fleet/hosts
          parameter:
            per_page: 100
            populate_software: "true"
        next: Score And Tier

      - name: Score And Tier
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Where the three live signals become one decision.

          The weighting mirrors what the customer's scanner does internally
          (severity x exploitability x asset), with CVSS deliberately capped at
          half: on its own it is identical for every organisation on earth and
          so cannot prioritise anything. EPSS percentile is used rather than
          raw probability because the raw number is tiny for almost everything
          and compresses the interesting range into nothing.

          KEV short-circuits to P1 regardless of score. A vulnerability that is
          being exploited today does not need a second opinion.
        params:
          code: |
            import json, re, time

            # Interpolating this parameter RAW does not work. It leaves the
            # parent as a JSON string, and the templating layer parses it and
            # re-renders it as a PYTHON repr -- [{'cve': ...}] with single
            # quotes -- which json.loads rejects at "line 1 column 3", naming
            # neither the parameter nor the caller. `ast.literal_eval` is not
            # a way out either: the snippet sandbox has no `ast`.
            #
            # `| tojson` is the fix. Jinja serialises whatever it is holding
            # into real JSON on the way out. The double decode covers both
            # arrival shapes: if the value was already a string, one loads
            # returns that string and the second turns it into the list.
            findings = json.loads(r'''{{ vars.input.params.findings_json | tojson }}''')
            if isinstance(findings, str):
                findings = json.loads(findings)
            kev_raw  = json.loads(r'''{{ vars.steps.KEV_Catalog.data | tojson }}''')
            epss_raw = json.loads(r'''{{ vars.steps.EPSS_Scores.data | tojson }}''')
            nvd_raw  = json.loads(r'''{{ vars.steps.NVD_Details | tojson }}''')
            # The SLA table lives HERE rather than being passed in. A dict sent
            # through a workflow_reference argument is rendered by Jinja as a
            # PYTHON repr -- {'P1': 1} with single quotes -- which is not JSON
            # and dies in json.loads with a column-2 syntax error that names
            # neither the parameter nor the caller. Scalars cross that boundary
            # safely; structures do not. Policy belongs with the scoring anyway.
            sla = {"P1": 1, "P2": 21, "P3": 45, "P4": 90, "P5": 180}

            # itemValue -> IRI, per picklist. Writing a picklist field by its
            # display name is rejected as ambiguous; the IRI is what the API
            # takes, and it differs per appliance.
            # find_record rows are NOT under `.records`, whatever the docs
            # say, and the envelope is unwrapped in PYTHON rather than in Jinja
            # -- a ['hydra:member'] subscript inside the template fails to
            # render and takes the step down with a CS-WF-8 that quotes the
            # entire snippet back at you instead of naming the expression.
            def pmap(step):
                # A find_record result arrives as the bare row LIST at run time,
                # even though the compiler types it as the Hydra envelope with
                # the rows under `hydra:member`. Accept either.
                rows = step.get("hydra:member") if isinstance(step, dict) else step
                return {r.get("itemValue"): r.get("@id") for r in (rows or [])}

            sev_iri  = pmap(json.loads(r'''{{ vars.steps.Severity_Picklist | tojson }}'''))
            yn_iri   = pmap(json.loads(r'''{{ vars.steps.KEV_Flag_Picklist | tojson }}'''))
            src_iri  = pmap(json.loads(r'''{{ vars.steps.KEV_Source_Picklist | tojson }}'''))
            ransom_iri = pmap(json.loads(r'''{{ vars.steps.Ransomware_Picklist | tojson }}'''))

            source_tag = "{{ vars.input.params.source_tag }}".strip()
            band_p2 = float("{{ vars.input.params.band_p2 }}")
            band_p3 = float("{{ vars.input.params.band_p3 }}")
            band_p4 = float("{{ vars.input.params.band_p4 }}")

            kev = {}
            for v in (kev_raw.get("vulnerabilities") or []):
                kev[str(v.get("cveID", "")).upper()] = v

            epss = {}
            for e in (epss_raw.get("data") or []):
                epss[str(e.get("cve", "")).upper()] = e

            # for_each -> ordered list of envelopes, aligned with findings.
            #
            # Every level is isinstance-checked, and that is not defensive
            # programming for its own sake. NVD's keyless API is rate limited,
            # and when it refuses it answers with a PLAIN STRING body rather
            # than the JSON envelope. `body.get("vulnerabilities")` then raises
            # "'str' object has no attribute 'get'", which kills Score And Tier
            # -- so the whole classification dies, no CVE records are written,
            # and the failure names neither NVD nor the rate limit.
            #
            # It surfaces when two intakes run close together, which is exactly
            # what a demo does and what the de-duplication scenario does by
            # construction: ~5 calls per run, twice inside a minute.
            nvd, nvd_missing = {}, []
            for i, env in enumerate(nvd_raw if isinstance(nvd_raw, list) else []):
                if i >= len(findings):
                    break
                cve_i = findings[i]["cve"].upper()
                data = env.get("data") if isinstance(env, dict) else None
                body = data.get("body") if isinstance(data, dict) else None
                vulns = body.get("vulnerabilities") if isinstance(body, dict) else None
                first = (vulns or [None])[0]
                if isinstance(first, dict) and isinstance(first.get("cve"), dict):
                    nvd[cve_i] = first["cve"]
                else:
                    # Recorded rather than swallowed. Losing NVD costs the CVSS
                    # half of the score and the CPE data the exposure check
                    # runs on, so a run that quietly lost it is not the same
                    # run and should not read like one.
                    nvd_missing.append(cve_i)

            # Words that identify no product on their own. Matching on these
            # returns most of an estate and reads as exposure everywhere.
            STOP = {"the", "and", "for", "with", "remote", "host", "local",
                    "privilege", "escalation", "memory", "corruption", "code",
                    "execution", "directory", "traversal", "vulnerability",
                    "rce", "server", "client", "windows", "linux", "kernel",
                    "default", "credentials", "printer", "apache", "mozilla",
                    "microsoft", "update", "updates", "security"}

            # CPE names, per CVE. This is the authoritative statement of WHICH
            # PRODUCT a CVE affects, and it is far better than reading the
            # product out of the report's prose -- a PDF advisory names the
            # product in a section heading, a scan export buries it in a
            # finding title, and neither is reliable. A CPE looks like
            # cpe:2.3:a:notepad-plus-plus:notepad\+\+:8.7:*:*:... -- field 3 is
            # the vendor and field 4 the product.
            cpe_terms = {}
            for cve_id, detail in nvd.items():
                counts = {}
                for config in (detail.get("configurations") or []):
                    for node in (config.get("nodes") or []):
                        for match in (node.get("cpeMatch") or []):
                            parts = str(match.get("criteria") or "").split(":")
                            if len(parts) > 4:
                                # Field 4 (product) ONLY. The vendor field is
                                # not a product -- "microsoft" matches every
                                # Windows box in the estate and turns a
                                # specific question into "yes, everywhere".
                                # NVD escapes CPE punctuation, so the product
                                # is literally `notepad\+\+`, not `notepad++`.
                                # Left in, the term is a substring no inventory
                                # entry can ever contain -- Notepad++ is
                                # installed on a managed host and still read as
                                # "not present", which is the one wrong answer
                                # this test exists to avoid.
                                word = (parts[4].replace("_", " ")
                                        .replace("\\", "").strip().lower())
                                if word and word not in ("*", "-"):
                                    counts[word] = counts.get(word, 0) + 1
                # A widely-bundled library like log4j carries CPEs for every
                # appliance that ships it, so this list can run to hundreds.
                # Platform words are dropped for the same reason the vendor
                # is: they identify no product on their own.
                named = " ".join(str(x or "").lower() for x in (
                    (kev.get(cve_id) or {}).get("product"),
                    (kev.get(cve_id) or {}).get("vulnerabilityName"),
                    (detail.get("descriptions") or [{}])[0].get("value"),
                ))
                # A MULTI-WORD product is kept only when the advisory, the KEV
                # entry or NVD's own description also names it. CPE products
                # are frequently multi-word -- `vlc_media_player`,
                # `acrobat_reader`, `mozilla_firefox` -- and the underscore
                # replacement above is what turns them into phrases, so a flat
                # "no spaces" rule discards the real product for most desktop
                # software and the CVE reads as absent from an estate that
                # runs it. The prose check keeps the rule's original purpose:
                # a widely-bundled library carries a CPE for every appliance
                # that ships it, and those model names appear nowhere in the
                # CVE's own text.
                counts = {t: n for t, n in counts.items()
                          if t not in STOP and not t.isdigit()
                          and (" " not in t or t in named)}
                # Ranked by how often the product appears across the CVE's own
                # CPE list, NOT by length. Log4Shell carries a CPE for every
                # appliance that bundles the library, so "longest first" picks
                # hardware part numbers and can miss `log4j` itself -- which
                # would make a host that really runs it read as not exposed.
                # The affected product dominates its own configuration list.
                # A term the ADVISORY or the KEV catalog also names outranks
                # raw frequency. Log4Shell's CPE list gives a hundred bundling
                # products one mention each, so frequency alone cannot find
                # `log4j` in it -- and the ruled-out message has to name the
                # thing actually looked for, or the claim is not auditable.
                cpe_terms[cve_id] = [t for t, _ in sorted(
                    counts.items(),
                    key=lambda kv: (0 if kv[0] in named else 1,
                                    -kv[1], len(kv[0])))][:8]

            # ---- estate inventory -------------------------------------
            # (STOP and the CPE term table are built further down, after the
            # inventory is unpacked.)
            # Reachable or not, and never guessed at. An unreachable inventory
            # yields exposure "unknown" for every CVE, which is a different
            # answer from "absent" and is reported as such.
            inv_raw = json.loads(r'''{{ vars.steps.Estate_Inventory | tojson }}''')
            inv_body = ((inv_raw or {}).get("data") or {}).get("body") or {}
            inv_hosts = inv_body.get("hosts") or []
            inventory_ok = bool(inv_hosts)

            # hostname -> set of lowercased installed software names
            estate = {}
            for h in inv_hosts:
                estate[h.get("hostname") or h.get("display_name") or "?"] = [
                    str(sw.get("name") or "").lower()
                    for sw in (h.get("software") or [])
                ]

            def product_terms(finding, kev_entry, cve_id):
                """Search terms for the product a CVE affects, best first.

                CPE first, because it is the only one of the three that is a
                statement about the product rather than about the report.
                """
                terms = list(cpe_terms.get(cve_id) or [])
                for source in (
                    (kev_entry or {}).get("product"),
                    finding.get("product"),
                ):
                    if not source:
                        continue
                    # A scan export names the finding, not the product:
                    # "Notepad++ < 8.7.1 Privilege Escalation". The product is
                    # the leading run of words before the version comparator.
                    head = re.split(r"[<>]|\bversion\b|\bprior\b", str(source))[0]
                    for token in re.findall(r"[A-Za-z0-9+.#-]{3,}", head):
                        low = token.lower().strip(".-")
                        if low and low not in STOP and not low.isdigit():
                            terms.append(low)
                # Longest first: "notepad++" before "notepad", so the most
                # specific term is the one that decides a match.
                return sorted(set(terms), key=len, reverse=True)[:6]

            def exposure_of(finding, kev_entry, cve_id):
                """(verdict, hosts, why) -- present / absent / unknown."""
                # A source that already names hosts has settled the question.
                if finding.get("hosts"):
                    return ("present", list(finding["hosts"]),
                            "the source report named the affected hosts")
                if not inventory_ok:
                    return ("unknown", [],
                            "the software inventory could not be reached")
                terms = product_terms(finding, kev_entry, cve_id)
                if not terms:
                    return ("unknown", [],
                            "no product name could be derived for this CVE")
                hits = [host for host, names in estate.items()
                        if any(any(t in n for n in names) for t in terms)]
                if hits:
                    matched = [t for t in terms
                               if any(t in n for names in estate.values() for n in names)]
                    return ("present", hits,
                            "matched {} in the inventory".format(
                                "/".join(matched[:3] or terms[:3])))
                # Deliberately says how MANY product names were checked and
                # gives examples, rather than implying the first three are the
                # whole test. For a widely-bundled library the term list is the
                # products that ship it, not the library -- the verdict is
                # still sound, but a message naming only three would overstate
                # what was actually looked for.
                return ("absent", [],
                        "none of {} product name(s) for this CVE match any "
                        "installed software (e.g. {}); {} host(s) checked".format(
                            len(terms), ", ".join(terms[:3]), len(estate)))

            # Vigor's OWN asset categories, weighted. Slide 8 of their process
            # deck names them: Internet-Facing, Critical Assets, Networking,
            # Non-Critical, Wireless -- assigned almost entirely by tag rules
            # keyed on VLAN/subnet and OS, where the VLANs are DMZ, Network
            # Devices, Servers, Workstations/Printers, Corporate and Customer
            # Networks. Both vocabularies are matched here, because the
            # category is derived FROM the VLAN and an export can carry either.
            #
            # Graduated rather than a hot/not-hot flag. The previous binary
            # test scored "Workstations" and "Non-Critical" identically, which
            # collapses three of Vigor's five real categories onto one weight
            # and makes the asset dimension unable to say the thing it exists
            # to say.
            ASSET_TIERS = (
                # Exposed to the internet, or declared business-critical.
                (1.00, ("internet", "dmz", "critical")),
                # Infrastructure: losing one of these takes others with it.
                (0.75, ("network", "server")),
                # Ordinary endpoints and user-facing segments.
                (0.50, ("workstation", "printer", "corporate",
                        "wireless", "customer")),
            )

            def category_weight(cat):
                """One asset category -> 0..1, or None if it is not one we know.

                The negation is checked BEFORE the keywords, and that ordering
                is the whole point: "critical" is a substring of "Non-Critical",
                so a plain keyword test scores the LEAST exposed assets exactly
                like the most exposed -- silently, and in the direction that
                inflates priority. Live proof: a Non-Critical host scored 74
                instead of 64, one band too high.
                #
                Whole-token matching is not the fix either -- it swings the
                error the other way, because real scanners emit "Critical
                Assets" and "Internet-Facing" rather than bare words, and those
                then match nothing at all.
                """
                c = " ".join(str(cat or "").split()).lower()
                if not c:
                    return None
                if c.startswith("non-") or c.startswith("non "):
                    return 0.25
                for weight, keys in ASSET_TIERS:
                    if any(k in c for k in keys):
                        return weight
                return None

            def asset_weight(cats, verdict):
                """How much the ESTATE says this CVE matters, 0..1.

                The HIGHEST category wins, because a CVE on both a Critical
                Asset and a workstation is a critical-asset problem -- averaging
                would let a long tail of ordinary endpoints dilute the one
                machine that matters.

                Falls back to the resolved EXPOSURE when no door supplied a
                category, which is what a prose advisory looks like: it names no
                categories, but the live inventory may still place the CVE on
                real machines, and "present somewhere" is worth more than
                "absent" and far more than "unknown".
                """
                weights = [w for w in (category_weight(c) for c in cats)
                           if w is not None]
                if weights:
                    return max(weights), "asset category"
                if verdict == "present":
                    return 0.5, "present in the estate, category unknown"
                return 0.0, ("not present in the estate" if verdict == "absent"
                             else "exposure could not be determined")

            # Doors that count as THREAT INTELLIGENCE for Vigor's P1 rule.
            # Their P1 is not a score band at all -- slide 8 defines it as
            # "Zero-Day CVEs from Threat Intelligence sources", which is a
            # statement about where the CVE came from. A Tenable scan export is
            # not one of those; DCISE, a TAXII subscription and the Inoreader
            # feed are.
            TI_DOORS = ("src:tipper", "src:taxii", "src:inoreader")

            def vigor_policy_tier(src_vpr, door):
                """The tier VIGOR'S CURRENT POLICY would assign, for contrast.

                Straight off slide 8: Tenable classifies by VPR alone --
                Critical 9.0+, High 7.0-8.9, Medium 4.0-6.9, Low 0.1-3.9 -- and
                Vigor maps those onto P2..P5, with P1 reserved for zero-days
                learned from threat intel. Asset criticality appears NOWHERE in
                it, which their own deck flags.

                Computed, never written to the CVE record. It exists so the run
                can show the two answers side by side rather than assert that
                ours is better.
                """
                if door in TI_DOORS:
                    return "P1", "zero-day from a threat-intelligence source"
                if src_vpr is None:
                    return "", "no VPR -- their policy cannot tier this"
                if src_vpr >= 9.0:
                    return "P2", "VPR Critical (>= 9.0)"
                if src_vpr >= 7.0:
                    return "P3", "VPR High (7.0-8.9)"
                if src_vpr >= 4.0:
                    return "P4", "VPR Medium (4.0-6.9)"
                return "P5", "VPR Low (0.1-3.9)"

            def cvss_of(cve, fallback):
                detail = nvd.get(cve) or {}
                for key in ("cvssMetricV31", "cvssMetricV30", "cvssMetricV2"):
                    arr = (detail.get("metrics") or {}).get(key) or []
                    if arr:
                        score = (arr[0].get("cvssData") or {}).get("baseScore")
                        if score is not None:
                            return float(score), key
                if fallback is not None:
                    return float(fallback), "source-reported"
                return None, "unavailable"

            out, tally = [], {"P1": 0, "P2": 0, "P3": 0, "P4": 0, "P5": 0}
            for f in findings:
                cve = f["cve"].upper()
                score_cvss, cvss_src = cvss_of(cve, f.get("cvss_from_source"))
                e = epss.get(cve) or {}
                epss_score = float(e.get("epss") or 0.0)
                epss_pct = float(e.get("percentile") or 0.0)
                in_kev = cve in kev

                # EXPOSURE FIRST. The asset weight below is a claim about the
                # machines this CVE is actually on, and that is not known until
                # the inventory has been consulted. This used to run AFTER the
                # scoring, so `asset_w` could only ever see the hosts a source
                # report happened to name -- a CVE matched to real machines from
                # the live inventory scored its asset dimension at ZERO, and the
                # 20 points meant to represent the estate silently never landed.
                verdict, hosts_seen, exposure_why = exposure_of(
                    f, kev.get(cve), cve)

                cats = f.get("asset_categories") or []
                asset_w, asset_why = asset_weight(cats, verdict)

                # 0-100. CVSS capped at half the weight by design.
                composite = round(
                    (score_cvss or 0.0) * 5.0
                    + epss_pct * 30.0
                    + asset_w * 20.0, 1)

                if in_kev:
                    tier, tier_why = "P1", "listed in the CISA KEV catalog"
                elif composite >= band_p2:
                    tier, tier_why = "P2", "composite {} >= {}".format(composite, band_p2)
                elif composite >= band_p3:
                    tier, tier_why = "P3", "composite {} >= {}".format(composite, band_p3)
                elif composite >= band_p4:
                    tier, tier_why = "P4", "composite {} >= {}".format(composite, band_p4)
                else:
                    tier, tier_why = "P5", "composite {} below {}".format(composite, band_p4)
                tally[tier] += 1

                if score_cvss is None:
                    severity = "Minimal"
                elif score_cvss >= 9.0:
                    severity = "Critical"
                elif score_cvss >= 7.0:
                    severity = "High"
                elif score_cvss >= 4.0:
                    severity = "Medium"
                else:
                    severity = "Low"

                days = int(sla.get(tier, 90))
                detail = nvd.get(cve) or {}
                descs = detail.get("descriptions") or []
                desc = next((d.get("value") for d in descs
                             if d.get("lang") == "en"), "") or ""

                # Tenable's VPR, when a scanner door supplied one. Absent is
                # ABSENT: it is not zero and it is not a low score, and the
                # tiering below must not read it as either. Only the scanner
                # can produce this number, so leaving it empty is what makes
                # "this CVE was seen by a scanner" visible on the record.
                src_vpr = f.get("vpr_from_source")
                vpr_s = "" if src_vpr is None else "{:g}".format(round(src_vpr, 1))

                # What their CURRENT process would have said, computed from the
                # same inputs. Not written to the record -- it exists so the run
                # can show both answers instead of asserting that ours is
                # better, which is the difference between a demo and a claim.
                vigor_tier, vigor_why = vigor_policy_tier(src_vpr, source_tag)
                # A disagreement is only meaningful when their policy could
                # actually reach a verdict; "no VPR" is not a disagreement, it
                # is their policy declining to rank the CVE at all.
                policy_disagrees = bool(vigor_tier and vigor_tier != tier)

                # Did the source's own ranking disagree with the live signals?
                src_cvss = f.get("cvss_from_source")
                disagrees = bool(
                    src_cvss is not None and src_cvss >= 7.0 and epss_pct < 0.5)

                out.append({
                    "cve": cve,
                    "tier": tier,
                    "tier_reason": tier_why,
                    "composite": composite,
                    # Pre-formatted STRINGS for the string fields. Built here,
                    # in Python, because nothing in the template layer can do
                    # it: a bare interpolation is handed over as the native
                    # object, the `string` filter is not applied, and `round`
                    # returns a float. Proven at the API -- the same upsert
                    # given the float 9.8 stores "9.800000000000001"; given
                    # the string "9.8" it stores "9.8".
                    #
                    # NB: do not write a literal Jinja interpolation in a
                    # comment in here. The snippet is rendered as a template
                    # BEFORE it is Python, so an empty one is a syntax error
                    # in a comment -- which is how this very block first broke.
                    #
                    # And these strings only survive the trip when the field's
                    # template has literal text beside the interpolation. The
                    # templating layer is a NATIVE environment: a template that
                    # is nothing but a single interpolation gets literal_eval'd
                    # back into a float, and the platform then serialises that
                    # at full binary precision. Proven directly -- the same
                    # value written to `sourceData` (which has surrounding
                    # text) stored "88.4", while `vulnerabilityScore` (a bare
                    # interpolation) stored "88.40000000000001". That is why
                    # the score carries " / 100" and the percentile a "%": the
                    # suffixes read better AND they are what keeps the value a
                    # string. cVSSv3 and ePSSScore are left as bare numbers,
                    # because a CVSS score with a unit bolted on would be
                    # wrong. Every one of the four therefore carries a
                    # suffix that is TRUE rather than decorative: CVSS is
                    # scored out of 10, the composite out of 100, the EPSS
                    # score IS a probability over the next 30 days, and the
                    # percentile is a percentile. Readable and correct, and a
                    # string on arrival.
                    "composite_s": "{:g}".format(round(composite, 1)),
                    "cvss_s": "" if score_cvss is None else "{:g}".format(round(score_cvss, 1)),
                    "epss_s": "{:g}".format(round(epss_score, 6)),
                    "epss_pct_s": "{:g}".format(round(epss_pct, 4)),
                    "epss_pct_pct": "{:g}".format(round(epss_pct * 100, 2)),
                    "epss_pct": "{:g}".format(round(epss_score * 100, 2)),
                    "severity": severity,
                    "cvss": score_cvss,
                    "cvss_source": cvss_src,
                    "cvss_from_source": src_cvss,
                    "vpr": src_vpr,
                    "vpr_s": vpr_s,
                    "epss": round(epss_score, 6),
                    "epss_percentile": round(epss_pct, 4),
                    "in_kev": "Yes" if in_kev else "No",
                    # WHICH DOORS this CVE has come through. The intake's own
                    # door always; `src:cisa` additionally when CISA KEV
                    # confirms it, because a second INDEPENDENT source saying
                    # the same thing is the signal worth surfacing -- that is
                    # what "corroborated" means and it is what the upflag reads.
                    "source_tags": ([source_tag] if source_tag else []) + (
                        ["src:cisa"] if in_kev else []),
                    "severity_iri": sev_iri.get(severity, ""),
                    "in_kev_iri": yn_iri.get("Yes" if in_kev else "No", ""),
                    "kev_source_iri": src_iri.get("CISA", "") if in_kev else "",
                    "ransomware_iri": ransom_iri.get(
                        "Known" if (kev.get(cve) or {}).get(
                            "knownRansomwareCampaignUse") == "Known" else "Unknown", ""),
                    "kev_ransomware": (kev.get(cve) or {}).get(
                        "knownRansomwareCampaignUse", "Unknown"),
                    "kev_added": (kev.get(cve) or {}).get("dateAdded", ""),
                    "kev_action": (kev.get(cve) or {}).get("requiredAction", ""),
                    "vendor": (kev.get(cve) or {}).get("vendorProject", ""),
                    "product": (kev.get(cve) or {}).get("product", "")
                               or f.get("product", ""),
                    "vuln_name": (kev.get(cve) or {}).get("vulnerabilityName", "")
                                 or f.get("product", ""),
                    "description": desc[:1800],
                    "hosts": f.get("hosts") or [],
                    "host_count": f.get("host_count") or 0,
                    "asset_categories": f.get("asset_categories") or [],
                    "evidence": f.get("evidence", ""),
                    "exposure": verdict,
                    "exposure_why": exposure_why,
                    "exposed_hosts": hosts_seen,
                    "exposed_count": len(hosts_seen),
                    # What a human should actually do. An absent CVE keeps its
                    # computed tier for audit -- the external signals have not
                    # changed -- but the recommendation says plainly that there
                    # is nothing here to patch. Ranking by severity alone is
                    # what buries a queue under other people's emergencies.
                    "recommendation": (
                        "NOT PRESENT in estate -- no action ({} if present)".format(tier)
                        if verdict == "absent" else
                        "{} -- remediate within {} day(s)".format(tier, days)
                        if verdict == "present" else
                        "{} -- exposure UNKNOWN, confirm before scheduling".format(tier)),
                    "sla_days": days,
                    "asset_weight": asset_w,
                    "asset_why": asset_why,
                    # Vigor's own policy, for contrast. See vigor_policy_tier.
                    "vigor_tier": vigor_tier,
                    "vigor_why": vigor_why,
                    "policy_disagrees": policy_disagrees,
                    "due_epoch": int(time.time()) + days * 86400,
                    "source_disagrees": disagrees,
                })

                # Which fields has this run EARNED the right to overwrite?
                #
                # The upsert replaces, so an empty value is not "no change", it
                # is a deletion. These five are the ones a run can legitimately
                # fail to produce: the description needs NVD, and vendor,
                # product and the vulnerability name are only ever carried by
                # KEV entries -- so an ordinary scan export would blank all
                # four on every CVE the KEV feed had already enriched.
                #
                # Everything else is recomputed live on every run and is always
                # safe to write. "N/A" is excluded deliberately: the CSV
                # connector returns that literal for an empty cell, and letting
                # it count as a value is how a record acquires a vendor
                # actually named N/A.
                row = out[-1]
                row["updatable"] = [
                    "cVEURL", "vulnerabilityScore", "severity", "ePSSScore",
                    "ePSSPercentile", "isInKEVCatalog",
                    "knownToBeUsedInRansomwareCampaigns", "responseDueDate",
                    "action", "identifierSource", "sourceData", "attachments",
                ] + [
                    field for field, value in (
                        ("description", row["description"]),
                        ("vulnerabilityName", row["vuln_name"]),
                        ("vendorProject", row["vendor"]),
                        ("product", row["product"]),
                        ("cVSSv3", row["cvss_s"]),
                        # Scanner-only. A tipper or TAXII intake arriving after
                        # a scan must not blank the VPR the scan established,
                        # which is exactly what an unconditional write of an
                        # empty string would do.
                        ("tenableVPR", row["vpr_s"]),
                    )
                    if str(value or "").strip()
                    and str(value).strip().lower() != "n/a"
                ]

            out.sort(key=lambda r: (r["tier"], -r["composite"]))
            exposure_tally = {"present": 0, "absent": 0, "unknown": 0}
            for r in out:
                exposure_tally[r["exposure"]] += 1
            # Actively exploited AND absent -- the ruled-out set. This is the
            # answer to "which of these do we NOT have to care about", which is
            # the question a 15,000-item backlog actually needs answered.
            ruled_out = [r["cve"] for r in out
                         if r["in_kev"] == "Yes" and r["exposure"] == "absent"]

            # Every hostname this run resolved, in both the forms an asset
            # record might carry it under: the FQDN as the source wrote it and
            # the short name. Both go in because the two sides disagree about
            # which one they store -- Fleet reports VMG-WS-01.fabric.lab, a CSV
            # export's host column usually says VMG-WS-01, and an asset record
            # may hold either in `hostname` and the other in `name`.
            #
            # This exists so the asset read can be FILTERED to the handful of
            # machines this run actually named, rather than paging the whole
            # module on every intake. At three lab hosts the difference is
            # nothing; at an estate of thousands it is a targeted lookup
            # instead of a full scan.
            # CVEs whose source-reported ranking disagreed with the live
            # signals. Surfaced in the comment rather than silently re-ranked.
            disagreements = [r for r in out if r["source_disagrees"]]

            hosts_wanted = []
            for r in out:
                for h in r["exposed_hosts"]:
                    for form in (str(h).strip(), str(h).strip().split(".")[0]):
                        low = form.lower()
                        if low and low not in hosts_wanted:
                            hosts_wanted.append(low)

            # A door that names no hosts -- a PDF advisory, a TAXII feed --
            # leaves this empty, and an `in` filter handed an empty list is not
            # a filter that matches nothing; it is undefined and can match
            # EVERYTHING. The sentinel is a hostname no machine can hold, so
            # the read stays well-formed and returns zero rows.
            if not hosts_wanted:
                hosts_wanted = ["no-such-host.invalid"]

            return {
                "classified": out,
                "count": len(out),
                "tally": tally,
                "p1_p2": tally["P1"] + tally["P2"],
                "kev_count": sum(1 for r in out if r["in_kev"] == "Yes"),
                "exposure_tally": exposure_tally,
                "inventory_ok": "yes" if inventory_ok else "no",
                "ruled_out": ruled_out,
                "ruled_out_count": len(ruled_out),
                "hosts_wanted": hosts_wanted,
                "present_count": exposure_tally["present"],
                "absent_count": exposure_tally["absent"],
                "unknown_count": exposure_tally["unknown"],
                # NVD coverage. A run that lost NVD still produces records,
                # scored from EPSS + KEV + whatever the source carried -- but
                # it is a WEAKER run and must say so rather than looking
                # identical to a complete one.
                "nvd_missing": nvd_missing,
                "nvd_missing_count": len(nvd_missing),
                "disagreement_count": len(disagreements),
                # How many CVEs this run tiers DIFFERENTLY from Vigor's current
                # VPR-only policy. The headline number for the prioritisation
                # conversation: it is the size of the gap asset criticality and
                # live exploitation data open up.
                # The reason names the two signals a VPR-only policy does not
                # have -- live exploitation probability and which machines the
                # CVE is on. Reporting the exposure sentence here instead would
                # describe the CVE rather than the DISAGREEMENT, which is the
                # one thing this line exists to explain.
                "policy_disagreements": [
                    {"cve": r["cve"], "ours": r["tier"],
                     "theirs": r["vigor_tier"],
                     "why": "EPSS {}th percentile, asset weight {:g} -- {}".format(
                         r["epss_pct_pct"], r["asset_weight"], r["asset_why"])}
                    for r in out if r["policy_disagrees"]],
                "policy_disagreement_count": len(
                    [r for r in out if r["policy_disagrees"]]),
                "disagreements": [r["cve"] for r in disagreements],
                "top": out[0] if out else {},
            }
        next: Resolve Assets

      - name: Resolve Assets
        type: find_record
        module: assets
        comment: >
          The asset records for the machines THIS run named, and only those.

          Filtered rather than a match-all page of the module, and read AFTER
          scoring rather than before, because the hostnames are not known until
          exposure has been resolved. `logic: OR` across both `hostname` and
          `name` because the two sides disagree about which one they store: a
          Fleet-made record holds the FQDN in `hostname` and the short name in
          `name`, a hand-made one often has only one of them. Score And Tier
          emits both forms of every host for exactly this filter.

          This playbook does NOT create the assets it cannot find. Creation
          belongs to the Fleet estate sync, which owns every other field on an
          asset -- IP, MAC, OS, serial -- and matches on these same two fields.
          Two writers for one module is how you get a second record for a
          machine already present. Hosts with no record are REPORTED by Bind
          Asset Links instead, so the gap is visible rather than silent.
        filters:
          - {field: hostname, operator: in, value: "{{ vars.steps.Score_And_Tier.data.code_output.hosts_wanted }}"}
          - {field: name, operator: in, value: "{{ vars.steps.Score_And_Tier.data.code_output.hosts_wanted }}"}
        logic: OR
        limit: 500
        next: Bind Asset Links

      - name: Bind Asset Links
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Turns each CVE's affected hostnames into the asset IRIs the upsert
          links, and names the hosts it could not resolve.

          One resolver over one index, so a hostname decides the same way for
          every CVE in the run. No writes happen here.
        params:
          code: |
            import json

            def rows(step):
                """find_record returns the bare row LIST at run time even
                though it compiles as the Hydra envelope. Accept either -- the
                same normalisation the ticketing leg needs, for the same
                reason."""
                if isinstance(step, dict):
                    return step.get("hydra:member") or []
                return step or []

            assets = rows(json.loads(r'''{{ vars.steps.Resolve_Assets | tojson }}'''))
            scored = json.loads(r'''{{ vars.steps.Score_And_Tier.data.code_output | tojson }}''')
            # A code_output can arrive already-decoded or as a JSON string
            # depending on the connector's mood; the estate sync normalises the
            # same way for the same reason.
            if isinstance(scored, str):
                scored = json.loads(scored)

            # Both forms of every hostname, so a CVE naming the FQDN and an
            # asset holding the short name still meet.
            iri_of = {}
            for a in assets:
                for key in (a.get("hostname"), a.get("name")):
                    if key:
                        k = str(key).strip().lower()
                        iri_of.setdefault(k, a.get("@id"))
                        iri_of.setdefault(k.split(".")[0], a.get("@id"))

            classified = scored.get("classified") or []
            linked, unresolved = 0, []
            for r in classified:
                found = []
                for h in r.get("exposed_hosts") or []:
                    key = str(h).strip().lower()
                    # De-duplicated because the FQDN and the short name of one
                    # machine legitimately resolve to the SAME asset, and a
                    # relation array holding an IRI twice is a write the
                    # platform has to reconcile for nothing.
                    iri = iri_of.get(key) or iri_of.get(key.split(".")[0])
                    if iri:
                        if iri not in found:
                            found.append(iri)
                    elif key and key not in unresolved:
                        unresolved.append(key)
                r["asset_iris"] = found
                if found:
                    linked += 1

            return {
                # The SAME rows the upsert would have iterated, with
                # `asset_iris` filled in. Returning the whole list rather than
                # a side table keeps the upsert's for_each on a single source
                # and leaves every other field Score And Tier computed intact.
                "classified": classified,
                "count": len(classified),
                "linked_cve_count": linked,
                "asset_total": len(assets),
                # Hosts a source named that the Asset module has never seen.
                # NOT an error and NOT created here -- the Fleet estate sync
                # owns asset creation. Reported so the gap is visible: without
                # this the upsert simply links nothing, the run stays green,
                # and a CVE that says "present on SRV-DB-02" quietly points at
                # no machine at all.
                "unresolved_hosts": unresolved,
                "unresolved_count": len(unresolved),
            }
        next: Upsert CVE Records

      - name: Upsert CVE Records
        type: create_record
        module: c_v_es
        is_upsert: true
        link:
          recordTags: "{{ vars.item.source_tags }}"
          # The machines this CVE was found on. `link:` and NOT a `fields:`
          # write, for exactly the reason the tags use it: a link ACCUMULATES
          # where a field write REPLACES. A TAXII advisory carries no hosts at
          # all, so writing `assets` as a field would blank the estate a
          # scanner export had established the day before -- the same class of
          # loss that moved provenance off `identifierSource` and onto tags.
          #
          # An empty list is a no-op rather than an unlink, which is what makes
          # a host-less door safe to run against an already-linked CVE.
          assets: "{{ vars.item.asset_iris }}"
        comment: >
          Upserted on cVEID, so the same CVE arriving from a PDF today and a
          CSV next week converges on one record rather than accumulating
          duplicates.

          The numeric fields read the `_s` values Score And Tier pre-formats
          in Python, never the raw floats. These are STRING fields, and a bare
          `{{ }}` expression is handed over as the NATIVE object -- so a float
          arrives as a float and the platform serialises it at full binary
          precision: 9.8 stored as 9.800000000000001, a composite of 88.4 as
          88.40000000000001. Proven at the API: the same upsert given the
          string "9.8" stores "9.8". Neither `| string` nor `| round(1)` fixes
          it from here -- the first is not applied, the second returns a float. `identifierSource` records which door it came through and
          `responseDueDate` starts the SLA clock the tier just set.
        fields:
          cVEID: "{{ vars.item.cve }}"
          cVEURL: "https://nvd.nist.gov/vuln/detail/{{ vars.item.cve }}"
          description: "{{ vars.item.description }}"
          vulnerabilityName: "{{ vars.item.vuln_name }}"
          vendorProject: "{{ vars.item.vendor }}"
          product: "{{ vars.item.product }}"
          cVSSv3: "{{ vars.item.cvss_s }} / 10"
          vulnerabilityScore: "{{ vars.item.composite_s }} / 100"
          severity: "{{ vars.item.severity_iri }}"
          ePSSScore: "{{ vars.item.epss_pct }}% in 30 days"
          ePSSPercentile: "{{ vars.item.epss_pct_pct }}%"
          # Tenable's own priority score, verbatim, and ONLY when a scanner
          # door supplied one. It is never derived: CVSS comes from NVD and
          # EPSS from FIRST, but VPR is Tenable-proprietary, so a computed
          # number in this field would be read as Tenable's opinion when it is
          # ours. `updatable` keeps a VPR-less door from blanking it.
          tenableVPR: "{{ vars.item.vpr_s }}"
          isInKEVCatalog: "{{ vars.item.in_kev_iri }}"
          knownToBeUsedInRansomwareCampaigns: "{{ vars.item.ransomware_iri }}"
          responseDueDate: "{{ vars.item.due_epoch }}"
          action: "{{ vars.item.recommendation }}"
          identifierSource: "{{ vars.input.params.source_kind }}: {{ vars.input.params.source_name }}"
          sourceData: "{{ vars.item.evidence }} | exposure: {{ vars.item.exposure }} -- {{ vars.item.exposure_why }}"
          # Provenance: the CVE record points back at the exact file it was
          # read from, so "where did this come from" is a click and not an
          # archaeology exercise.
          #
          # EMITTED AS A LIST EXPRESSION, NOT AS ["{{ ... }}"]. A caller with no
          # file behind it -- UC-15 pulls the same CVEs off a TAXII
          # subscription -- passes `source_ref: ""`, and a relation array
          # holding one empty IRI is rejected by /api/3/upsert with a bare
          # `400 Internal Server Error`, AFTER every KEV/EPSS/NVD call has been
          # paid for. The templating layer is native, so this interpolation
          # evaluates to a real list and an absent source omits the relation
          # instead of sending an empty one. File-borne intake is unchanged.
          attachments: "{{ [vars.input.params.source_ref] if vars.input.params.source_ref else [] }}"
          # Uniqueness-conflict handling, for a CVE that already exists.
          # `__replace` alone updates EVERY field and so erases whatever this
          # run could not fetch; `__fieldsToUpdate` narrows that to the fields
          # the run actually filled, which Score And Tier decides per CVE.
          # Measured on 8.0 -- with the list, an unlisted field survives the
          # upsert untouched; without it, the same write overwrites it.
          __replace: "true"
          __fieldsToUpdate: "{{ vars.item.updatable }}"
        for_each:
          # Bind Asset Links, not Score And Tier. It returns the SAME rows with
          # `asset_iris` resolved against the estate as it stands after any
          # missing assets were created; every other field is Score And Tier's,
          # untouched.
          item: "{{ vars.steps.Bind_Asset_Links.data.code_output.classified }}"
        next: Ticket Candidates

      # ---------------------------------------------------------- ticketing
      # Classification nobody acts on is a report. This leg is what turns it
      # into work: the CVEs that cleared the bar become tickets in the ITSM,
      # de-duplicated so that one CVE is one ticket no matter how many times
      # it arrives or which door it came through.
      #
      # It runs AFTER the upsert, deliberately. The ticket quotes the CVE
      # record's own location and the CVE record carries the ticket key back
      # as a `jira:<KEY>` tag; neither is possible before the record exists.
      #
      # The label convention -- the lowercased CVE id -- is UC-06's. That is
      # not a coincidence and it is the point: a ticket UC-06 opened from a
      # scanner finding is found by this playbook's search, and vice versa.
      # Two intake paths, one ticket per CVE.

      - name: Ticket Candidates
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Decides what deserves a ticket, and it is NOT simply "the high
          scores". A CVE the estate does not run is not work, however
          frightening it looks -- so `absent` is excluded even at P1. That is
          the same judgement the Summary Comment reports as "ruled out", spent
          here rather than merely narrated.

          `unknown` exposure is NOT excluded. "We could not tell" is a reason
          to raise the question with a human, which is what a ticket is for.
        params:
          code: |
            import json

            classified = json.loads(r'''{{ vars.steps.Score_And_Tier.data.code_output.classified | tojson }}''')
            if isinstance(classified, str):
                classified = json.loads(classified)

            # Scalars only across a workflow_reference boundary, so the tier
            # list arrives as a comma-separated string rather than a list.
            tiers = [t.strip().upper()
                     for t in '''{{ vars.input.params.ticket_tiers }}'''.split(",")
                     if t.strip()] or ["P1", "P2"]

            # Jira's priority ladder, which is not the same vocabulary as the
            # SLA tier. Mapping it here keeps the ITSM's names out of the
            # scoring code.
            LADDER = {"P1": "Highest", "P2": "High", "P3": "Medium",
                      "P4": "Low", "P5": "Lowest"}

            source_kind = '''{{ vars.input.params.source_kind }}'''
            source_name = '''{{ vars.input.params.source_name }}'''

            candidates = []
            for r in classified:
                if r["tier"] not in tiers:
                    continue
                if r["exposure"] == "absent":
                    continue
                cve = r["cve"]
                candidates.append({
                    "cve": cve,
                    "label": cve.lower(),
                    "tier": r["tier"],
                    "priority": LADDER.get(r["tier"], "Medium"),
                    "composite": r["composite_s"],
                    "cvss": r["cvss_s"],
                    "epss": r["epss_pct"],
                    "in_kev": r["in_kev"],
                    "ransomware": r["kev_ransomware"],
                    "exposure": r["exposure"],
                    "exposure_why": r["exposure_why"],
                    "exposed_hosts": r["exposed_hosts"],
                    # Carried so the ticket can group by AFFECTED ITEM rather
                    # than list CVEs flat. `product` is the KEV product name
                    # falling back to the finding's own -- see Score And Tier.
                    "product": r.get("product") or "",
                    "vendor": r.get("vendor") or "",
                    "sla_days": r["sla_days"],
                    "recommendation": r["recommendation"],
                    "evidence": r["evidence"],
                    "vuln_name": r["vuln_name"],
                    "summary": "{} -- {} ({}/100){}".format(
                        cve, r["vuln_name"] or "vulnerability",
                        r["composite_s"],
                        ", actively exploited" if r["in_kev"] == "Yes" else ""),
                })

            # One search for the whole batch. The alternative -- a query per
            # CVE -- is the shape that makes a 200-CVE export take an hour.
            clause = ", ".join('"%s"' % c["label"] for c in candidates)

            # ---- the grouped rollup ------------------------------------
            # Grouped by AFFECTED ITEM (product), because that is the unit of
            # work: one product on N devices is one upgrade, whatever the CVE
            # count. A flat CVE list makes the reader do that grouping in
            # their head every time -- and get it wrong when the same product
            # appears four rows apart.
            RANK = {"P1": 1, "P2": 2, "P3": 3, "P4": 4, "P5": 5}

            groups = {}
            for c in candidates:
                key = c["product"] or c["vuln_name"] or "unattributed"
                g = groups.setdefault(key, {
                    "product": key, "vendor": c["vendor"],
                    "cves": [], "devices": set(), "worst": "P5",
                })
                g["cves"].append(c)
                for host in str(c["exposed_hosts"] or "").replace(";", ",").split(","):
                    host = host.strip()
                    if host and host.lower() not in ("none", "unknown"):
                        g["devices"].add(host)
                if RANK.get(c["tier"], 9) < RANK.get(g["worst"], 9):
                    g["worst"] = c["tier"]

            ordered = sorted(groups.values(),
                             key=lambda g: (RANK.get(g["worst"], 9), -len(g["cves"])))
            all_devices = sorted({d for g in ordered for d in g["devices"]})

            lines = []
            for g in ordered:
                devices = sorted(g["devices"])
                lines.append("")
                lines.append("{0}{1} -- {2}, {3} CVE(s), {4} device(s)".format(
                    g["product"],
                    " ({0})".format(g["vendor"]) if g["vendor"] else "",
                    g["worst"], len(g["cves"]), len(devices)))
                lines.append("  Devices: {0}".format(
                    ", ".join(devices) if devices else "none recorded"))
                for c in sorted(g["cves"], key=lambda x: RANK.get(x["tier"], 9)):
                    lines.append(
                        "  {0}  {1}  composite {2}/100  EPSS {3}%  KEV {4}".format(
                            c["cve"], c["tier"], c["composite"], c["epss"], c["in_kev"]))

            header = [
                "AFFECTED ITEMS -- {0} product(s), {1} CVE(s), {2} device(s)".format(
                    len(ordered), len(candidates), len(all_devices)),
                "Grouped by product: one product on N devices is one upgrade.",
                "",
                "Devices in scope: {0}".format(
                    ", ".join(all_devices) if all_devices else "none recorded"),
            ]
            body = chr(10).join(header + lines)

            # Every CVE id is a label, alongside the anchor. The anchor is the
            # ticket's identity; the CVE labels are what let any other playbook
            # (UC-06 included) still resolve a CVE to this one ticket.
            anchor = "{{ vars.input.params.ticket_anchor_label }}".strip() or "vuln-management"
            labels = [anchor, "fortisoar"] + [c["label"] for c in candidates]

            return {
                "candidates": candidates,
                "count": len(candidates),
                "cves": [c["cve"] for c in candidates],
                "labels_clause": ("labels in (%s)" % clause) if clause else "",
                "source": "%s %s" % (source_kind, source_name),
                "tiers": ",".join(tiers),
                "anchor": anchor,
                "labels": labels,
                "labels_json": json.dumps(labels),
                "grouped_body": body,
                "group_count": len(ordered),
                "device_count": len(all_devices),
                "devices": ", ".join(all_devices) or "none recorded",
                "ticket_summary": "Vulnerability remediation -- {0} product(s), {1} CVE(s), {2} device(s)".format(
                    len(ordered), len(candidates), len(all_devices)),
            }
        next: Ticket Gate

      - name: Ticket Gate
        type: decision
        comment: >
          Three outcomes, and the middle one matters. `ticketing_enabled`
          ships as "no" so that the scoring and the de-duplication can be
          reviewed against real data before the playbook is allowed to write
          into the ITSM -- the dry run posts the exact payload it would have
          sent. That is the mode you want during a change-controlled rollout,
          not a stub.
        conditions:
          - display: nothing met the bar
            when: "{{ vars.steps.Ticket_Candidates.data.code_output.count | int == 0 }}"
            next: Summary Comment
          - display: ticketing live
            when: "{{ vars.input.params.ticketing_enabled | default('no', true) | lower == 'yes' }}"
            next: Find CVE Records
        default: Dry Run Ticket Comment

      - name: Find CVE Records
        type: find_record
        module: c_v_es
        comment: >
          The IRIs of the records the upsert just wrote, so the ticket key can
          be written back onto them. Scoped by `identifierSource` -- the same
          scoping the test suite uses -- because the CVE module is shared with
          every other thing on this appliance that writes CVEs.
        filters:
          - field: identifierSource
            operator: eq
            value: "{{ vars.input.params.source_kind }}: {{ vars.input.params.source_name }}"
        limit: 200
        next: Search Tickets

      - name: Search Tickets
        type: connector
        connector: jira
        operation: list_tickets
        config: "{{ vars.input.params.jira_config }}"
        comment: >
          The ticketing system is authoritative, not anything we stored. A
          ticket may have been opened by hand, or by UC-06 off a scanner
          finding, or our tag may have been lost -- and in every one of those
          cases filing a second ticket is the failure this leg exists to
          prevent.

          `statusCategory != Done` is deliberate: a CVE that comes back after
          its ticket was closed is new work and should open a new ticket.
        params:
          jql_query: "project = {{ vars.input.params.jira_project }} AND labels = \"{{ vars.steps.Ticket_Candidates.data.code_output.anchor }}\" AND statusCategory != Done ORDER BY created ASC"
          maxResults: 100
          start_time: ""
          nextPageToken: ""
          fields: "key,summary,priority,status,labels"
        next: Reconcile Tickets

      - name: Reconcile Tickets
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Pairs each candidate with the open ticket already tracking it, by
          label rather than by summary text -- a summary carries a score that
          moves between runs, and matching on it would file a duplicate every
          time the score changed.
        params:
          code: |
            import json

            candidates = json.loads(r'''{{ vars.steps.Ticket_Candidates.data.code_output.candidates | tojson }}''')
            if isinstance(candidates, str):
                candidates = json.loads(candidates)

            issues = json.loads(r'''{{ vars.steps.Search_Tickets.data.issues | default([], true) | tojson }}''')
            if isinstance(issues, str):
                issues = json.loads(issues)

            # Read the WHOLE step and normalise, rather than reaching for one
            # key. A find_record step does not return the shape its compile-
            # time schema advertises: the schema names hydra keys, and
            # subscripting ['hydra:member'] yielded an EMPTY list at run time
            # while the identical query over the REST API returned five rows.
            # Every plausible shape is handled here, and the one actually seen
            # is reported in the receipt -- guessing wrong costs a whole run
            # to discover, and the run stays green while it happens.
            raw = json.loads(r'''{{ vars.steps.Find_CVE_Records | default([], true) | tojson }}''')
            if isinstance(raw, str):
                raw = json.loads(raw)
            shape = type(raw).__name__
            if isinstance(raw, dict):
                shape = "dict:" + ",".join(sorted(raw)[:6])
                records = (raw.get("hydra:member") or raw.get("data")
                           or raw.get("records") or [])
                if isinstance(records, dict):
                    records = records.get("hydra:member") or []
            elif isinstance(raw, list):
                records = raw
            else:
                records = []

            # cve id -> {iri, tags}. The tag list is read back so the ledger
            # entry is ADDED to whatever else the record carries rather than
            # replacing it.
            by_cve = {}
            for rec in records:
                cve = (rec.get("cVEID") or "").upper()
                if cve:
                    by_cve[cve] = {
                        "iri": rec.get("@id") or "",
                        "tags": [t if isinstance(t, str) else (t or {}).get("name")
                                 for t in (rec.get("recordTags") or [])],
                    }

            # label -> issue key, first (newest) wins.
            # ONE TICKET. The search was scoped to the anchor label, so any
            # issue that came back IS the ticket -- there is no per-CVE
            # matching left to do. Oldest-open wins (JQL orders ASC) if two
            # ever exist, because the older one carries the history.
            existing = ""
            existing_labels = []
            for iss in issues:
                existing = iss.get("key") or ""
                existing_labels = [str(x) for x in
                                   ((iss.get("fields") or {}).get("labels") or [])]
                break

            enriched = []
            for c in candidates:
                rec = by_cve.get(c["cve"], {})
                enriched.append(dict(c, iri=rec.get("iri", ""),
                                     tags=rec.get("tags") or []))

            # Labels accumulate. Jira replaces the label array wholesale, so
            # the UNION has to be sent every time -- posting only this run's
            # CVEs would silently drop every CVE the ticket already tracked,
            # and the ticket would still look correct.
            known = {str(x).lower() for x in existing_labels}

            # THE ANCHOR GOES ON FIRST, and it is the one label that must never
            # be omitted: every search in this leg -- the dedupe search before
            # filing and the re-read that recovers the key after -- is scoped
            # to it. File the ticket without it and both searches come back
            # empty, so no `jira:` tag is written and the NEXT intake opens a
            # second ticket, which is precisely what the single-ticket design
            # exists to prevent. `existing_labels` carries it on an update, but
            # is empty on the create, so it cannot be relied on to supply it.
            anchor = "{{ vars.input.params.ticket_anchor_label }}".strip() or "vuln-management"
            merged, seen = [], set()
            for lab in ([anchor] + list(existing_labels)
                        + [c["label"] for c in enriched] + ["fortisoar"]):
                low = str(lab).lower()
                if lab and low not in seen:
                    seen.add(low)
                    merged.append(str(lab))

            new_cves = [c["cve"] for c in enriched if c["label"].lower() not in known]

            return {
                "ticket_key": existing,
                "action": "update" if existing else "create",
                "labels": merged,
                "labels_json": json.dumps(merged),
                "new_cves": ", ".join(new_cves) or "none",
                "new_count": len(new_cves),
                "all_count": len(enriched),
                "linkable": enriched,
                # Reported, not just used. If the CVE records cannot be located
                # the tickets are still filed correctly and only the ledger is
                # missing -- a failure that is invisible until the NEXT intake
                # duplicates a ticket, by which time nobody connects the two.
                "records_located": len(by_cve),
                "records_raw": len(records),
                "records_shape": shape,
                # Named here so the summary can state it without recomputing.
                "tracked_cves": ", ".join(c["cve"] for c in enriched) or "none",
            }
        next: File Tickets

      - name: File Tickets
        type: connector
        connector: jira
        operation: create_ticket
        config: "{{ vars.input.params.jira_config }}"
        comment: >
          One ticket per CVE that cleared the bar and has no open ticket yet.
          The description is written for whoever picks the ticket up cold: what
          it is, why it scored where it did, whether it is being exploited
          today, whether this estate actually runs the affected software, and
          the line of the source document it came out of.
        when: "{{ vars.steps.Reconcile_Tickets.data.code_output.action == 'create' }}"
        params:
          project_key: "{{ vars.input.params.jira_project }}"
          ticket_summary: "{{ vars.steps.Ticket_Candidates.data.code_output.ticket_summary }}"
          issue_type: "Task"
          priority: "Highest"
          parent: ""
          ticket_description: >
            {{ vars.steps.Ticket_Candidates.data.code_output.grouped_body }}


            Opened from: {{ vars.steps.Ticket_Candidates.data.code_output.source }}.

            This is the standing vulnerability-remediation ticket. Every later
            intake regroups the affected items above and comments what changed,
            rather than opening another ticket.
          other_fields: '{"labels": {{ vars.steps.Reconcile_Tickets.data.code_output.labels_json }}}'
        next: Regroup Ticket

      - name: Regroup Ticket
        type: connector
        connector: jira
        operation: update_ticket
        config: "{{ vars.input.params.jira_config }}"
        when: "{{ vars.steps.Reconcile_Tickets.data.code_output.action == 'update' }}"
        comment: >
          The affected items are REGROUPED IN PLACE, not appended. The
          description is rewritten from the current candidate set every run, so
          the ticket always shows one accurate grouping of products, devices
          and CVEs rather than a stack of historical fragments a reader has to
          reconcile by hand.

          What changed is recorded as a comment by the next step. That split is
          deliberate: the description answers "what is the situation now", the
          comments answer "what happened when", and trying to make one field do
          both is what makes long-lived tickets unreadable.

          Labels are sent as the full union, because Jira replaces the label
          array wholesale -- posting only this run's CVEs would silently drop
          every CVE the ticket already tracked while still looking correct.
        params:
          issue_key: "{{ vars.steps.Reconcile_Tickets.data.code_output.ticket_key }}"
          project_key: "{{ vars.input.params.jira_project }}"
          summary: "{{ vars.steps.Ticket_Candidates.data.code_output.ticket_summary }}"
          description: >
            {{ vars.steps.Ticket_Candidates.data.code_output.grouped_body }}


            Last regrouped from: {{ vars.steps.Ticket_Candidates.data.code_output.source }}.
          status: ""
          priority: "Highest"
          comment: >
            {{ vars.steps.Ticket_Candidates.data.code_output.source }} reported
            {{ vars.steps.Reconcile_Tickets.data.code_output.all_count }} qualifying CVE(s)
            across {{ vars.steps.Ticket_Candidates.data.code_output.group_count }} product(s)
            and {{ vars.steps.Ticket_Candidates.data.code_output.device_count }} device(s).

            Reported in this intake: {{ vars.steps.Reconcile_Tickets.data.code_output.tracked_cves }}.

            New to this ticket: {{ vars.steps.Reconcile_Tickets.data.code_output.new_cves }}.

            Devices in scope: {{ vars.steps.Ticket_Candidates.data.code_output.devices }}.

            The affected-items grouping in the description has been updated.
          other_fields: '{"labels": {{ vars.steps.Reconcile_Tickets.data.code_output.labels_json }}}'
        next: Reread Tickets


      - name: Reread Tickets
        type: connector
        connector: jira
        operation: list_tickets
        config: "{{ vars.input.params.jira_config }}"
        comment: >
          The same search again, now that the tickets exist. This is how the
          new keys are recovered, and it is deliberate rather than lazy: a
          `for_each` step's result is a list of LOOP envelopes carrying the
          body's own keys and a task_id, NOT the connector's payload -- so
          reading `File_Tickets[i].key` returns nothing. It returns nothing
          QUIETLY, which is the dangerous part: the tickets were filed, the run
          went green, and every CVE record was left with no ticket on it, so
          the next intake would have de-duplicated against a ledger that was
          never written. Caught only because the ledger is asserted separately
          from the ticket.
        params:
          jql_query: "project = {{ vars.input.params.jira_project }} AND labels = \"{{ vars.steps.Ticket_Candidates.data.code_output.anchor }}\" AND statusCategory != Done ORDER BY created ASC"
          maxResults: 100
          start_time: ""
          nextPageToken: ""
          fields: "key,summary,labels"
        next: Collect Ticket Keys

      - name: Collect Ticket Keys
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Pairs every candidate with the ticket that now tracks it, read back
          from the ticketing system rather than inferred from what we just
          asked it to do. A ticket the create step reported and the search
          cannot see is not a ticket, and should not be written into a ledger
          as though it were.
        params:
          code: |
            import json

            def loads(raw):
                v = json.loads(raw)
                return json.loads(v) if isinstance(v, str) else v

            tracked = loads(r'''{{ vars.steps.Reconcile_Tickets.data.code_output.linkable | tojson }}''')
            issues = loads(r'''{{ vars.steps.Reread_Tickets.data.issues | default([], true) | tojson }}''')
            action = "{{ vars.steps.Reconcile_Tickets.data.code_output.action }}"

            # ONE key for every CVE, read back from the ticketing system rather
            # than inferred from what we just asked it to do. The re-read is
            # still scoped to the anchor label, so whatever comes back IS the
            # ticket -- but if it comes back empty the tickets were not filed,
            # and writing a ledger entry anyway is how a record ends up
            # pointing at a ticket that does not exist.
            key = ""
            for iss in issues:
                key = iss.get("key") or ""
                break

            linked = []
            for c in tracked:
                linked.append(dict(c, ticket_key=key,
                                   ticket_action="created" if action == "create" else "updated"))
            opened = ["%s -> %s" % (c["cve"], key) for c in tracked if key]

            # The ledger entry, expressed as a DELTA rather than as the whole
            # tag list. Writing the whole list means writing back a snapshot
            # read seconds ago, so any tag another writer added in between --
            # a src: door, a human -- is silently destroyed. The link path
            # adds and the unlink path removes, and neither one has an opinion
            # about the tags it was not told about.
            #
            # Any previous jira: tag is dropped rather than accumulated: a
            # record carrying two ticket keys is worse than one carrying none,
            # because it looks correct.
            for row in linked:
                key_tag = "jira:%s" % row["ticket_key"] if row.get("ticket_key") else ""
                row["add_tags"] = [key_tag] if key_tag else []
                row["drop_tags"] = [
                    t for t in (row.get("tags") or [])
                    if t and str(t).lower().startswith("jira:") and t != key_tag
                ]

            ledgerable = [r for r in linked if r.get("iri") and r.get("ticket_key")]

            return {
                "linked": ledgerable,
                "opened": opened,
                "opened_count": len(opened),
                "ticket_key": key,
                "tracked_count": len(tracked),
                "ledger_count": len(ledgerable),
                "keys": [r["ticket_key"] for r in linked if r.get("ticket_key")],
            }
        next: Link Tickets

      - name: Link Tickets
        type: update_record
        module: c_v_es
        record: "{{ vars.item.iri }}"
        comment: >
          Writes `jira:<KEY>` onto the CVE record, so the ticket is one click
          from the vulnerability and the next run de-duplicates without
          needing to guess.

          `link:`/`unlink:` rather than a `recordTags:` field write. A field
          write REPLACES the tag set, so it can only be correct by reading the
          current tags first and writing them all back -- which quietly
          destroys anything added since that read, including the `src:` door
          tags this same intake wrote.
        link:
          recordTags: "{{ vars.item.add_tags }}"
        unlink:
          recordTags: "{{ vars.item.drop_tags }}"
        for_each:
          item: "{{ vars.steps.Collect_Ticket_Keys.data.code_output.linked }}"
        next: Ticket Result Comment

      - name: Ticket Result Comment
        type: create_record
        module: comments
        comment: >
          The ticketing receipt, posted on the LIVE branch and nowhere else.

          It could have been a paragraph inside Summary Comment, and it was
          until the compiler pointed out that this makes Summary Comment read
          a step that does not exist on the dry-run or nothing-qualified
          branches. Jinja guards happened to make that safe, but "safe because
          the surrounding {% raw %}{% if %}{% endraw %} is false" is a property
          nobody will preserve through the next edit.
        fields:
          attachments: "{{ [vars.input.params.source_ref] if vars.input.params.source_ref else [] }}"
          content: >
            <p><b>Ticketing complete --
            {{ vars.steps.Collect_Ticket_Keys.data.code_output.opened_count }}
            ticket(s) opened,
            {{ vars.steps.Collect_Ticket_Keys.data.code_output.updated_count }}
            existing ticket(s) updated</b> in
            <code>{{ vars.input.params.jira_project }}</code>.</p>
            {% if vars.steps.Collect_Ticket_Keys.data.code_output.opened %}
            <p><b>Opened:</b>
            {{ vars.steps.Collect_Ticket_Keys.data.code_output.opened | join(', ') }}</p>
            {% endif %}
            {% if vars.steps.Reconcile_Tickets.data.code_output.updated_cves %}
            <p><b>Already tracked, so annotated instead of duplicated:</b>
            {{ vars.steps.Reconcile_Tickets.data.code_output.updated_cves | join(', ') }}</p>
            {% endif %}
            <p>{{ vars.steps.Collect_Ticket_Keys.data.code_output.ledger_count }}
            CVE record(s) now carry their ticket key as a <code>jira:</code>
            tag, so the next intake de-duplicates against it.
            {% if not vars.steps.Collect_Ticket_Keys.data.code_output.ledger_count %}
            <b>The ledger could not be written</b> --
            {{ vars.steps.Reconcile_Tickets.data.code_output.records_raw }}
            CVE record(s) came back from the lookup and
            {{ vars.steps.Reconcile_Tickets.data.code_output.records_located }}
            carried a usable id (the lookup returned
            <code>{{ vars.steps.Reconcile_Tickets.data.code_output.records_shape }}</code>). The tickets above are real; the link back from
            the CVE record is not.
            {% endif %}</p>
        next: Summary Comment

      - name: Dry Run Ticket Comment
        type: create_record
        module: comments
        comment: >
          What would have been filed, in full, so it can be reviewed before
          anything is allowed to write to the ITSM.
        fields:
          attachments: "{{ [vars.input.params.source_ref] if vars.input.params.source_ref else [] }}"
          content: >
            <p><b>Ticketing is disabled -- no tickets were filed.</b></p>
            <p>{{ vars.steps.Ticket_Candidates.data.code_output.count }} CVE(s)
            cleared the bar
            (tiers {{ vars.steps.Ticket_Candidates.data.code_output.tiers }},
            excluding anything not present in the estate):
            {{ vars.steps.Ticket_Candidates.data.code_output.cves | join(', ') }}.</p>
            <p>Set <code>ticketing_enabled</code> to <code>yes</code> in the
            Intake Config step to file these into
            <code>{{ vars.input.params.jira_project }}</code>.</p>
        next: Summary Comment

      - name: Summary Comment
        type: create_record
        module: comments
        comment: >
          The receipt. It names the source, the tier split, and every CVE where
          the source's own ranking disagreed with the live signals -- which is
          the finding an analyst most needs and is least likely to go looking
          for.
        fields:
          attachments: "{{ [vars.input.params.source_ref] if vars.input.params.source_ref else [] }}"
          content: >
            <p><b>CVE intake complete --
            {{ vars.steps.Score_And_Tier.data.code_output.count }} CVE(s) from
            {{ vars.input.params.source_kind }}
            <code>{{ vars.input.params.source_name }}</code>.</b></p>
            <p><b>Tier split:</b>
            P1 {{ vars.steps.Score_And_Tier.data.code_output.tally.P1 }} &middot;
            P2 {{ vars.steps.Score_And_Tier.data.code_output.tally.P2 }} &middot;
            P3 {{ vars.steps.Score_And_Tier.data.code_output.tally.P3 }} &middot;
            P4 {{ vars.steps.Score_And_Tier.data.code_output.tally.P4 }} &middot;
            P5 {{ vars.steps.Score_And_Tier.data.code_output.tally.P5 }}</p>
            <p><b>Actively exploited (CISA KEV):</b>
            {{ vars.steps.Score_And_Tier.data.code_output.kev_count }}</p>
            <p><b>Present in the estate:</b>
            {{ vars.steps.Score_And_Tier.data.code_output.present_count }} &middot;
            <b>not present:</b>
            {{ vars.steps.Score_And_Tier.data.code_output.absent_count }} &middot;
            <b>could not tell:</b>
            {{ vars.steps.Score_And_Tier.data.code_output.unknown_count }}
            {% if vars.steps.Score_And_Tier.data.code_output.inventory_ok == 'no' %}
            <i>(the software inventory was unreachable, so exposure was not
            established for anything in this run)</i>
            {% endif %}</p>
            {% if vars.steps.Score_And_Tier.data.code_output.ruled_out_count %}
            <p><b>Ruled out --
            {{ vars.steps.Score_And_Tier.data.code_output.ruled_out_count }}
            actively-exploited CVE(s) that do NOT exist here:</b>
            {{ vars.steps.Score_And_Tier.data.code_output.ruled_out | join(', ') }}.
            Scored as urgent by every external signal, and nothing in this
            estate runs the affected software.</p>
            {% endif %}
            {% if vars.steps.Score_And_Tier.data.code_output.nvd_missing_count %}
            <p><b>NVD did not answer for
            {{ vars.steps.Score_And_Tier.data.code_output.nvd_missing_count }}
            CVE(s):</b>
            {{ vars.steps.Score_And_Tier.data.code_output.nvd_missing | join(', ') }}.
            Their CVSS and affected-product data are missing from this run, so
            the score leans on EPSS and KEV alone and exposure may read as
            "could not tell". The keyless NVD API is rate limited -- re-running
            after a minute usually fills them in.</p>
            {% endif %}
            <p><b>Source ranking contradicted by live EPSS:</b>
            {{ vars.steps.Score_And_Tier.data.code_output.disagreement_count }}
            {% if vars.steps.Score_And_Tier.data.code_output.disagreement_count %}
            ({{ vars.steps.Score_And_Tier.data.code_output.disagreements | join(', ') }})
            {% endif %}</p>
            {% set pol = vars.steps.Score_And_Tier.data.code_output %}
            {% if pol.policy_disagreement_count %}
            <p><b>Tiered differently from a VPR-only policy:</b>
            {{ pol.policy_disagreement_count }} of {{ pol.count }}.
            Tenable's VPR bands (Critical 9.0+, High 7.0-8.9, Medium 4.0-6.9,
            Low 0.1-3.9) rank on the vulnerability alone; these also weigh live
            EPSS and which machines actually run it.
            {% for d in pol.policy_disagreements %}
            <br>{{ d.cve }} -- VPR policy says {{ d.theirs }}, this says
            {{ d.ours }} ({{ d.why }}).
            {% endfor %}</p>
            {% endif %}
            <p>Every CVE above was upserted into the CVE module with its SLA
            due date set from its tier.</p>
            {% set tk = vars.steps.Ticket_Candidates.data.code_output %}
            {% if tk.count %}
            <p><b>Ticketing --
            {{ tk.count }} of these are work
            (tier {{ tk.tiers }}, and present or unconfirmed in the estate):</b>
            {{ tk.cves | join(', ') }}.</p>
            {% if vars.input.params.ticketing_enabled | default('no', true) | lower != 'yes' %}
            <p><i>Ticketing is disabled, so none was filed -- see the dry-run
            comment for exactly what would have been.</i></p>
            {% endif %}
            {% else %}
            <p><b>Ticketing:</b> nothing here met the bar. Either nothing
            reached {{ vars.input.params.ticket_tiers | default('P1,P2', true) }},
            or what did is not present in this estate -- which is a decision,
            not an omission.</p>
            {% endif %}
        next: Done

      - name: Done
        type: end



  # ======================================================== estate sync =====
  # Fleet -> Asset records -> Vulnerability records -> CVE links.
  #
  # WHY THIS EXISTS. The classifier already calls Fleet, but it calls it
  # in-flight and throws the answer away: the exposure verdict lands in a
  # comment and a `sourceData` string, and nothing in the platform holds "these
  # are my machines and this is what is wrong with them". So "present in the
  # estate" was a claim with nothing behind it -- you could read it, you could
  # not click it.
  #
  # WHAT FLEET ACTUALLY RETURNS, which is more than the classifier uses. With
  # `populate_software=true` every installed package carries a `generated_cpe`
  # AND a `vulnerabilities` array that Fleet resolved itself:
  #
  #   {"name": "Mozilla Firefox (x64 en-US)", "version": "123.0.1",
  #    "generated_cpe": "cpe:2.3:a:mozilla:firefox:123.0.1:*:*:*:*:windows:*:*",
  #    "vulnerabilities": [{"cve": "CVE-2024-10458", ...}, ...]}
  #
  # That is a scan result. It is the same artifact a commercial scanner emits,
  # and it is why this demo does not need simulated scanner data: the estate
  # genuinely reports which CVEs are on which host, with the CPE that proves it.
  #
  # NOTHING HERE IS UPSERTED, and that is not an oversight. `/api/3/upsert/assets`
  # does NOT de-duplicate -- proven directly against the API: two upserts with
  # the same `hostname` produced two records, because `assets` has no unique
  # field configured the way `c_v_es` has `cVEID`. An upsert here would double
  # the estate on every sync, silently, and the second run would look exactly
  # like the first. So this reads what exists, decides create-vs-update in
  # Python, and does each explicitly -- the same shape as the ticketing leg's
  # Search -> Reconcile -> File/Update.
  #
  # CVE RECORDS ARE NOT CREATED HERE. The intake playbooks own that; this one
  # only LINKS to CVE records that already exist. A sync that invented 671 CVE
  # records would bury the handful an analyst actually triaged.
  - name: Sync Estate from Fleet
    description: >
      Pull the Fleet software inventory and turn it into Asset records and
      Vulnerability records, linked to each other and to any CVE records the
      intake playbooks have already written.
    tag: vigor-estate
    steps:

      - name: Start
        type: start
        module: assets
        button_label: Sync Estate from Fleet
        comment: >
          Manual and record-free -- it syncs the whole estate, not the asset it
          was launched from. It hangs off `assets` because that is where the
          result lands and so where an operator would look for the button.
        next: Estate Config

      - name: Estate Config
        type: set_variable
        vars:
          fleet_config: "patch-fleet"
          # A cap, and it is REPORTED rather than silent. One Windows host with
          # an old Firefox on it carries ~650 CVEs by itself, so an uncapped
          # sync is thousands of create_record calls and a playbook run that
          # looks hung. The summary prints found-vs-written both ways round, so
          # a truncated sync never reads like a complete one.
          max_vulns: 150
          # Marks the records this playbook owns, so a re-sync can tell its own
          # rows from ones a human or another integration made, and so the demo
          # reset has something precise to delete.
          sync_tag: "fleet-sync"
        next: Fetch Hosts

      - name: Fetch Hosts
        type: connector
        connector: generic-http
        operation: http_get
        config: "{{ vars.fleet_config }}"
        comment: >
          LIVE. One call for the whole estate, software and resolved CVEs
          included. Unlike the classifier's copy of this call, `ignore_errors`
          is NOT set: a sync that cannot reach the inventory has nothing to do
          and should say so, rather than quietly writing an empty estate over a
          populated one.
        params:
          rest_api: /api/v1/fleet/hosts
          parameter:
            per_page: 100
            populate_software: "true"
        next: Existing Assets

      - name: Existing Assets
        type: find_record
        module: assets
        comment: >
          Everything already in the module, so the reconcile can tell an update
          from a create. Deliberately UNFILTERED by the sync tag: a host that
          FortiDeceptor or a FortiSIEM ingest already created must be matched
          and updated, not duplicated alongside its own hostname.
        filters:
          # Match-all. A find step requires a query, so "everything in the
          # module" has to be said explicitly rather than by omission; `id gt 0`
          # is true of every row and is the least surprising way to say it.
          - {field: id, operator: gt, value: 0}
        limit: 500
        next: Existing CVEs

      - name: Existing CVEs
        type: find_record
        module: c_v_es
        comment: >
          The CVE records that already exist. Fleet reports hundreds of CVEs per
          host and this playbook creates none of them -- it links the ones the
          intake playbooks already triaged, so the join lands on records that
          mean something rather than on a wall of unreviewed ids.
        filters:
          # Match-all. A find step requires a query, so "everything in the
          # module" has to be said explicitly rather than by omission; `id gt 0`
          # is true of every row and is the least surprising way to say it.
          - {field: id, operator: gt, value: 0}
        limit: 1000
        next: Reconcile Estate

      - name: Reconcile Estate
        type: connector
        connector: code-runner
        operation: run_python
        comment: >
          Where Fleet's shape becomes FortiSOAR's, and where create-vs-update is
          decided. No writes happen here.
        params:
          code: |
            import json

            def rows(step):
                """find_record returns the bare row LIST at run time even though
                it compiles as the Hydra envelope. Accept either -- the same
                normalisation the ticketing leg needs, for the same reason."""
                if isinstance(step, dict):
                    return step.get("hydra:member") or []
                return step or []

            fleet = json.loads(r'''{{ vars.steps.Fetch_Hosts | tojson }}''')
            hosts = (((fleet or {}).get("data") or {}).get("body") or {}).get("hosts") or []
            existing_assets = rows(json.loads(r'''{{ vars.steps.Existing_Assets | tojson }}'''))
            existing_cves   = rows(json.loads(r'''{{ vars.steps.Existing_CVEs | tojson }}'''))
            max_vulns = int("{{ vars.max_vulns }}")
            sync_tag  = "{{ vars.sync_tag }}"

            # hostname -> IRI, lowercased. Fleet reports the FQDN
            # (WS-01.fabric.lab) while a record made by hand or by another
            # integration may hold the short name, so BOTH are indexed and a
            # host matches on either. Getting this wrong does not error -- it
            # just creates a second asset for a machine already present.
            by_host = {}
            for a in existing_assets:
                for key in (a.get("hostname"), a.get("name")):
                    if key:
                        k = str(key).strip().lower()
                        by_host[k] = a.get("@id")
                        by_host[k.split(".")[0]] = a.get("@id")

            cve_iri = {}
            for r in existing_cves:
                if r.get("cVEID"):
                    cve_iri[str(r["cVEID"]).upper()] = r.get("@id")

            create, update, host_index = [], [], []
            vuln_rows, pair_count = {}, 0

            for h in hosts:
                fqdn  = (h.get("hostname") or h.get("display_name") or "").strip()
                short = fqdn.split(".")[0]
                if not fqdn:
                    continue
                software = h.get("software") or []

                # Every (host, CVE) pair Fleet resolved, with the CPE that
                # justifies it. This is the scan finding, and the CPE is kept
                # because "why do you think this is here" must be answerable.
                host_cves = []
                for sw in software:
                    for v in (sw.get("vulnerabilities") or []):
                        cid = str(v.get("cve") or "").upper()
                        if not cid.startswith("CVE-"):
                            continue
                        host_cves.append(cid)
                        pair_count += 1
                        row = vuln_rows.setdefault(cid, {
                            "cve": cid, "hosts": [], "products": [], "cpes": [],
                        })
                        if short not in row["hosts"]:
                            row["hosts"].append(short)
                        prod = "{} {}".format(sw.get("name") or "", sw.get("version") or "").strip()
                        if prod and prod not in row["products"]:
                            row["products"].append(prod)
                        cpe = sw.get("generated_cpe") or ""
                        if cpe and cpe not in row["cpes"]:
                            row["cpes"].append(cpe)

                # os_version is free text from Fleet ("Windows 11 Enterprise
                # Evaluation 24H2 10.0.26100.1742") and `operatingSystem` on the
                # asset is a PICKLIST -- writing free text to it is rejected as
                # ambiguous. It goes to `description` instead; the picklist is
                # left alone rather than guessed at.
                fields = {
                    "name": short,
                    "hostname": fqdn,
                    "ip": h.get("primary_ip") or "",
                    "macAddress": h.get("primary_mac") or "",
                    "deviceUid": h.get("uuid") or "",
                    "serialNumber": h.get("hardware_serial") or "",
                    "vendor": h.get("hardware_vendor") or "",
                    "product": h.get("hardware_model") or "",
                    "description": "{} -- {} software item(s), {} CVE finding(s) reported by Fleet".format(
                        h.get("os_version") or "unknown OS", len(software), len(host_cves)),
                    "recordTags": [sync_tag],
                }
                iri = by_host.get(fqdn.lower()) or by_host.get(short.lower())
                if iri:
                    update.append({"iri": iri, "fields": fields})
                else:
                    create.append(fields)
                host_index.append({"short": short, "fqdn": fqdn,
                                   "cves": sorted(set(host_cves))})

            # EVERY finding gets a Vulnerability record, not just the CVEs the
            # CVE module already tracks.
            #
            # It used to require a matching CVE record, and that was wrong about
            # what this module is FOR. `vulnerabilities` is the scanner's view
            # -- "this machine is running something with this flaw in it" -- and
            # that is true whether or not anyone has triaged the CVE yet. Gating
            # on prior knowledge produced ONE record from 694 live findings and
            # left the module looking empty next to an estate full of them.
            #
            # The CVE LINK still requires a real CVE record, which is the honest
            # split: the finding is always recorded, the cross-reference appears
            # when there is something to cross-reference to. Findings whose CVE
            # is already tracked are ordered FIRST so the cap keeps the
            # interesting ones.
            ordered = sorted(vuln_rows.items(),
                             key=lambda kv: (0 if kv[0] in cve_iri else 1, kv[0]))
            known = [v for k, v in ordered if k in cve_iri]
            unknown_count = len(vuln_rows) - len(known)
            selected = [v for _, v in ordered][:max_vulns]
            for v in selected:
                v["cve_iri"] = cve_iri.get(v["cve"], "")
                v["host_count"] = len(v["hosts"])
                v["summary"] = "{} on {}".format(
                    "; ".join(v["products"][:2]) or "unknown product",
                    ", ".join(v["hosts"]))
                v["cpe"] = v["cpes"][0] if v["cpes"] else ""

            return {
                # NOT "create"/"update". A dot-path lookup resolves against
                # the dict's ATTRIBUTES before its keys, so `code_output.update`
                # returned Python's built-in `dict.update` METHOD and the
                # for_each died on "<built-in method update of dict object>".
                # `create` happened to work only because dict has no `.create`,
                # which is worse than both failing -- half the step worked.
                # Anything colliding with a dict method (update, items, keys,
                # values, get, pop, copy) is unsafe as a key name here.
                "to_create": create,
                "to_update": update,
                "create_count": len(create),
                "update_count": len(update),
                "host_count": len(host_index),
                "host_index": host_index,
                "selected": selected,
                "selected_count": len(selected),
                "pair_count": pair_count,
                "unique_cve_count": len(vuln_rows),
                "known_cve_count": len(known),
                "unknown_cve_count": unknown_count,
                "capped": "yes" if len(known) > max_vulns else "no",
                "sync_tag": sync_tag,
            }
        next: Create Assets

      - name: Create Assets
        type: create_record
        module: assets
        comment: >
          Plain create, NOT upsert -- see the header. The reconcile has already
          proven each of these has no existing record.
        fields:
          name: "{{ vars.item.name }}"
          hostname: "{{ vars.item.hostname }}"
          ip: "{{ vars.item.ip }}"
          macAddress: "{{ vars.item.macAddress }}"
          deviceUid: "{{ vars.item.deviceUid }}"
          serialNumber: "{{ vars.item.serialNumber }}"
          vendor: "{{ vars.item.vendor }}"
          product: "{{ vars.item.product }}"
          description: "{{ vars.item.description }}"
          recordTags: "{{ vars.item.recordTags }}"
        for_each:
          item: "{{ vars.steps.Reconcile_Estate.data.code_output.to_create }}"
        next: Update Assets

      - name: Update Assets
        type: update_record
        module: assets
        record: "{{ vars.item.iri }}"
        comment: >
          Refreshes what Fleet is authoritative for on hosts already present.
          The CVE links are NOT written here -- they need the IRIs of the assets
          the create step just made, which do not exist yet.
        fields:
          ip: "{{ vars.item.fields.ip }}"
          macAddress: "{{ vars.item.fields.macAddress }}"
          deviceUid: "{{ vars.item.fields.deviceUid }}"
          description: "{{ vars.item.fields.description }}"
          recordTags: "{{ vars.item.fields.recordTags }}"
        for_each:
          item: "{{ vars.steps.Reconcile_Estate.data.code_output.to_update }}"
        next: Reread Assets

      - name: Reread Assets
        type: find_record
        module: assets
        comment: >
          Re-read AFTER the writes, because a for_each step's result is a list
          of loop envelopes carrying a task_id -- NOT the created records -- so
          the new IRIs cannot be recovered from the create step. Learned the
          hard way in the ticketing leg, where reading keys back out of the
          loop result returned nothing and left every ticket unlinked while the
          run stayed green.
        filters:
          # Match-all. A find step requires a query, so "everything in the
          # module" has to be said explicitly rather than by omission; `id gt 0`
          # is true of every row and is the least surprising way to say it.
          - {field: id, operator: gt, value: 0}
        limit: 500
        next: Build Links

      - name: Build Links
        type: connector
        connector: code-runner
        operation: run_python
        comment: >
          Pairs every Vulnerability row and every CVE record to the asset IRIs
          they belong to, now that all the assets exist.
        params:
          code: |
            import json

            def rows(step):
                if isinstance(step, dict):
                    return step.get("hydra:member") or []
                return step or []

            assets = rows(json.loads(r'''{{ vars.steps.Reread_Assets | tojson }}'''))
            rec = json.loads(r'''{{ vars.steps.Reconcile_Estate.data.code_output | tojson }}''')
            if isinstance(rec, str):
                rec = json.loads(rec)

            iri_of = {}
            for a in assets:
                for key in (a.get("hostname"), a.get("name")):
                    if key:
                        k = str(key).strip().lower()
                        iri_of[k] = a.get("@id")
                        iri_of[k.split(".")[0]] = a.get("@id")

            def iris(shorts):
                out = []
                for s in shorts:
                    i = iri_of.get(str(s).strip().lower())
                    if i and i not in out:
                        out.append(i)
                return out

            # One Vulnerability record per CVE, linked to every asset that runs
            # it -- which is what `impactedAssets` on that module is FOR. A
            # record per (host, CVE) pair would be 671 rows saying the same
            # thing 3 times and would make "how many machines" a count query
            # instead of a field.
            vulns = []
            for v in rec.get("selected") or []:
                a_iris = iris(v.get("hosts") or [])
                vulns.append({
                    "vulnerabilityId": v["cve"],
                    "name": v.get("summary") or v["cve"],
                    "description": "Reported by the Fleet software inventory on {} host(s): {}. Matched via {}.".format(
                        v.get("host_count", 0),
                        ", ".join(v.get("hosts") or []),
                        v.get("cpe") or "no CPE"),
                    "impactedAssets": v.get("host_count", 0),
                    "assets": a_iris,
                    "cve_iri": v.get("cve_iri") or "",
                })

            # The asset-side CVE join, one update per asset holding every CVE
            # record that exists for what Fleet found on it.
            cve_by_asset = {}
            for v in rec.get("selected") or []:
                if not v.get("cve_iri"):
                    continue
                for i in iris(v.get("hosts") or []):
                    cve_by_asset.setdefault(i, [])
                    if v["cve_iri"] not in cve_by_asset[i]:
                        cve_by_asset[i].append(v["cve_iri"])

            asset_links = [{"iri": k, "cves": vs} for k, vs in sorted(cve_by_asset.items())]

            return {
                "vulns": vulns,
                "vuln_count": len(vulns),
                "asset_links": asset_links,
                "linked_asset_count": len(asset_links),
                "asset_total": len(assets),
            }
        next: Write Vulnerabilities

      - name: Write Vulnerabilities
        type: create_record
        module: vulnerabilities
        is_upsert: true
        comment: >
          The scan finding as a record. `assets` is the stock relationship on
          this module, so the vulnerability and the machines that have it are
          joined on both sides without any schema work.

          UPSERT HERE, PLAIN CREATE FOR ASSETS -- and the asymmetry is not a
          style choice, it is what the two modules actually do. Proven against
          the API on this appliance:

            assets          no uniqueness constraint -> /api/3/upsert/assets
                            happily writes a SECOND row for the same hostname,
                            so an upsert doubles the estate on every sync.
            vulnerabilities unique on `vulnerabilityId` -> a plain create
                            answers 409 "a record already exists" on the second
                            run and takes the whole sync down with it.

          Each module therefore gets the treatment the other one breaks under.
          Check the constraint before assuming either.
        fields:
          vulnerabilityId: "{{ vars.item.vulnerabilityId }}"
          name: "{{ vars.item.name }}"
          description: "{{ vars.item.description }}"
          impactedAssets: "{{ vars.item.impactedAssets }}"
          assets: "{{ vars.item.assets }}"
        for_each:
          item: "{{ vars.steps.Build_Links.data.code_output.vulns }}"
        next: Link CVEs To Assets

      - name: Link CVEs To Assets
        type: update_record
        module: assets
        record: "{{ vars.item.iri }}"
        comment: >
          The join the whole exercise is for: `assets.cVEs` is a stock
          many-to-many, so from a CVE record you can now see the machines that
          run it and from a machine you can see its CVEs -- no custom fields,
          no custom module.
        fields:
          cVEs: "{{ vars.item.cves }}"
        for_each:
          item: "{{ vars.steps.Build_Links.data.code_output.asset_links }}"
        next: Sync Comment

      - name: Sync Comment
        type: create_record
        module: comments
        comment: >
          The receipt. It reports found AND written for both CVEs and
          vulnerabilities, because a capped sync that printed only what it wrote
          would be indistinguishable from a complete one.
        fields:
          people: "{{ vars.input.env.user_iri if vars.input.env.user_iri else [] }}"
          text: >-
            <p><b>Estate sync complete.</b>
            {{ vars.steps.Reconcile_Estate.data.code_output.host_count }} host(s) in Fleet --
            {{ vars.steps.Reconcile_Estate.data.code_output.create_count }} asset(s) created,
            {{ vars.steps.Reconcile_Estate.data.code_output.update_count }} updated.</p>
            <p><b>Findings.</b> Fleet reported
            {{ vars.steps.Reconcile_Estate.data.code_output.pair_count }} host-CVE pair(s)
            across {{ vars.steps.Reconcile_Estate.data.code_output.unique_cve_count }} unique CVE(s).
            {{ vars.steps.Reconcile_Estate.data.code_output.known_cve_count }} of those already exist
            as CVE records and are cross-referenced;
            {{ vars.steps.Reconcile_Estate.data.code_output.unknown_cve_count }} are findings this
            estate has that nobody has triaged yet -- recorded, but with no CVE link to make.
            {{ vars.steps.Build_Links.data.code_output.vuln_count }} Vulnerability record(s) written
            (cap {{ vars.max_vulns }}, hit: {{ vars.steps.Reconcile_Estate.data.code_output.capped }}).</p>
            <p><b>Links.</b>
            {{ vars.steps.Build_Links.data.code_output.linked_asset_count }} asset(s) now carry CVE
            links. Open any Asset to see its CVEs, or any CVE to see the machines that run it.</p>
        next: Done

      - name: Done
        type: end



  # =================================================== patch from a record ===
  # THE PATCH IS AN ACTION ON A VULNERABILITY, not a playbook with a product
  # typed into a variable.
  #
  # This is the difference between automation and a script with arguments. The
  # older path asked an operator to name the product, the script and the hosts
  # in `set_variable` -- three chances to be wrong, none of them checked against
  # anything, and all three going stale the moment the estate or the Fleet
  # instance changed. It also meant the thing an analyst actually looks at (the
  # finding) had no relationship to the thing that fixed it.
  #
  # Here the RECORD is the input. Everything is read off it or off live Fleet:
  #
  #   vulnerabilityId  "Notepad++/8.9.8"   -> product, and the version that fixes it
  #   assets           (stock relation)    -> which machines, by name
  #   recordTags       "patch:approved"    -> whether anyone authorised this
  #
  # Nothing is typed twice, and nothing can drift: if the estate sync links a
  # fourth asset to this vulnerability tomorrow, this playbook patches four
  # machines without being edited. That relationship is exactly what
  # `Sync Estate from Fleet` exists to populate -- the two are one feature.
  #
  # The `Product/Version` convention in `vulnerabilityId` is not invented here.
  # It is what UC-12's patch pipeline already writes, so a record created by
  # that pipeline is patchable by this playbook with no translation layer.
  - name: Patch From Vulnerability
    description: >
      Run on a Vulnerability record. Reads the product and fix version from the
      record, the target machines from its linked Assets, and dispatches the
      matching Fleet upgrade script to exactly those hosts.
    tag: vigor-patch
    steps:

      - name: Start
        type: start
        module: vulnerabilities
        button_label: Patch This Vulnerability
        comment: >
          Bound to `vulnerabilities`, so it appears under Execute on the record
          an analyst is already reading. That placement IS the use case: the
          finding and the fix are one click apart instead of one being a
          playbook someone has to know exists.
        next: Patch Config

      - name: Patch Config
        type: set_variable
        vars:
          fleet_config: "patch-fleet"
          # product -> upgrade script NAME. Never an id: ids are assigned per
          # Fleet instance and the id after an upgrade script is typically its
          # ROLLBACK, so a stale integer here downgrades the product while
          # reporting a patch. A name either resolves or it does not.
          upgrade_script_map: "7-Zip=upgrade-7zip.ps1,Notepad++=upgrade-notepadpp.ps1,PuTTY=upgrade-putty.ps1"
          # THE FLAG. A vulnerability is not patched because a playbook was run;
          # it is patched because somebody said so. The tag is the authorisation
          # and it lives on the record, where it is visible, auditable, and
          # removable -- rather than in a playbook variable nobody can see.
          approve_tag: "patch:approved"
          dispatched_tag: "patch:dispatched"
          # Set to "no" to let the button patch without the tag. Left "yes"
          # because a one-click unreviewed patch is how automation loses the
          # room.
          require_approval: "yes"
        next: Read Vulnerability

      - name: Read Vulnerability
        type: find_record
        module: vulnerabilities
        comment: >
          Re-read rather than trusting `vars.input.records[0]`. The trigger
          payload is not guaranteed to carry the `assets` relationship, and this
          playbook is entirely about that relationship -- reading it as an empty
          list would dispatch to nothing and report success.
        filters:
          - {field: id, operator: eq, value: "{{ vars.input.records[0].id }}"}
        limit: 1
        next: Find Linked Assets

      - name: Find Linked Assets
        type: find_record
        module: assets
        comment: >
          THE LINK IS READ FROM THE ASSET SIDE, and it has to be.

          `find_record` on `vulnerabilities` does NOT load the `assets`
          relationship -- the rows come back with the scalar fields only, so
          reading `record.assets` yields an empty list for a record that
          demonstrably has two. That failure is the quiet kind: the playbook
          refuses with "no Assets are linked to this vulnerability", which is a
          sentence about the data rather than about the query, and sends you to
          re-run the estate sync that already worked.

          Querying the OTHER side sidesteps relationship loading entirely --
          `vulnerabilities.id` is a dotted relationship filter, the same shape
          the classifier uses for `listName.name`. Verified live: it returns
          both hosts for the 7-Zip finding.
        filters:
          - {field: vulnerabilities.id, operator: eq, value: "{{ vars.input.records[0].id }}"}
        limit: 100
        next: List Upgrade Scripts

      - name: List Upgrade Scripts
        type: connector
        connector: generic-http
        operation: http_get
        config: "{{ vars.fleet_config }}"
        params:
          rest_api: "/api/v1/fleet/scripts"
          parameter:
            per_page: 100
        next: List Estate Hosts

      - name: List Estate Hosts
        type: connector
        connector: generic-http
        operation: http_get
        config: "{{ vars.fleet_config }}"
        params:
          rest_api: "/api/v1/fleet/hosts"
          parameter:
            per_page: 100
        next: Resolve Patch Targets

      - name: Resolve Patch Targets
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Record + live Fleet -> a dispatch, or a refusal that says which of the
          four preconditions failed. Nothing is dispatched from here.
        params:
          code: |
            import json, re

            def rows(step):
                if isinstance(step, dict):
                    return step.get("hydra:member") or []
                return step or []

            vulns   = rows(json.loads(r'''{{ vars.steps.Read_Vulnerability | tojson }}'''))
            scripts = json.loads(r'''{{ vars.steps.List_Upgrade_Scripts.data | tojson }}''') or {}
            hosts   = json.loads(r'''{{ vars.steps.List_Estate_Hosts.data | tojson }}''') or {}
            require_approval = "{{ vars.require_approval }}".strip().lower()
            approve_tag = "{{ vars.approve_tag }}".strip().lower()

            rec = vulns[0] if vulns else {}

            # TWO RECORD SHAPES REACH THIS PLAYBOOK, and it has to read both.
            #
            #   UC-12's patch pipeline writes  vulnerabilityId = "Notepad++/8.9.8"
            #                                  -- product AND the version that fixes it.
            #   Sync Estate from Fleet writes  vulnerabilityId = "CVE-2024-11477"
            #                                  -- the CVE, with the product in `name`
            #                                  ("7-Zip 19.00 (x64) on VMG-WS-01").
            #
            # Reading only the first shape would make this button silently
            # inapplicable to every record the estate sync creates, which is
            # most of them. So: split on the last slash when there is one,
            # otherwise recognise the product by matching the script map's own
            # keys against the record's name. The map already enumerates every
            # product we can patch, so it is the right vocabulary to match on --
            # and a product we cannot patch fails the mapped-script check below
            # rather than being mis-parsed here.
            vid = str(rec.get("vulnerabilityId") or "").strip()
            rec_name = str(rec.get("name") or "")
            mapped_products = [pair.split("=", 1)[0].strip()
                               for pair in "{{ vars.upgrade_script_map }}".split(",")
                               if "=" in pair]

            if "/" in vid:
                product, fix_version = (vid.rsplit("/", 1) + [""])[:2]
                product = product.strip()
            else:
                product, fix_version = "", ""
                haystack = "{} {}".format(rec_name, vid).lower()
                # Longest first, so "7-Zip Extra" cannot be shadowed by "7-Zip".
                for cand in sorted(mapped_products, key=len, reverse=True):
                    if cand.lower() in haystack:
                        product = cand
                        break

            tags = [str(x).strip().lower() for x in (rec.get("recordTags") or [])]
            approved = (require_approval != "yes") or (approve_tag in tags)

            want_script = ""
            for pair in "{{ vars.upgrade_script_map }}".split(","):
                if "=" in pair:
                    left, right = pair.split("=", 1)
                    if left.strip().lower() == product.lower():
                        want_script = right.strip()
                        break

            script_id = 0
            srows = ((scripts.get("body") or {}).get("scripts")) or []
            for s in srows:
                if want_script and str(s.get("name") or "").strip().lower() == want_script.lower():
                    script_id = int(s.get("id") or 0)
                    break

            # The machines come from the asset-side query, resolved to Fleet ids
            # by short hostname. An asset the estate sync has not linked is not
            # patched -- correctly: this playbook fixes what the finding says is
            # affected, not what it guesses might be.
            linked = rows(json.loads(r'''{{ vars.steps.Find_Linked_Assets | tojson }}'''))
            want = []
            for a in linked:
                nm = a.get("hostname") or a.get("name") if isinstance(a, dict) else None
                if nm:
                    want.append(str(nm).split(".")[0].strip().lower())

            index = {}
            for h in ((hosts.get("body") or {}).get("hosts") or []):
                nm = str(h.get("hostname") or h.get("display_name") or "")
                if nm:
                    index[nm.split(".")[0].strip().lower()] = h.get("id")

            host_ids, matched, unmatched = [], [], []
            for w in want:
                hid = index.get(w)
                if hid:
                    host_ids.append(hid); matched.append(w)
                else:
                    unmatched.append(w)

            why = []
            if not product:
                why.append("could not identify a patchable product from this record "
                           "(vulnerabilityId {!r}, name {!r}) -- known products are: {}"
                           .format(vid, rec_name[:60], ", ".join(mapped_products) or "none"))
            if not approved:
                why.append("not authorised -- add the tag {!r} to this record to "
                           "approve the patch".format("{{ vars.approve_tag }}"))
            if product and not want_script:
                why.append("no upgrade script is mapped for {!r}".format(product))
            elif want_script and not script_id:
                why.append("Fleet has no script named {!r}".format(want_script))
            if not linked:
                why.append("no Assets are linked to this vulnerability -- run "
                           "'Sync Estate from Fleet' so the finding knows which "
                           "machines it is about")
            elif not host_ids:
                why.append("none of the linked asset(s) ({}) are enrolled in Fleet"
                           .format(", ".join(unmatched) or "unknown"))

            ok = "yes" if (product and approved and script_id and host_ids) else "no"
            return {
                "ok": ok,
                "product": product,
                "fix_version": fix_version or "(not stated)",
                "script_name": want_script or "(unmapped)",
                "script_id": script_id,
                "host_ids": host_ids,
                "host_ids_csv": ", ".join(str(i) for i in host_ids),
                "hostnames": ", ".join(matched) or "none",
                "unmatched": ", ".join(unmatched) or "none",
                "linked_count": len(linked),
                "approved": "yes" if approved else "no",
                "record_iri": rec.get("@id", ""),
                "tags_now": rec.get("recordTags") or [],
                "why": "; ".join(why) or "ready",
            }
        next: Patch Gate

      - name: Patch Gate
        type: decision
        conditions:
          - condition: "{{ vars.steps.Resolve_Patch_Targets.data.code_output.ok == 'yes' }}"
            next: Dispatch Patch
        default: Refused Comment

      - name: Refused Comment
        type: create_record
        module: comments
        comment: >
          A refusal is a RESULT, and it names which precondition failed rather
          than saying "could not patch". Every line it can print is actionable:
          add the tag, map the script, run the estate sync.
        fields:
          content: >
            <p><b>Patch not dispatched.</b>
            {{ vars.steps.Resolve_Patch_Targets.data.code_output.why }}.</p>
            <p>Read from this record --
            product: <b>{{ vars.steps.Resolve_Patch_Targets.data.code_output.product }}</b>,
            fixed in <b>{{ vars.steps.Resolve_Patch_Targets.data.code_output.fix_version }}</b>,
            linked asset(s): {{ vars.steps.Resolve_Patch_Targets.data.code_output.linked_count }},
            authorised: {{ vars.steps.Resolve_Patch_Targets.data.code_output.approved }}.</p>
        next: Done

      - name: Dispatch Patch
        type: connector
        connector: generic-http
        operation: http_post
        config: "{{ vars.fleet_config }}"
        comment: >
          A REAL installer run on REAL endpoints. The call returns when Fleet
          accepts the batch, which is not the same as the endpoints being done
          -- the version move is confirmed by re-reading the inventory, never by
          this response.
        params:
          rest_api: "/api/v1/fleet/scripts/run/batch"
          body_type: json
          data: >-
            {"script_id": {{ vars.steps.Resolve_Patch_Targets.data.code_output.script_id }},
             "host_ids": [{{ vars.steps.Resolve_Patch_Targets.data.code_output.host_ids_csv }}]}
        next: Tag Dispatched

      - name: Tag Dispatched
        type: update_record
        module: vulnerabilities
        record: "{{ vars.steps.Resolve_Patch_Targets.data.code_output.record_iri }}"
        comment: >
          The ledger, on the record itself. Without it a second click dispatches
          a second installer run and nothing anywhere says the first happened.
        fields:
          recordTags: "{{ vars.steps.Resolve_Patch_Targets.data.code_output.tags_now + [vars.dispatched_tag] }}"
        next: Patch Comment

      - name: Patch Comment
        type: create_record
        module: comments
        fields:
          content: >
            <p><b>Patch dispatched from this record.</b></p>
            <p>Product <b>{{ vars.steps.Resolve_Patch_Targets.data.code_output.product }}</b>,
            upgrading to <b>{{ vars.steps.Resolve_Patch_Targets.data.code_output.fix_version }}</b>
            via Fleet script
            <code>{{ vars.steps.Resolve_Patch_Targets.data.code_output.script_name }}</code>
            (id {{ vars.steps.Resolve_Patch_Targets.data.code_output.script_id }}).</p>
            <p>Target host(s), taken from this vulnerability's linked Assets:
            <b>{{ vars.steps.Resolve_Patch_Targets.data.code_output.hostnames }}</b>.</p>
            <p>This is a real installer run and takes minutes. Confirm the
            version has moved by re-reading the software inventory -- Fleet
            accepting the batch is not the same as the endpoint being finished.</p>
        next: Done

      - name: Done
        type: end


# =========================================================================
# TAXII INTAKE -- was uc15_taxii_ingest/playbooks/taxii_cve_intake.yaml
# =========================================================================

  - name: Ingest CVE Report from TAXII
    description: >
      Poll a TAXII 2.1 collection for STIX vulnerability and report objects,
      normalise them, and classify every CVE the same way a PDF or a CSV would
      have been classified.
    tag: uc15
    steps:

      - name: Start
        type: start
        module: indicators
        button_label: Ingest CVEs from TAXII
        comment: >
          Manual and record-free: this is a feed pull, not an action on a
          record. A start step still needs a `module:` -- without one it has no
          trigger route and cannot be triggered by the SDK at all.
        next: TAXII Config

      - name: TAXII Config
        type: set_variable
        comment: >
          One place to change what is polled and how it is scored. The band and
          config names are passed straight through to UC-14's classifier, so
          this playbook and the file-based one tier identically by construction.
        vars:
          taxii_config: "taxii-lab"
          # The advisory collection: `report` + the `vulnerability` SDOs it
          # names. Ids are uuid5 over a fixed lab namespace, so they survive a
          # pod rebuild -- see devices/taxii/ in the fabric_studio_terraform
          # repo.
          advisory_collection: "0419490b-6530-5780-8f01-a3bca01571b8"
          # Exploitation indicators + their `indicates` relationships.
          exploited_collection: "cb2f9eb8-3e73-58d8-b05b-1f992e886093"
          # THE CURSOR IS A GLOBAL VARIABLE, which is the mechanism the
          # platform already owns for this. Shipped ingestion playbooks --
          # FortiSIEM's `> Fetch`, and this very connector's own
          # `TAXII > Ingest` -- all keep their high-water mark in a
          # dynamic-variable ("macro") at /api/wf/api/dynamic-variable/,
          # read with `make_cyops_request` and written with `updatemacro`.
          # Nothing else persists across runs: step vars die with the run and
          # the connector config is user-facing settings, not run state.
          #
          # The name is suffixed with THIS PLAYBOOK'S OWN uuid, copying the
          # shipped convention, so two ingestion schedules of the same feed do
          # not share one high-water mark and quietly skip each other's window.
          pull_time_macro: "Uc15TaxiiLastPullTime_{{ vars['audit_info']['cyops_playbook_iri'].split('/')[-1].replace('-','_') }}"
          # Captured BEFORE the fetch, and it is this value -- not "now" after
          # the run -- that the cursor advances to. Anything published while
          # the run is in flight then falls inside the NEXT window instead of
          # into the gap between them.
          fetch_time: "{{ arrow.utcnow().format('YYYY-MM-DDTHH:mm:ss.SSS') }}Z"
          nvd_http_config: "nvd-public-http"
          fleet_config: "patch-fleet"
          band_p2: 80
          band_p3: 60
          band_p4: 35
          # Ticketing policy, deliberately duplicated from UC-14's Intake
          # Config rather than inherited: a feed that pulls unattended on a
          # schedule and a file an analyst uploaded by hand are different risk
          # postures, and an operator should be able to let one file tickets
          # without the other. The classifier that consumes them is still one
          # copy -- the policy differs, the scoring cannot.
          ticketing_enabled: "no"
          jira_config: "jira-demo"
          jira_project: "INC"
          # ONE TICKET, FOREVER. This label is the ticket's identity -- not the
          # CVE id and not the summary. Every run finds the ticket carrying it,
          # regroups the affected products and devices into the description,
          # and comments what changed. A new ticket is opened only if this one
          # has been closed.
          #
          # Per-CVE labels are still written ALONGSIDE it, and that is what
          # keeps `label -> issue key` resolution working: every CVE still
          # resolves to exactly one ticket, it is simply always the same one.
          # UC-06's lowercased-CVE convention therefore still finds this ticket.
          ticket_anchor_label: "vuln-management"
          ticket_tiers: "P1,P2"
        next: Read Cursor

      - name: Read Cursor
        type: connector
        connector: cyops_utilities
        operation: make_cyops_request
        config: ""
        comment: >
          The high-water mark from the last SUCCESSFUL run. A miss is not an
          error -- it is what the first run looks like -- so this reads the
          collection endpoint filtered by name rather than fetching a macro by
          id, and gets an empty `hydra:member` instead of a 404.
        params:
          method: GET
          iri: "/api/wf/api/dynamic-variable/?format=json&name={{ vars.pull_time_macro }}"
          body: ""
        ignore_errors: true
        next: Resolve Cursor

      - name: Resolve Cursor
        type: set_variable
        comment: >
          First run has no macro. It must NOT then pull from the epoch: a
          feed's whole history arriving as "new" is how a first schedule buries
          an analyst, and the shipped TAXII ingestion playbook makes exactly
          this choice -- it falls back to 30 days.
        vars:
          added_after: >-
            {% if vars.steps.Read_Cursor.data and
                  (vars.steps.Read_Cursor.data['hydra:member'] | default([]) | length) > 0
            %}{{ vars.steps.Read_Cursor.data['hydra:member'][0].value }}{% else
            %}{{ arrow.utcnow().shift(days=-30).format('YYYY-MM-DDTHH:mm:ss.SSS') }}Z{% endif %}
        next: Fetch Advisory

      - name: Fetch Advisory
        type: connector
        connector: taxii2-threat-intel-feed
        operation: get_objects
        config: "{{ vars.taxii_config }}"
        comment: >
          LIVE. `get_objects` returns the collection's objects as served.
          Do NOT substitute `get_objects_by_collection_id` -- it filters to
          `type == "indicator"` and would return an empty list here, silently.

          `fetch_all_records` makes the connector follow the `next` cursor.
          Without it only the first page arrives, and a short page is
          indistinguishable from a short feed.
        params:
          collectionID: "{{ vars.advisory_collection }}"
          added_after: "{{ vars.added_after }}"
          fetch_all_records: true
        next: Fetch Exploited

      - name: Fetch Exploited
        type: connector
        connector: taxii2-threat-intel-feed
        operation: get_objects
        config: "{{ vars.taxii_config }}"
        comment: >
          The exploitation edges. Kept as a SEPARATE collection rather than
          mixed into the advisory, because that is how a real feed is
          published: the advisory says what is wrong, a faster-moving
          collection says what is being used.

          A failure here must not sink the run -- exploitation data is
          enrichment, and the CVEs are still worth classifying without it.

          `added_after` IS DELIBERATELY NOT APPLIED HERE, and this is the one
          place the cursor would be actively wrong. This collection is a JOIN
          TABLE: `indicator` objects plus the `relationship(indicates)` edges
          that bind them to vulnerabilities in the OTHER collection. Window it,
          and an edge published last month is filtered out of this run while
          the vulnerability it points at is not -- so the same CVE classifies
          as "actively exploited" on a full pull and as quiet on an incremental
          one, with no error anywhere. A join table is read whole or the join
          silently loses edges. It is small and bounded by design; the advisory
          side is the one that grows.
        params:
          collectionID: "{{ vars.exploited_collection }}"
          added_after: ""
          fetch_all_records: true
        ignore_errors: true
        next: Normalise

      - name: Normalise
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          The ONLY genuinely new logic in this use case. Everything after it is
          UC-14's, untouched.

          Walks the bundle: every `vulnerability` becomes one finding, keyed on
          the CVE id from `external_references`. `report.object_refs` are
          resolved so an advisory's prose becomes `evidence` on each CVE it
          names, and `relationship(indicates)` edges from the exploited
          collection mark which of them are being used right now.

          Emits UC-14's finding contract verbatim -- cve, cvss_from_source,
          hosts, host_count, asset_categories, product, solution, evidence --
          which is what lets the classifier be shared rather than reimplemented.
        params:
          code: |
            import json, re

            advisory = json.loads(r'''{{ vars.steps.Fetch_Advisory.data | tojson }}''')
            exploited = json.loads(r'''{{ vars.steps.Fetch_Exploited.data | tojson }}''')

            # A connector step that was skipped or errored can hand back a dict
            # or a string rather than a list. Normalise the SHAPE before
            # reading it -- a `.get` on a list is the kind of failure that
            # reports as "connector broken" when the real answer is "empty".
            def as_objects(blob):
                if isinstance(blob, list):
                    return [o for o in blob if isinstance(o, dict)]
                if isinstance(blob, dict):
                    inner = blob.get("objects")
                    if isinstance(inner, list):
                        return [o for o in inner if isinstance(o, dict)]
                return []

            adv = as_objects(advisory)
            exp = as_objects(exploited)

            CVE_RE = re.compile(r"^CVE-\d{4}-\d{4,7}$", re.I)

            def cve_of(obj):
                # STIX has no CVE field. The convention is an external
                # reference whose source_name is "cve"; `name` is usually the
                # same string but that is convention, not spec, so it is only
                # the fallback.
                for ref in obj.get("external_references") or []:
                    if str(ref.get("source_name", "")).lower() == "cve":
                        ext = str(ref.get("external_id") or "").strip()
                        if CVE_RE.match(ext):
                            return ext.upper()
                name = str(obj.get("name") or "").strip()
                return name.upper() if CVE_RE.match(name) else ""

            vulns = {}          # stix id -> object
            for o in adv:
                if o.get("type") == "vulnerability" and cve_of(o):
                    vulns[o.get("id")] = o

            # Advisory prose, attached to every vulnerability the report names.
            # This is the direct analogue of UC-14 keeping the PDF line that
            # mentioned a CVE: it is what a human needs to see to know why this
            # CVE is in front of them.
            #
            # NEWEST VERSION WINS, PER REPORT ID. A TAXII collection can serve
            # several versions of the same object, and this used to keep
            # whichever arrived FIRST -- so an amended advisory (a CVE added,
            # a correction to the prose) was read as the superseded version
            # for as long as the old one happened to page in first. Nothing
            # errored; the records simply carried last week's wording.
            reports = {}
            for o in adv:
                if o.get("type") != "report":
                    continue
                prev = reports.get(o.get("id"))
                if prev is None or str(o.get("modified") or "") >= str(prev.get("modified") or ""):
                    reports[o.get("id")] = o

            prose = {}
            report_names = []
            for o in reports.values():
                report_names.append(o.get("name") or "advisory")
                text = " ".join(str(o.get("description") or "").split())
                for ref in o.get("object_refs") or []:
                    if ref in vulns and text:
                        prose.setdefault(ref, "{}: {}".format(o.get("name") or "advisory", text))

            # `indicates` edges: indicator -> vulnerability. Both endpoints have
            # to be resolvable for the edge to mean anything, so the indicator
            # ids are collected first.
            indicator_ids = {o.get("id") for o in exp if o.get("type") == "indicator"}
            exploited_vuln_ids = set()
            for o in exp:
                if o.get("type") != "relationship":
                    continue
                if o.get("relationship_type") != "indicates":
                    continue
                if o.get("source_ref") in indicator_ids:
                    exploited_vuln_ids.add(o.get("target_ref"))

            EVIDENCE_MAX = 300
            findings = []
            exploited_cves = []
            for sid, v in sorted(vulns.items(), key=lambda kv: cve_of(kv[1])):
                cve = cve_of(v)
                desc = " ".join(str(v.get("description") or "").split())
                is_exploited = sid in exploited_vuln_ids
                if is_exploited:
                    exploited_cves.append(cve)

                # Evidence, best first: the advisory's own prose if this CVE
                # was named by one, else the vulnerability's description.
                #
                # THE EXPLOITATION EDGE GOES FIRST, AND ONLY THE PROSE IS
                # TRUNCATED. It used to be appended and the whole string cut to
                # 300 -- which meant that for exactly the CVEs carrying an
                # active-exploitation indicator, the single most
                # decision-changing fact the feed holds was the FIRST thing
                # thrown away, because an advisory's prose is longer than 300
                # characters on its own. Every record read correctly and none
                # of them said "exploited". Truncating the least important part
                # of a string is the whole job of a truncation.
                mark = ("the feed carries an active-exploitation indicator "
                        "for this CVE")
                body = prose.get(sid) or desc
                if is_exploited:
                    ev = (mark + " | " + body)[:EVIDENCE_MAX]
                else:
                    ev = body[:EVIDENCE_MAX]

                findings.append({
                    "cve": cve,
                    # A STIX advisory carries no scanner score and no host
                    # list. Both stay empty rather than being invented; the
                    # classifier treats unknown exposure as its own case and
                    # scores CVSS from live NVD. VPR is Tenable-proprietary, so
                    # it is named and left None rather than omitted -- every
                    # door emits the same finding shape.
                    "cvss_from_source": None,
                    "vpr_from_source": None,
                    "hosts": [],
                    "host_count": 0,
                    "asset_categories": [],
                    "product": "",
                    "solution": "",
                    "evidence": ev,
                })

            return {
                "count": len(findings),
                "findings_json": json.dumps(findings),
                "exploited_count": len(exploited_cves),
                "exploited": ", ".join(sorted(exploited_cves)),
                "objects_seen": len(adv),
                "reports_seen": len(report_names),
                "report_names": "; ".join(report_names),
                # Deliberately does NOT restate the object count -- the
                # comment template already prints it, and having both produced
                # "answered with 0 STIX object(s). the collection answered with
                # 0 object(s) and ..." on screen, in front of the room.
                "note": "" if findings else (
                    "None of them was a vulnerability carrying a CVE id"),
            }
        set:
          findings_json: "{{ vars.steps.Normalise.data.code_output.findings_json }}"
          finding_count: "{{ vars.steps.Normalise.data.code_output.count }}"
          objects_seen: "{{ vars.steps.Normalise.data.code_output.objects_seen }}"
          exploited_count: "{{ vars.steps.Normalise.data.code_output.exploited_count }}"
          report_names: "{{ vars.steps.Normalise.data.code_output.report_names }}"
          parse_note: "{{ vars.steps.Normalise.data.code_output.note }}"
        next: Advisory Gate

      - name: Advisory Gate
        type: decision
        comment: >
          A collection that answers with nothing is a legitimate outcome, not a
          failure -- an incremental pull with nothing new is the NORMAL case for
          a subscription. It gets a comment saying what was polled and what came
          back, because silence is what makes an intake pipeline untrustworthy.
        conditions:
          - display: CVEs to classify
            when: "{{ vars.finding_count | int > 0 }}"
            next: Classify
        default: Nothing New Comment

      - name: Classify
        type: workflow_reference
        # BY NAME, now that the file intake and this one live in the same
        # collection. It used to be a uuid because the compiler resolves a name
        # only WITHIN a collection and this was a cross-collection call.
        #
        # The old comment here warned that "deleting and recreating its
        # collection" would not preserve the uuid -- and the merge did exactly
        # that. A playbook uuid is uuid5 over the collection AND the name, so
        # `Classify CVE Findings` moved from 50fc63b2-e043-554a-bcb0-cd45e43fa5a4
        # to 4673684e-5130-5d55-a2df-49b733f7e92a when the collection changed.
        # Left as a uuid this step would have pointed at a DELETED playbook --
        # and the dangerous version of that is not a clean failure but the
        # recycled old child still executing, so the feed path would have gone
        # on classifying with superseded scoring while every run stayed green.
        #
        # A name cannot rot this way: it is resolved at compile time against
        # this file, so the reference and the target move together.
        target: Classify CVE Findings
        apply_async: false
        comment: >
          UC-14's classifier (Classify CVE Findings), called unchanged. Child input params are authored
          at STEP level -- the compiler rejects an `arguments:` wrapper -- and
          only scalars survive the boundary intact, which is why the findings
          cross it as a JSON string.

          `source_ref` is empty: a TAXII pull has no attachment record to hang
          provenance on, unlike a PDF that was uploaded. Provenance travels in
          `source_kind` / `source_name` instead, which is what
          `identifierSource` on each CVE record records.
        findings_json: "{{ vars.findings_json }}"
        source_kind: "TAXII 2.1 subscription"
        source_tag: "src:taxii"
        source_name: "{{ vars.report_names }}"
        source_ref: ""
        nvd_http_config: "{{ vars.nvd_http_config }}"
        fleet_config: "{{ vars.fleet_config }}"
        band_p2: "{{ vars.band_p2 }}"
        band_p3: "{{ vars.band_p3 }}"
        band_p4: "{{ vars.band_p4 }}"
        # The feed path tickets on exactly the same terms as the file path --
        # that is the whole reason the classifier is shared rather than copied.
        ticketing_enabled: "{{ vars.ticketing_enabled }}"
        jira_config: "{{ vars.jira_config }}"
        jira_project: "{{ vars.jira_project }}"
        ticket_tiers: "{{ vars.ticket_tiers }}"
        ticket_anchor_label: "{{ vars.ticket_anchor_label }}"
        next: Advance Cursor

      - name: Nothing New Comment
        type: create_record
        module: comments
        comment: >
          Deliberately still a record. "The subscription was polled and had
          nothing" is a different statement from "nobody polled it", and only
          one of those is reassuring.
        fields:
          content: >
            <p><b>TAXII intake: nothing to classify.</b></p>
            <p>The collection answered with
            {{ vars.objects_seen }} STIX object(s).
            {{ vars.parse_note }}.</p>
            <p>This is an empty result, not a read failure -- an incremental
            pull with nothing new is the normal case for a subscription.</p>
        next: Advance Cursor

      - name: Advance Cursor
        type: connector
        connector: cyops_utilities
        operation: updatemacro
        config: ""
        comment: >
          LAST, AND ONLY ON A PATH THAT SUCCEEDED. Both routes here are good
          outcomes -- CVEs were written, or the feed genuinely had nothing --
          and neither is reachable from a failed Classify, so a run that dies
          part-way leaves the mark where it was and the next run re-pulls the
          same window. That makes delivery at-least-once, which is the correct
          bias: the upsert keys on cVEID, so a repeat is a no-op, whereas a
          cursor advanced past records that were never written loses them with
          nothing to show it happened.

          `updatemacro` UPSERTS -- verified live against 8.0.0, it created a
          macro that did not exist -- so no init/create-if-missing step is
          needed. FortiSIEM's shipped ingestion carries an `Init Macros` child
          for the wizard's mapping preview, not because creation is required.

          The value is `fetch_time`, captured before the fetch, NOT now.
        params:
          macro: "{{ vars.pull_time_macro }}"
          value: "{{ vars.fetch_time }}"
        next: Done

      - name: Done
        type: end


# =========================================================================
# UC-16 -- CVE intake from an Inoreader subscription
# =========================================================================
  - name: Ingest CVE Report from Inoreader
    description: >
      Poll an Inoreader stream for security news and vendor advisories, pull
      the CVE identifiers out of the prose, and classify every one of them the
      same way a PDF, a CSV or a TAXII pull would have been classified.
    tag: uc16
    steps:

      - name: Start
        type: start
        module: indicators
        button_label: Ingest CVEs from Inoreader
        comment: >
          Manual and record-free: this is a feed pull, not an action on a
          record. A start step still needs a `module:` -- without one it has no
          trigger route and cannot be triggered by the SDK at all.
        next: Inoreader Config

      - name: Inoreader Config
        type: set_variable
        comment: >
          The band and config names are passed straight through to UC-14's
          classifier, so this door and the other three tier identically by
          construction. Changing a band here and not there is the failure this
          shape exists to prevent.
        vars:
          inoreader_config: "inoreader-lab"
          # How many stream items to read per pull. Inoreader's Reader API
          # meters by request rather than by item, so a larger page is CHEAPER
          # than paging -- the opposite of the TAXII door, where a small
          # max_page_size forces the client to prove it follows `next`.
          item_count: 100
          # A CAP, and the reason for it is downstream. The shared classifier
          # asks EPSS for the whole batch in ONE call with a comma-separated
          # CVE list -- fine for the four-to-six a fixture door produces, and
          # not fine for a news feed: a hundred articles yielded enough CVEs
          # that the API stopped returning JSON at all, and the run died in
          # `Classify` with a bare parse error that named neither EPSS nor the
          # size of the list. Capping here bounds the batch; chunking that call
          # is the real fix and belongs in the classifier, where it would serve
          # all four doors.
          max_findings: 15
          nvd_http_config: "nvd-public-http"
          fleet_config: "patch-fleet"
          band_p2: 80
          band_p3: 60
          band_p4: 35
          ticketing_enabled: "no"
          jira_config: "jira-demo"
          jira_project: "INC"
          ticket_anchor_label: "vuln-management"
          ticket_tiers: "P1,P2"
        next: Fetch Stream

      - name: Fetch Stream
        type: connector
        connector: inoreader
        operation: get_stream_contents
        config: "{{ vars.inoreader_config }}"
        comment: >
          LIVE. Inoreader's Reader API, through the `inoreader` connector.

          No auth appears here. The connector holds the App ID/Key and the
          OAuth refresh token on its configuration, mints an access token on
          demand and persists the rotated refresh token back -- Inoreader
          rotates it on EVERY refresh. That is the whole reason this is a
          connector rather than `generic-http` with a bearer header: a rotating
          credential written back by the thing that rotated it.

          `get_stream_contents` and NOT `fetch_articles`. The tidy normalized
          shape `fetch_articles` returns hard-codes oldest-first so a truncated
          ingestion resumes from a sane cursor; here that would make every run
          re-read the oldest items in the feed. The cost of choosing correctly
          is that Extract CVEs reads the RAW Inoreader item shape --
          `origin.title`, `summary.content`, `canonical[0].href`.

          This playbook does NOT mark anything read. That is a second call, a
          WRITE to the feed reader on a path that may still fail, and it spends
          the scarcer of Inoreader's two rate-limit zones. De-duplication
          happens in FortiSOAR, where the upsert keys on cVEID, so re-reading
          an item is a no-op rather than a duplicate.
        params:
          # `max_records`, NOT `number_of_items` -- which the connector accepts
          # silently and ignores, returning its own default. The compiler
          # catches the wrong name; a live call does not, because a feed that
          # returned 100 items when you asked for 3 looks like a working feed.
          max_records: "{{ vars.item_count }}"
          unread_only: true
        next: Extract CVEs

      - name: Extract CVEs
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          A news feed is the LEAST structured door of the four. A CSV has a CVE
          column and a STIX vulnerability has an `external_references` entry;
          an article has a CVE id somewhere in a sentence, or it has none at
          all and is about something else entirely.

          So the CVE id is the only thing taken from the prose. Everything that
          could be got wrong by reading English -- which product, which fixed
          version, which hosts -- is left empty for the classifier to establish
          from NVD and the live estate. That is the same discipline the PDF
          door follows and for the same reason: guessing a product from a
          headline is how "Firefox" gets matched out of a blog post about a
          root-store policy.
        params:
          code: |
            import json, re, html

            raw = json.loads(r'''{{ vars.steps.Fetch_Stream.data | tojson }}''')
            items = (raw or {}).get("items") or []

            CVE_RE = re.compile(r"CVE-\d{4}-\d{4,7}", re.I)
            TAG_RE = re.compile(r"<[^>]+>")
            EVIDENCE_MAX = 300

            def text_of(item):
                """Title plus body, tags stripped, entities unescaped."""
                body = ((item.get("summary") or {}).get("content")) or ""
                joined = "{} {}".format(item.get("title") or "", body)
                return " ".join(html.unescape(TAG_RE.sub(" ", joined)).split())

            # One finding per CVE, not per article: the same CVE routinely
            # appears in several outlets on the same morning, and three
            # articles about one CVE is one finding with better evidence, not
            # three findings. The FIRST article naming it wins the evidence
            # slot because the feed is newest-first.
            found = {}
            sources = []
            for item in items:
                prose = text_of(item)
                ids = {m.group(0).upper() for m in CVE_RE.finditer(prose)}
                if not ids:
                    continue
                origin = (item.get("origin") or {}).get("title") or "Inoreader"
                if origin not in sources:
                    sources.append(origin)
                for cve in ids:
                    if cve in found:
                        continue
                    found[cve] = {
                        "cve": cve,
                        # A news article carries no scanner score and no host
                        # list. Both stay empty rather than being invented;
                        # the classifier treats unknown exposure as its own
                        # case and scores CVSS from live NVD. VPR is
                        # Tenable-proprietary, so it is named and left None
                        # rather than omitted -- every door emits the same
                        # finding shape.
                        "cvss_from_source": None,
                        "vpr_from_source": None,
                        "hosts": [],
                        "host_count": 0,
                        "asset_categories": [],
                        "product": "",
                        "solution": "",
                        "evidence": prose[:EVIDENCE_MAX],
                    }

            findings = [found[k] for k in sorted(found)]

            # NEVER a silent truncation. A capped run and a quiet run look
            # identical unless the number dropped is stated, and "we ingested
            # the feed" is a very different claim from "we ingested fifteen of
            # the forty CVEs the feed named".
            cap = int("{{ vars.max_findings }}")
            dropped = max(0, len(findings) - cap)
            findings = findings[:cap]

            note = ""
            if items and not findings:
                note = ("None of them named a CVE -- a security news feed "
                        "carries a great deal that is not a vulnerability")
            elif dropped:
                note = ("{} further CVE(s) named by the feed were not "
                        "classified in this run -- the batch is capped at "
                        "{}".format(dropped, cap))
            return {
                "count": len(findings),
                "findings_json": json.dumps(findings),
                "items_seen": len(items),
                "dropped": dropped,
                "source_names": "; ".join(sources[:6]) or "Inoreader",
                "note": note,
            }
        set:
          findings_json: "{{ vars.steps.Extract_CVEs.data.code_output.findings_json }}"
          finding_count: "{{ vars.steps.Extract_CVEs.data.code_output.count }}"
          items_seen: "{{ vars.steps.Extract_CVEs.data.code_output.items_seen }}"
          source_names: "{{ vars.steps.Extract_CVEs.data.code_output.source_names }}"
          parse_note: "{{ vars.steps.Extract_CVEs.data.code_output.note }}"
        next: Feed Gate

      - name: Feed Gate
        type: decision
        comment: >
          A feed with nothing new in it is a legitimate outcome, not a failure.
          A run that quietly does nothing and one that had nothing to do look
          identical from outside, so both are recorded.
        conditions:
          - condition: "{{ vars.finding_count | int > 0 }}"
            next: Classify
        default: Nothing To Classify Comment

      - name: Classify
        type: workflow_reference
        target: Classify CVE Findings
        apply_async: false
        comment: >
          UC-14's classifier, called UNCHANGED -- the same child the PDF, CSV
          and TAXII doors call. Child input params are authored at STEP level
          (the compiler rejects an `arguments:` wrapper) and only scalars
          survive the boundary, which is why the findings cross it as a JSON
          string.

          `source_ref` is empty: a feed pull has no attachment record to hang
          provenance on, unlike a PDF that was uploaded. Provenance travels in
          `source_kind` / `source_name` instead, which is what
          `identifierSource` on each CVE record ends up recording.
        findings_json: "{{ vars.findings_json }}"
        source_kind: "Inoreader subscription"
        source_tag: "src:inoreader"
        source_name: "{{ vars.source_names }}"
        source_ref: ""
        nvd_http_config: "{{ vars.nvd_http_config }}"
        fleet_config: "{{ vars.fleet_config }}"
        band_p2: "{{ vars.band_p2 }}"
        band_p3: "{{ vars.band_p3 }}"
        band_p4: "{{ vars.band_p4 }}"
        ticketing_enabled: "{{ vars.ticketing_enabled }}"
        jira_config: "{{ vars.jira_config }}"
        jira_project: "{{ vars.jira_project }}"
        ticket_tiers: "{{ vars.ticket_tiers }}"
        ticket_anchor_label: "{{ vars.ticket_anchor_label }}"
        next: Done

      - name: Nothing To Classify Comment
        type: create_record
        module: comments
        comment: >
          Deliberately still a record. "The subscription was polled and had
          nothing worth classifying" is a different statement from "nobody
          polled it", and only one of those is reassuring.
        fields:
          content: >
            <p><b>Inoreader intake: nothing to classify.</b></p>
            <p>The stream answered with {{ vars.items_seen }} item(s).
            {{ vars.parse_note }}.</p>
        next: Done

      - name: Done
        type: end


# =========================================================================
# Patch Selected Assets -- operator picks the machines, script is generated
# =========================================================================
  - name: Patch Selected Assets
    description: >
      Run on a Vulnerability record. Reads the affected machines from its linked
      Assets, asks an operator to CONFIRM which of them to patch, generates the
      remediation script from the product on the record, and runs it on exactly
      the machines that were ticked.
    tag: vigor-patch
    steps:

      - name: Start
        type: start
        module: vulnerabilities
        button_label: Patch Selected Assets
        comment: >
          Bound to `vulnerabilities` so it appears under Execute on the record
          an analyst is already reading.
        next: Patch Config

      - name: Patch Config
        type: set_variable
        comment: >
          `package_map` is product -> Chocolatey package id, and it is the ONLY
          product-specific knowledge this playbook holds.

          There is no upgrade-script-per-product here, and no Fleet script
          library entry either. Fleet runs ad-hoc `script_contents` over its
          JSON API, so the script is GENERATED per run from the product on the
          record. That removes the failure this pipeline's older sibling has to
          warn about at length: a stored script id is assigned per Fleet
          instance, and the id after an upgrade script is typically its
          ROLLBACK, so a stale integer downgrades the product while reporting a
          patch. Nothing to go stale if nothing is stored.

          `putty.install` and NOT `putty`: the latter is a meta-package that
          merely depends on the former, and the uninstall registry -- which is
          what the Fleet inventory reads -- only ever carries the real one.
        vars:
          fleet_config: "patch-fleet"
          package_map: "7-Zip=7zip.install,Notepad++=notepadplusplus.install,PuTTY=putty.install,VLC=vlc,Mozilla Firefox=firefox"
        next: Read Vulnerability

      - name: Read Vulnerability
        type: find_record
        module: vulnerabilities
        comment: >
          Re-read rather than trusting `vars.input.records[0]`, which carries
          only what the trigger happened to send.
        filters:
          - {field: id, operator: eq, value: "{{ vars.input.records[0].id }}"}
        limit: 1
        next: Find Linked Assets

      - name: Find Linked Assets
        type: find_record
        module: assets
        comment: >
          The machines this finding says are affected. The estate sync owns that
          relationship, so if it links a fourth asset tomorrow this playbook
          offers four without being edited.
        filters:
          - {field: vulnerabilities.id, operator: eq, value: "{{ vars.input.records[0].id }}"}
        limit: 200
        next: Build Choices

      - name: Build Choices
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Turns the linked assets into the option list the operator will tick,
          and works out which Chocolatey package the product maps to.

          The product is recognised by matching the package map's own keys
          against the record -- the map already enumerates everything we can
          patch, so it is the right vocabulary to match on, and a product we
          cannot patch is caught HERE rather than by dispatching a script that
          silently installs nothing.
        params:
          code: |
            import json, re

            def rows(blob):
                if isinstance(blob, dict):
                    for k in ("hydra:member", "data", "records"):
                        if isinstance(blob.get(k), list):
                            return blob[k]
                    return [blob] if blob.get("@id") else []
                return blob if isinstance(blob, list) else []

            rec = (rows(json.loads(r'''{{ vars.steps.Read_Vulnerability | tojson }}''')) or [{}])[0]
            assets = rows(json.loads(r'''{{ vars.steps.Find_Linked_Assets | tojson }}'''))

            pmap = {}
            for pair in "{{ vars.package_map }}".split(","):
                if "=" in pair:
                    left, right = pair.split("=", 1)
                    pmap[left.strip()] = right.strip()

            name = str(rec.get("name") or "")
            vid = str(rec.get("vulnerabilityId") or "")
            haystack = "{} {}".format(name, vid).lower()

            # Longest key first, so "7-Zip Extra" cannot be shadowed by "7-Zip".
            product, package = "", ""
            for cand in sorted(pmap, key=len, reverse=True):
                if cand.lower() in haystack:
                    product, package = cand, pmap[cand]
                    break

            # Hostnames in BOTH forms the two sides disagree about: Fleet
            # reports an FQDN, an asset record usually carries the short name.
            hosts = []
            for a in assets:
                h = a.get("hostname") or a.get("name")
                if h and h not in hosts:
                    hosts.append(str(h))

            return {
                "product": product,
                "package": package,
                "hosts_json": json.dumps(hosts),
                "host_count": len(hosts),
                "choices": hosts,
                "cve": vid if vid.upper().startswith("CVE-") else "",
                "summary": name[:200],
                "patchable": "yes" if (package and hosts) else "no",
                "why_not": ("no Chocolatey package is mapped for this product"
                            if not package else
                            ("the finding has no linked assets" if not hosts else "")),
            }
        set:
          product: "{{ vars.steps.Build_Choices.data.code_output.product }}"
          package: "{{ vars.steps.Build_Choices.data.code_output.package }}"
          host_count: "{{ vars.steps.Build_Choices.data.code_output.host_count }}"
          cve: "{{ vars.steps.Build_Choices.data.code_output.cve }}"
          summary: "{{ vars.steps.Build_Choices.data.code_output.summary }}"
          patchable: "{{ vars.steps.Build_Choices.data.code_output.patchable }}"
          why_not: "{{ vars.steps.Build_Choices.data.code_output.why_not }}"
        next: Patchable Gate

      - name: Patchable Gate
        type: decision
        comment: >
          Refusing early and saying why beats raising a gate that offers an
          operator a choice which could not have been carried out.
        conditions:
          - condition: "{{ vars.patchable == 'yes' }}"
            next: Confirm Assets
        default: Cannot Patch Comment

      - name: Confirm Assets
        type: manual_input
        title: "Select the machines to patch"
        description: >
            **{{ vars.product }}** will be upgraded to the current release on the
            machines ticked below.

            This finding
            (`{{ vars.cve }}`) affects **{{ vars.host_count }}** machine(s):
            {{ vars.summary }}.

            Nothing is patched on a machine left unticked. The upgrade runs an
            installer as SYSTEM -- expect the application to close, and anything
            unsaved in it to be lost.
        comment: >
          A MULTISELECT rather than a yes/no, because "patch this vulnerability"
          and "patch it on that machine" are different decisions and the estate
          is where they diverge: a workstation and the box running the change
          window are both linked to the same finding.

          `options` is jinja resolving to the host list this run just built, so
          the operator picks from the machines this finding actually names --
          never a typed hostname, which is how a patch reaches a machine nobody
          reviewed.
        is_approval: true
        assign_to:
          # ASSIGNED, and it has to be. A manual_input with no owner is created
          # UNOWNED -- the run parks in `awaiting` forever and the gate is
          # invisible to every analyst and to the pending-input queue, which
          # reads as a hung playbook rather than as a prompt nobody can see.
          # Proven here: the first build of this step omitted assign_to and the
          # run sat in `awaiting` with the gate listed nowhere.
          #
          # A team NAME is correct: the compiler resolves it to the IRI (and
          # teamname) FSR's wire format wants. A bare name written straight to
          # the wire does not route at all.
          team: "SOC Team"
        inputs:
          - name: targets
            kind: multiselect
            label: Machines to patch
            required: true
            options: "{{ vars.steps.Build_Choices.data.code_output.choices }}"
        options:
          - {option: "Patch", primary: true, next: Resolve Fleet Ids}
          - {option: "Cancel", next: Cancelled Comment}

      - name: Resolve Fleet Ids
        type: connector
        connector: generic-http
        operation: http_get
        config: "{{ vars.fleet_config }}"
        comment: >
          Asset names are not Fleet host ids, and a Fleet id is assigned in
          ENROLMENT ORDER -- a property of when a machine happened to enrol
          rather than of which machine it is. They are resolved fresh on every
          run for that reason; ids observed to swap between two workstations
          inside an hour on this very lab.
        params:
          rest_api: "/api/v1/fleet/hosts"
          parameter:
            per_page: 200
        next: Build Script

      - name: Build Script
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Generates the remediation script and maps the TICKED names to Fleet
          ids. Only what the operator selected is dispatched -- the gate's
          answer is the authorisation, so anything not in it is not a target.
        params:
          code: |
            import json

            # `| default([], true)` is NOT belt-and-braces. A bare `| tojson`
            # over an undefined path raises
            # `Object of type ChainableUndefined is not JSON serializable`
            # and kills the run with a Jinja traceback naming neither the step
            # nor the field -- seen live when the gate's answer did not carry
            # the input. An empty list instead falls through to the
            # "nothing resolved" refusal below, which says what happened.
            picked = json.loads(r'''{{ vars.steps.Confirm_Assets.input.targets | default([], true) | tojson }}''')
            if isinstance(picked, str):
                picked = [p.strip() for p in picked.split(",") if p.strip()]
            picked = [str(p).strip() for p in (picked or [])]

            body = json.loads(r'''{{ vars.steps.Resolve_Fleet_Ids.data | tojson }}''')
            fleet_hosts = ((body or {}).get("body") or {}).get("hosts") or []

            # Matched on the SHORT name: the same endpoint reports itself as
            # BOX.fabric.lab on one run and BOX on the next across a
            # re-enrolment, and an asset record may hold either.
            by_short = {}
            for h in fleet_hosts:
                hn = str(h.get("hostname") or "")
                by_short.setdefault(hn.split(".")[0].upper(), h.get("id"))

            targets, unresolved = [], []
            for name in picked:
                hid = by_short.get(name.split(".")[0].upper())
                if hid and hid not in targets:
                    targets.append(hid)
                elif not hid:
                    unresolved.append(name)

            package = "{{ vars.package }}"
            # Generated, not stored. `--allow-downgrade` is deliberately absent:
            # this step patches forward, and a package manager that will happily
            # move backwards is how a "patch" quietly becomes a rollback.
            script = "\n".join([
                "$ErrorActionPreference = 'Stop'",
                "$choco = \"$env:ProgramData\\chocolatey\\bin\\choco.exe\"",
                "if (-not (Test-Path $choco)) { Write-Output 'Chocolatey is not installed on this host.'; exit 2 }",
                "& $choco upgrade {} -y --no-progress".format(package),
                "$code = $LASTEXITCODE",
                # 1641/3010 are success-pending-reboot. Chocolatey passes the
                # installer's code straight through, so a reboot-pending
                # install wears a number that looks like a failure.
                "if ($code -ne 0 -and $code -ne 1641 -and $code -ne 3010) { Write-Output \"choco exited $code\"; exit 4 }",
                "exit 0",
            ])

            return {
                "script": script,
                # BOTH shapes: `targets` is the real list `for_each` iterates,
                # `targets_json` is the string the receipt prints.
                "targets": targets,
                "targets_json": json.dumps(targets),
                "target_count": len(targets),
                "picked_names": ", ".join(picked) or "(none)",
                "unresolved": ", ".join(unresolved),
                "ready": "yes" if targets else "no",
                # Names the REAL cause. Without this an empty selection and an
                # unresolvable hostname both arrive at the same refusal with
                # nothing to say, and the comment blames the estate for what
                # was actually an empty gate answer.
                "why_not": ("" if targets else
                            ("the confirmation gate returned no machines -- "
                             "nothing was ticked, or the answer did not carry "
                             "the selection"
                             if not picked else
                             "none of the selected machines could be resolved "
                             "in Fleet")),
            }
        set:
          script: "{{ vars.steps.Build_Script.data.code_output.script }}"
          targets_json: "{{ vars.steps.Build_Script.data.code_output.targets_json }}"
          target_count: "{{ vars.steps.Build_Script.data.code_output.target_count }}"
          picked_names: "{{ vars.steps.Build_Script.data.code_output.picked_names }}"
          unresolved: "{{ vars.steps.Build_Script.data.code_output.unresolved }}"
          ready: "{{ vars.steps.Build_Script.data.code_output.ready }}"
          # Overrides the reason Build Choices set: that one is about whether
          # the product is patchable at all, this one about whether the gate's
          # answer produced targets. Build Script only runs once the first
          # question is already answered yes.
          why_not: "{{ vars.steps.Build_Script.data.code_output.why_not }}"
        next: Targets Gate

      - name: Targets Gate
        type: decision
        comment: >
          An operator can tick a machine Fleet cannot see. Dispatching to an
          empty target list succeeds and patches nothing, which is the worst
          available outcome: a green run over an untouched estate.
        conditions:
          - condition: "{{ vars.ready == 'yes' }}"
            next: Dispatch
        default: Cannot Patch Comment

      - name: Dispatch
        type: connector
        connector: generic-http
        operation: http_post
        config: "{{ vars.fleet_config }}"
        comment: >
          One call PER HOST, and that shape is forced by Fleet rather than
          chosen. `/scripts/run/batch` takes many hosts in a single call but
          only accepts a `script_id` -- a script already stored in the
          library. Handed `script_contents` it answers 404 "Script was not
          found in the datastore". `/scripts/run` is the endpoint that takes
          ad-hoc contents, and it takes one host.

          So: loop, and keep the generated script. The alternative is to upload
          the script to Fleet's library first, which needs a multipart POST and
          leaves an entry behind per product per run -- and a stored script id
          is exactly the thing that goes stale and dispatches a rollback while
          reporting a patch.

          Fleet QUEUES each run and answers 202 with an execution id, which is
          why the receipt below reports DISPATCHED and not PATCHED.
        params:
          rest_api: "/api/v1/fleet/scripts/run"
          body_type: json
          data: >-
            {"host_id": {{ vars.item }},
             "script_contents": {{ vars.script | tojson }}}
        for_each:
          item: "{{ vars.steps.Build_Script.data.code_output.targets }}"
        next: Patch Comment

      - name: Patch Comment
        type: create_record
        module: comments
        comment: >
          Says DISPATCHED, not patched. The batch is queued; the version that
          proves it moved comes from re-reading the inventory afterwards, and
          claiming the stronger word here is exactly the false all-clear this
          pipeline exists to avoid.
        fields:
          content: >
            <p><b>Patch dispatched to {{ vars.target_count }} machine(s).</b></p>
            <p><b>Product:</b> {{ vars.product }}
            (Chocolatey package <code>{{ vars.package }}</code>)</p>
            <p><b>Selected by the operator:</b> <code>{{ vars.picked_names }}</code></p>
            <p><b>Not resolvable in Fleet and therefore NOT patched:</b>
            <code>{{ vars.unresolved }}</code></p>
            <p>The upgrade script was generated for this run rather than taken
            from a stored script, so there is no stale script id to dispatch the
            wrong action. Fleet has queued the work; re-read the inventory to
            confirm the version actually moved.</p>
          vulnerabilities: ["{{ vars.input.records[0]['@id'] }}"]
        next: Done

      - name: Cancelled Comment
        type: create_record
        module: comments
        comment: >
          A cancelled gate is an outcome, not an error, and is written down so
          nobody later assumes the estate moved.
        fields:
          content: >
            <p><b>Patch cancelled at the confirmation gate -- nothing was
            dispatched.</b></p>
            <p>{{ vars.product }} remains at its installed version on all
            {{ vars.host_count }} affected machine(s).</p>
          vulnerabilities: ["{{ vars.input.records[0]['@id'] }}"]
        next: Done

      - name: Cannot Patch Comment
        type: create_record
        module: comments
        comment: >
          Refusing loudly. A run that cannot act and says nothing is
          indistinguishable from one that acted.
        fields:
          content: >
            <p><b>No patch dispatched.</b></p>
            <p>{{ vars.why_not }}{{ vars.unresolved }}.</p>
            <p>Nothing ran on any machine.</p>
          vulnerabilities: ["{{ vars.input.records[0]['@id'] }}"]
        next: Done

      - name: Done
        type: end


# =========================================================================
# Reset Software Version -- put chosen hosts back on a chosen version
# =========================================================================
  - name: Reset Software Version
    description: >
      Lab setup, not remediation. Pick a product, a version and the machines,
      and Chocolatey is driven BACKWARDS to put them there -- so a patch demo
      has a real version move to make the next time it runs.
    tag: vigor-patch
    steps:

      - name: Start
        type: start
        module: assets
        button_label: Reset Software Version
        comment: >
          Record-free: this resets whichever machines are ticked, not the asset
          it was launched from. A start step still needs a `module:` or it has
          no trigger route and cannot be launched at all.
        next: Reset Config

      - name: Reset Config
        type: set_variable
        comment: >
          `package_map` is product -> Chocolatey package id, the same map the
          patch playbook uses. `default_versions` is the baseline this lab was
          built on, offered as the default so the common case is one click.
        vars:
          fleet_config: "patch-fleet"
          package_map: "7-Zip=7zip.install,Notepad++=notepadplusplus.install,PuTTY=putty.install,VLC=vlc,Mozilla Firefox=firefox"
          default_versions: "7-Zip=19.00,Notepad++=8.6.2,PuTTY=0.70,VLC=3.0.16,Mozilla Firefox=123.0.1"
        next: Fetch Hosts

      - name: Fetch Hosts
        type: connector
        connector: generic-http
        operation: http_get
        config: "{{ vars.fleet_config }}"
        comment: >
          The estate, read BEFORE the prompt so the operator ticks real
          machines rather than typing a hostname. A typed hostname is how a
          reset reaches a box nobody meant to touch.
        params:
          rest_api: "/api/v1/fleet/hosts"
          parameter:
            per_page: 200
        next: Build Choices

      - name: Build Choices
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Turns the Fleet host list and the product map into the two option
          lists the prompt offers.
        params:
          code: |
            import json

            body = json.loads(r'''{{ vars.steps.Fetch_Hosts.data | tojson }}''')
            hosts = ((body or {}).get("body") or {}).get("hosts") or []

            names, online = [], 0
            for h in hosts:
                hn = str(h.get("hostname") or "").strip()
                if not hn:
                    continue
                names.append(hn)
                if str(h.get("status") or "").lower() == "online":
                    online += 1

            products = []
            for pair in "{{ vars.package_map }}".split(","):
                if "=" in pair:
                    products.append(pair.split("=", 1)[0].strip())

            return {
                "host_choices": sorted(names),
                "product_choices": sorted(products),
                "host_count": len(names),
                "online_count": online,
            }
        set:
          host_count: "{{ vars.steps.Build_Choices.data.code_output.host_count }}"
          online_count: "{{ vars.steps.Build_Choices.data.code_output.online_count }}"
        next: Confirm Reset

      - name: Confirm Reset
        type: manual_input
        title: "Reset software to a specific version"
        description: >
            Drives Chocolatey BACKWARDS on the machines ticked below. This is
            lab setup: it makes a machine vulnerable again so a patch run has
            something real to fix.

            {{ vars.online_count }} of {{ vars.host_count }} enrolled machine(s)
            are online. A ticked machine that is offline will queue and run when
            it next checks in.

            Leave the version blank to use this lab's baseline for the product.
        comment: >
          ASSIGNED to a team. A manual_input with no owner is created unowned:
          the run parks in `awaiting` forever and the prompt is invisible to
          every analyst and to the pending-input queue, which reads as a hung
          playbook rather than as a prompt nobody can see.
        is_approval: true
        assign_to:
          team: "SOC Team"
        inputs:
          - name: product
            kind: select
            label: Product
            required: true
            options: "{{ vars.steps.Build_Choices.data.code_output.product_choices }}"
          - name: version
            kind: text
            label: Version (blank = this lab's baseline)
            required: false
          - name: hosts
            kind: multiselect
            label: Machines to reset
            required: true
            options: "{{ vars.steps.Build_Choices.data.code_output.host_choices }}"
        options:
          - {option: "Reset", primary: true, next: Build Script}
          - {option: "Cancel", next: Cancelled Comment}

      - name: Build Script
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Generates the downgrade and maps ticked names to Fleet ids.

          `--allow-downgrade` is the whole point. Without it Chocolatey treats a
          LOWER version as "nothing to do" and exits 0, leaving a lab that looks
          reset and is not -- and every later patch run then verifies a move
          that had already happened. `--force` makes it reinstall even when
          choco believes the package is already at that version.
        params:
          code: |
            import json

            # See the note in Patch Selected Assets: a bare `| tojson` over an
            # undefined path kills the run with an opaque Jinja error.
            picked = json.loads(r'''{{ vars.steps.Confirm_Reset.input.hosts | default([], true) | tojson }}''')
            if isinstance(picked, str):
                picked = [p.strip() for p in picked.split(",") if p.strip()]
            picked = [str(p).strip() for p in (picked or [])]

            product = str(r'''{{ vars.steps.Confirm_Reset.input.product | default('', true) }}''').strip()
            version = str(r'''{{ vars.steps.Confirm_Reset.input.version | default('', true) }}''').strip()

            def as_map(raw):
                out = {}
                for pair in raw.split(","):
                    if "=" in pair:
                        left, right = pair.split("=", 1)
                        out[left.strip()] = right.strip()
                return out

            packages = as_map("{{ vars.package_map }}")
            baselines = as_map("{{ vars.default_versions }}")

            package = packages.get(product, "")
            # Blank means "this lab's baseline", NOT "latest". A reset that
            # silently installed the newest build would be the exact opposite of
            # what this playbook is for.
            if not version:
                version = baselines.get(product, "")

            body = json.loads(r'''{{ vars.steps.Fetch_Hosts.data | tojson }}''')
            fleet_hosts = ((body or {}).get("body") or {}).get("hosts") or []
            by_short = {}
            for h in fleet_hosts:
                hn = str(h.get("hostname") or "")
                by_short.setdefault(hn.split(".")[0].upper(), h.get("id"))

            targets, unresolved = [], []
            for name in picked:
                hid = by_short.get(name.split(".")[0].upper())
                if hid and hid not in targets:
                    targets.append(hid)
                elif not hid:
                    unresolved.append(name)

            script = "\n".join([
                "$ErrorActionPreference = 'Stop'",
                "$choco = \"$env:ProgramData\\chocolatey\\bin\\choco.exe\"",
                "if (-not (Test-Path $choco)) { Write-Output 'Chocolatey is not installed on this host.'; exit 2 }",
                "& $choco install {} --version={} -y --allow-downgrade --force --no-progress".format(package, version),
                "$code = $LASTEXITCODE",
                "if ($code -ne 0 -and $code -ne 1641 -and $code -ne 3010) { Write-Output \"choco exited $code\"; exit 4 }",
                "exit 0",
            ])

            ready = "yes" if (package and version and targets) else "no"
            why_not = ""
            if not package:
                why_not = "no Chocolatey package is mapped for {}".format(product or "that product")
            elif not version:
                why_not = "no version was given and {} has no baseline in this playbook".format(product)
            elif not picked:
                why_not = ("the confirmation gate returned no machines -- "
                           "nothing was selected, or the answer did not carry "
                           "the selection")
            elif not targets:
                why_not = "none of the selected machines could be resolved in Fleet"

            return {
                "script": script, "targets": targets,
                "target_count": len(targets),
                "product": product, "package": package, "version": version,
                "picked_names": ", ".join(picked) or "(none)",
                "unresolved": ", ".join(unresolved),
                "ready": ready, "why_not": why_not,
            }
        set:
          target_count: "{{ vars.steps.Build_Script.data.code_output.target_count }}"
          product: "{{ vars.steps.Build_Script.data.code_output.product }}"
          package: "{{ vars.steps.Build_Script.data.code_output.package }}"
          script: "{{ vars.steps.Build_Script.data.code_output.script }}"
          # QUOTE-WRAPPED, and it has to be. A `set:` whose value is a bare
          # `{{ }}` expression hands the value over as the NATIVE object, so a
          # numeric-looking string is coerced -- the baseline "19.00" arrived as
          # 19.0 and the receipt read "forced to 19".
          #
          # Measured on 8.0.0, all three forms in one run:
          #     "{{ x }}"    -> 19.0     coerced
          #     "'{{ x }}'"  -> "19.00"  string, and the quotes do NOT survive
          #                              into the value
          #     "{{ x }} "   -> 19.0     STILL coerced -- a trailing space is
          #                              stripped before the parse, so
          #                              "append something" is not the fix it
          #                              looks like. `"{{ x }} / 10"` elsewhere
          #                              in this file survives only because
          #                              " / 10" makes the whole string
          #                              unparseable as a number.
          version: "'{{ vars.steps.Build_Script.data.code_output.version }}'"
          picked_names: "{{ vars.steps.Build_Script.data.code_output.picked_names }}"
          unresolved: "{{ vars.steps.Build_Script.data.code_output.unresolved }}"
          ready: "{{ vars.steps.Build_Script.data.code_output.ready }}"
          why_not: "{{ vars.steps.Build_Script.data.code_output.why_not }}"
        next: Ready Gate

      - name: Ready Gate
        type: decision
        comment: >
          Dispatching to an empty target list succeeds and changes nothing,
          which is the worst outcome available: a green run over an untouched
          estate that the next demo assumes was reset.
        conditions:
          - condition: "{{ vars.ready == 'yes' }}"
            next: Dispatch
        default: Cannot Reset Comment

      - name: Dispatch
        type: connector
        connector: generic-http
        operation: http_post
        config: "{{ vars.fleet_config }}"
        comment: >
          One call PER HOST, forced by Fleet rather than chosen:
          `/scripts/run/batch` takes many hosts but ONLY a stored `script_id`
          -- handed `script_contents` it answers 404 "Script was not found in
          the datastore". `/scripts/run` is the endpoint that takes an ad-hoc
          script, and it takes one host.
        params:
          rest_api: "/api/v1/fleet/scripts/run"
          body_type: json
          data: >-
            {"host_id": {{ vars.item }},
             "script_contents": {{ vars.script | tojson }}}
        for_each:
          item: "{{ vars.steps.Build_Script.data.code_output.targets }}"
        next: Reset Comment

      - name: Reset Comment
        type: create_record
        module: comments
        comment: >
          Says DISPATCHED. Fleet queues the run; the version that proves it
          moved comes from re-reading the inventory, which lags a check-in.
        fields:
          content: >
            <p><b>Version reset dispatched to {{ vars.target_count }} machine(s).</b></p>
            <p><b>{{ vars.product }}</b> (<code>{{ vars.package }}</code>) is
            being forced to <b>{{ vars.version }}</b>.</p>
            <p><b>Selected:</b> <code>{{ vars.picked_names }}</code></p>
            <p><b>Not resolvable in Fleet and therefore NOT reset:</b>
            <code>{{ vars.unresolved }}</code></p>
            <p>This is lab setup: those machines are now BELOW the fixed
            version again and will re-appear as exposed once the inventory
            re-collects.</p>
        next: Done

      - name: Cancelled Comment
        type: create_record
        module: comments
        comment: >
          A cancelled reset is an outcome, written down so nobody assumes the
          lab was put back.
        fields:
          content: >
            <p><b>Version reset cancelled -- nothing was dispatched.</b></p>
        next: Done

      - name: Cannot Reset Comment
        type: create_record
        module: comments
        comment: >
          Refusing loudly. A run that could not act and said nothing is
          indistinguishable from one that did.
        fields:
          content: >
            <p><b>No reset dispatched.</b></p>
            <p>{{ vars.why_not }}. <code>{{ vars.unresolved }}</code></p>
            <p>Nothing ran on any machine.</p>
        next: Done

      - name: Done
        type: end


# =========================================================================
# DEMO RESET -- was vuln_demo_reset/playbooks/demo_reset.yaml
# =========================================================================
  # ======================================================= intake (fast) =====
  - name: Reset Intake Demo
    description: >
      Hard-delete the CVE records this demo wrote and rewind the TAXII cursor,
      so the file and feed intake acts both open with something to ingest.
      Seconds.
    is_active: true
    steps:
      - name: Start
        type: start
        module: alerts
        button_label: Reset Intake Demo
        comment: >
          Manual and record-free. Nothing here reads the alert it was launched
          from; a start step just needs a `module:` or it has no trigger route
          at all and cannot be launched by anything, button or SDK.
        next: Reset Config

      - name: Reset Config
        type: set_variable
        comment: >
          `demo_sources` is the allow-list the deletes are scoped to, matched as
          a substring against `identifierSource`. See note 2 in the header
          before widening it.

          UC-14 writes the FILE NAME into identifierSource; UC-15 writes
          "TAXII 2.1 subscription: <report name>". Those two shapes are the
          entire surface this reset is allowed to touch.
        vars:
          demo_sources: "tenable_export.csv,dcise_tipper,advisory_no_cves,host_inventory.csv,TAXII 2.1 subscription"
          taxii_macro: "Uc15TaxiiLastPullTime_6ccd1f4b_bb78_5305_9461_88e53e9b43ba"  # pragma: allowlist secret
        next: Find Demo CVEs

      - name: Find Demo CVEs
        type: connector
        connector: cyops_utilities
        operation: make_cyops_request
        config: ""
        comment: >
          Read the CVE module wide and filter in the next step, because the
          markers are SUBSTRINGS and no server-side filter on this endpoint can
          express that. Three were tried against a record known to exist:

            identifierSource=<exact value>       matches (equality only)
            identifierSource__contains=<value>   accepted, matches NOTHING ever
            POST /api/query with a filters array  accepted, returns EVERY row

          The last two are the dangerous pair, and in opposite directions: one
          silently deletes nothing, the other would hand every row in a shared
          module to a delete step. If you ever swap this for a server-side
          filter, verify it returns EXACTLY the rows you expect against a record
          you just created -- not that the call returns 200, and not that the
          count merely differs from the total.

          `$limit=5000` against ~1,700 rows. The cap is real, not theoretical:
          the first version of this used the default 1000 and the receipt read
          "997 kept + 3 deleted", which is exactly 1000 and was the only
          evidence that a third of the module had never been looked at.
        params:
          method: GET
          iri: "/api/3/c_v_es?$limit=5000"
          body: ""
        next: Select For Deletion

      - name: Select For Deletion
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Scope the deletion, and REFUSE it if the read was truncated.

          A truncated scan cannot be distinguished from a clean one by its
          output -- both return a list of rows -- so the only safe response to
          hitting the cap is to stop and say so. Under-deleting silently is what
          makes the NEXT demo show stale numbers with every step green, which is
          the failure this playbook exists to prevent.
        params:
          code: |
            payload = {{ vars.steps.Find_Demo_CVEs.data | default({}) }} or {}
            rows = []
            if isinstance(payload, dict):
                rows = payload.get("hydra:member") or payload.get("member") or []
            elif isinstance(payload, list):
                rows = payload
            total = 0
            if isinstance(payload, dict):
                total = int(payload.get("hydra:totalItems") or 0)

            LIMIT = 5000
            truncated = len(rows) >= LIMIT or (total and len(rows) < total)

            markers = [m.strip() for m in "{{ vars.demo_sources }}".split(",") if m.strip()]
            doomed, sources, kept = [], set(), 0
            for row in rows:
                if not isinstance(row, dict):
                    continue
                source = str(row.get("identifierSource") or "")
                if any(m.lower() in source.lower() for m in markers):
                    iri = row.get("@id") or ""
                    if iri:
                        doomed.append(iri)
                        sources.add(source[:60])
                else:
                    kept += 1

            return {
                "iris": [] if truncated else doomed,
                "count": 0 if truncated else len(doomed),
                "would_have": len(doomed),
                "kept": kept,
                "scanned": len(rows),
                "total": total,
                "truncated": "yes" if truncated else "no",
                "sources": "; ".join(sorted(sources)) or "none",
                "any": "no" if truncated else ("yes" if doomed else "no"),
            }
        next: Delete Gate

      - name: Delete Gate
        type: decision
        conditions:
          - condition: "{{ vars.steps.Select_For_Deletion.data.code_output.any == 'yes' }}"
            next: Hard Delete CVEs
        default: Rewind TAXII Cursor

      - name: Hard Delete CVEs
        type: connector
        connector: cyops_utilities
        operation: make_cyops_request
        config: ""
        comment: >
          `$hardDelete=true` is the whole point of this step -- see note 1 in the
          header. `$showDeleted=true` accompanies it so a row already sitting in
          the recycle bin from an earlier soft delete is reachable and can
          finally be removed, rather than being invisible and continuing to
          block recreation of its own uuid.

          `ignore_errors` because a row deleted by a concurrent cleanup should
          not fail the reset. The receipt reports what was attempted.
        params:
          method: DELETE
          iri: "{{ vars.item }}?$hardDelete=true&$showDeleted=true"
          body: ""
        for_each:
          item: "{{ vars.steps.Select_For_Deletion.data.code_output.iris }}"
        ignore_errors: true
        next: Rewind TAXII Cursor

      - name: Rewind TAXII Cursor
        type: connector
        connector: cyops_utilities
        operation: make_cyops_request
        config: ""
        comment: >
          The cursor is the platform's own ingestion high-water mark, a global
          variable ("macro") at /api/wf/api/dynamic-variable/. If it holds a
          recent timestamp the next TAXII pull legitimately finds NOTHING --
          which is correct behaviour and a dead opening beat, and the single
          most common way this demo fails in front of a room.

          Rewound to 2000 rather than deleted: an absent macro sends the
          playbook down its 30-day fallback, which works today and stops working
          whenever the lab fixtures fall outside that window. A date nothing can
          be older than has no such expiry.

          `ignore_errors` because a first-ever run has no macro to rewind, and
          that is not a failure.
        params:
          method: GET
          iri: "/api/wf/api/dynamic-variable/?format=json&name={{ vars.taxii_macro }}"
          body: ""
        ignore_errors: true
        next: Resolve Cursor Row

      - name: Resolve Cursor Row
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        params:
          code: |
            found = {{ vars.steps.Rewind_TAXII_Cursor.data | default({}) }} or {}
            rows = found.get("hydra:member") or found.get("member") or [] \
                if isinstance(found, dict) else []
            iri = (rows[0].get("@id") or "") if rows else ""
            return {"iri": iri, "exists": "yes" if iri else "no"}
        next: Cursor Gate

      - name: Cursor Gate
        type: decision
        conditions:
          - condition: "{{ vars.steps.Resolve_Cursor_Row.data.code_output.exists == 'yes' }}"
            next: Write Ancient Cursor
        default: Intake Receipt

      - name: Write Ancient Cursor
        type: connector
        connector: cyops_utilities
        operation: make_cyops_request
        config: ""
        params:
          method: PUT
          iri: "{{ vars.steps.Resolve_Cursor_Row.data.code_output.iri }}"
          body: '{"value": "2000-01-01T00:00:00.000Z"}'
        ignore_errors: true
        next: Intake Receipt

      - name: Intake Receipt
        type: create_record
        module: comments
        comment: >
          A receipt on the launching alert, because a reset that reports nothing
          is indistinguishable from a reset that did nothing -- and the
          difference matters most exactly when you are about to present.
        fields:
          content: >
            <p><b>Intake demo reset.</b></p>
            {% if vars.steps.Select_For_Deletion.data.code_output.truncated == 'yes' %}
            <p><b>REFUSED -- the module read was truncated.</b> Scanned
            {{ vars.steps.Select_For_Deletion.data.code_output.scanned }} of
            {{ vars.steps.Select_For_Deletion.data.code_output.total }} rows, so
            {{ vars.steps.Select_For_Deletion.data.code_output.would_have }}
            match(es) were found but NOTHING was deleted -- a partial scan cannot
            tell a clean module from a stale one. Raise `$limit` in Find Demo
            CVEs and re-run.</p>
            {% else %}
            <p>CVE records hard-deleted:
            <b>{{ vars.steps.Select_For_Deletion.data.code_output.count }}</b>
            (scanned {{ vars.steps.Select_For_Deletion.data.code_output.scanned }}
            rows, left untouched:
            {{ vars.steps.Select_For_Deletion.data.code_output.kept }}).</p>
            <p>Sources matched:
            {{ vars.steps.Select_For_Deletion.data.code_output.sources }}.</p>
            {% endif %}
            <p>TAXII cursor:
            {% if vars.steps.Resolve_Cursor_Row.data.code_output.exists == 'yes'
            %}rewound to 2000-01-01, so the next pull reads the collection whole
            {% else %}not present -- the next pull is a first run and falls back
            30 days{% endif %}.</p>
            <p>Doors 1-3 are ready. The patch demo is reset separately -- run
            <b>Reset Patch Demo</b>, and not while anyone is watching.</p>
          alerts: ["{{ vars.input.records[0]['@id'] }}"]
        next: Done Intake

      - name: Done Intake
        type: end

  # ======================================================== patch (slow) =====
  - name: Reset Patch Demo
    description: >
      Mark the Inoreader advisory unread and roll the endpoint back to its
      vulnerable version, so the patch act has something to find and something
      to fix. Takes minutes -- the rollback is a real installer run.
    is_active: true
    steps:
      - name: Start
        type: start
        module: alerts
        button_label: Reset Patch Demo
        next: Patch Reset Config

      - name: Patch Reset Config
        type: set_variable
        comment: >
          NAMES, NOT IDS -- and that is the whole point of this step.

          It used to carry `reset_script_id: "4"` and `fleet_host_id: "1"`.
          Both are Fleet-instance-local integers, reassigned every time the lab
          is rebuilt, and both were WRONG within an hour of a rebuild. The
          script id was the harmless half: Fleet had no scripts at all after the
          rebuild, and `scripts/run/batch` answers a missing script with a 404.

          The host id was the dangerous half. `1` still resolved -- to a
          DIFFERENT machine. The reset would have rolled back a host nobody was
          looking at, reported success, and left the demo host still patched:
          no error anywhere, and the next run of the patch demo finding nothing
          to patch. A wrong id that still resolves is worse than one that does
          not.

          So this step names the script and the hosts, and the ids are resolved
          against live Fleet below. A name survives a rebuild; an id does not.
        vars:
          inoreader_config: "inoreader-lab"
          fleet_config: "patch-fleet"
          advisory_stream: "user/-/label/Patch Intel"
          mapped_feed_marker: "Release notes from"
          # WHAT TO ROLL BACK IS A PRODUCT, not a script id and not a host list.
          # Everything else is derived from it below: the script by name, and
          # the hosts by asking Fleet which machines actually run the product.
          #
          # It must name the SAME product the demo patches, or the reset is a
          # silent no-op -- the feed advisory here is a Notepad++ release note,
          # so resetting 7-Zip would dispatch a real installer run, report
          # success, and leave Notepad++ still patched with nothing to find on
          # the next pass.
          reset_product: "Notepad++"
          # product -> the Fleet script that puts it BACK on its vulnerable
          # version. NAMES on both sides: script ids are assigned per Fleet
          # instance and are reassigned on every rebuild, so an id here rots
          # into a wrong-but-resolving target. Adding a product is one entry
          # plus a .ps1 in Fleet -- no id hunting.
          reset_script_map: "Notepad++=reset-notepadpp-vulnerable.ps1,7-Zip=reset-7zip-vulnerable.ps1"
        next: Read Advisory Stream

      - name: Read Advisory Stream
        type: connector
        connector: inoreader
        operation: get_stream_contents
        config: "{{ vars.inoreader_config }}"
        comment: >
          Read the folder WITHOUT `unread_only`, which is the opposite of what
          the demo playbook does and is the entire point: this step is looking
          for the advisories that have already been consumed, so it can put them
          back.
        params:
          stream_id: "{{ vars.advisory_stream }}"
          max_records: 100
        next: Select Read Advisories

      - name: Select Read Advisories

        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Only items from a MAPPED feed are worth restoring. The folder is
          mostly CISA bulletins that the demo playbook skips by design, and
          marking those unread would spend a write on the scarcer rate-limit
          zone to no effect.
        params:
          code: |
            response = {{ vars.steps.Read_Advisory_Stream.data | default({}) }} or {}
            marker = "{{ vars.mapped_feed_marker }}"

            ids, titles = [], []
            for item in response.get("items") or []:
                feed = str(((item.get("origin") or {}).get("title") or ""))
                if marker.lower() not in feed.lower():
                    continue
                read = any("state/com.google/read" in c
                           for c in item.get("categories") or [])
                if read and item.get("id"):
                    ids.append(item["id"])
                    titles.append("{0}: {1}".format(feed, item.get("title") or ""))

            return {
                "item_ids": ids,
                "count": len(ids),
                "titles": "; ".join(titles) or "none",
                "any": "yes" if ids else "no",
            }
        next: Unread Gate

      - name: Unread Gate
        type: decision
        conditions:
          - condition: "{{ vars.steps.Select_Read_Advisories.data.code_output.any == 'yes' }}"
            next: Mark Advisory Unread
        default: List Fleet Scripts

      - name: Mark Advisory Unread
        type: connector
        connector: inoreader
        operation: edit_tag
        config: "{{ vars.inoreader_config }}"
        comment: >
          Removing the Read state is what makes the advisory "arrive" again. The
          demo playbook fetches with `unread_only`, so read/unread IS the
          arrival signal -- and an advisory that has been demoed once is read
          afterwards. Its absence fails the worst way available: the run goes
          GREEN and reports "the feed returned no unread entries", which reads
          as a broken integration.

          This is a replay of a real event, not a fabricated one. The advisory
          is the vendor's own release note and nothing about it is edited.
        params:
          item_ids: "{{ vars.steps.Select_Read_Advisories.data.code_output.item_ids }}"
          remove_tag: "Read"
        next: List Fleet Scripts

      - name: List Fleet Scripts
        type: connector
        connector: generic-http
        operation: http_get
        config: "{{ vars.fleet_config }}"
        comment: >
          Live, because script ids are assigned by Fleet and change on every
          rebuild. Asking is cheap; guessing is what broke this playbook.
        params:
          rest_api: "/api/v1/fleet/scripts"
          parameter:
            per_page: 100
        next: List Fleet Hosts

      - name: List Fleet Hosts
        type: connector
        connector: generic-http
        operation: http_get
        config: "{{ vars.fleet_config }}"
        params:
          rest_api: "/api/v1/fleet/hosts"
          parameter:
            per_page: 100
            # Needed: the resolver decides which hosts to roll back by looking
            # for the product in each host's installed software.
            populate_software: "true"
        next: Resolve Fleet Targets

      - name: Resolve Fleet Targets
        type: connector
        connector: code-runner
        operation: run_python
        config: Default
        comment: >
          Name -> id, for both the script and the hosts, with an explicit
          refusal when either cannot be resolved. The refusal matters more than
          the resolution: the failure this replaces was silent.
        params:
          code: |
            import json

            scripts = json.loads(r'''{{ vars.steps.List_Fleet_Scripts.data | tojson }}''') or {}
            hosts   = json.loads(r'''{{ vars.steps.List_Fleet_Hosts.data | tojson }}''') or {}
            product = "{{ vars.reset_product }}".strip()

            # product -> script NAME, from the map. One entry per product
            # because Fleet's free tier runs a stored script with NO arguments:
            # a script cannot be told which product to act on, so one script per
            # product is the API's shape rather than a design choice. What IS
            # dynamic is this mapping and the id lookup below.
            want_script = ""
            for pair in "{{ vars.reset_script_map }}".split(","):
                if "=" in pair:
                    left, right = pair.split("=", 1)
                    if left.strip().lower() == product.lower():
                        want_script = right.strip()
                        break

            srows = ((scripts.get("body") or {}).get("scripts")) or []
            hrows = ((hosts.get("body") or {}).get("hosts")) or []

            script_id = 0
            for s in srows:
                if want_script and str(s.get("name") or "").strip().lower() == want_script.lower():
                    script_id = int(s.get("id") or 0)
                    break

            # HOSTS ARE DERIVED, NOT TYPED. Ask Fleet which machines actually
            # run the product rather than carrying a hostname list that goes
            # stale the moment the estate changes -- a typed list silently
            # under-resets when a product spreads to a new box, and dispatches
            # a pointless installer run when it leaves one.
            found, names = [], []
            for h in hrows:
                installed = h.get("software") or []
                if any(product.lower() in str(s.get("name") or "").lower()
                       for s in installed):
                    found.append(h.get("id"))
                    names.append(str(h.get("hostname") or "").split(".")[0])

            ok = "yes" if (script_id and found) else "no"
            why = []
            if not want_script:
                why.append("no script mapped for product {!r}".format(product))
            elif not script_id:
                why.append("no Fleet script named {!r} ({} script(s) on this "
                           "Fleet)".format(want_script, len(srows)))
            if not found:
                why.append("no enrolled host reports {!r} installed -- nothing "
                           "to roll back (has the inventory been collected?)"
                           .format(product))

            return {
                "ok": ok,
                "product": product,
                "script_id": script_id,
                "script_name": want_script,
                "host_ids": found,
                "host_ids_csv": ", ".join(str(i) for i in found),
                "hostnames": ", ".join(names) or "none",
                "resolved": "{} -> script {} (id {}) on host(s) {}".format(
                    product, want_script or "?", script_id,
                    ", ".join(names) or "none"),
                "why": "; ".join(why) or "resolved",
            }
        next: Rollback Gate

      - name: Rollback Gate
        type: decision
        comment: >
          Refuses rather than dispatching a malformed batch. A rollback that
          cannot name its target must not run: the previous version of this
          playbook would happily POST an id it had never checked.
        conditions:
          - condition: "{{ vars.steps.Resolve_Fleet_Targets.data.code_output.ok == 'yes' }}"
            next: Roll Back Endpoint
        default: Rollback Unresolved Comment

      - name: Rollback Unresolved Comment
        type: create_record
        module: comments
        fields:
          content: >
            <p><b>Patch demo reset -- endpoint rollback SKIPPED.</b></p>
            <p>{{ vars.steps.Resolve_Fleet_Targets.data.code_output.why }}.</p>
            <p>Wanted: {{ vars.steps.Resolve_Fleet_Targets.data.code_output.resolved }}.</p>
            <p>The advisory was still marked unread, so the intel half of the
            demo is reset. The endpoint is NOT rolled back and will show the
            patched version. Upload the reset scripts to Fleet
            (uc12_patch_pipeline's harness does this) and re-run.</p>
        next: Done Patch

      - name: Roll Back Endpoint
        type: connector
        connector: generic-http
        operation: http_post
        config: "{{ vars.fleet_config }}"
        comment: >
          Puts the product back on the version the advisory supersedes, so there
          is real exposure to find. This is a REAL installer run on a REAL
          endpoint and it takes minutes; the call returns as soon as Fleet
          accepts the batch, which is not the same as the endpoint being done.

          Nothing downstream waits for it, deliberately. A reset that blocks for
          three minutes is a reset nobody runs, and the state it produces is
          observable directly -- open the host in Fleet, or re-run the demo
          playbook and watch the presence gate.
        params:
          rest_api: "/api/v1/fleet/scripts/run/batch"
          body_type: json
          data: >-
            {"script_id": {{ vars.steps.Resolve_Fleet_Targets.data.code_output.script_id }},
             "host_ids": [{{ vars.steps.Resolve_Fleet_Targets.data.code_output.host_ids_csv }}]}
        next: Patch Receipt

      - name: Patch Receipt
        type: create_record
        module: comments
        fields:
          content: >
            <p><b>Patch demo reset.</b></p>
            <p>Advisories marked unread:
            <b>{{ vars.steps.Select_Read_Advisories.data.code_output.count }}</b>
            ({{ vars.steps.Select_Read_Advisories.data.code_output.titles }}).</p>
            <p>Endpoint rollback dispatched to Fleet
            (status {{ vars.steps.Roll_Back_Endpoint.data.status_code | default('not sent', true) }}).
            <b>This is a real installer run and takes minutes.</b> Confirm the
            version has actually moved back before presenting -- the dispatch
            returning 200 only means Fleet accepted the batch.</p>
          alerts: ["{{ vars.input.records[0]['@id'] }}"]
        next: Done Patch

      - name: Done Patch
        type: end
