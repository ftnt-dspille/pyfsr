      input_data: "{%- set ina = {} -%}\n{%- set invalid = [None,\"null\",''] -%}\n\
        {%- set stepin = vars.steps.render_jinja_input.output.input -%}\n{%- set ret\
        \ = {\"input_args\":ina,\"input_valid\":true} -%}\n\n{%- if stepin  -%}\n\
        \  {%- for k in stepin -%}\n    {%- set v = stepin[k] -%}\n    {%- if v ==\
        \ None -%}\n      {%- set v = \"<INPUT NEEDED>\" -%}\n    {%- endif -%}\n\
        \    {%- do ina.update({k:v}) -%}\n  {%- endfor -%}\n{%- endif -%}\n\n{%-\
        \ for i in ina -%}\n{%- set v = ina[i]|string|trim -%}\n  {% if v in invalid\
        \ -%}\n    {%- do ret.update({\"input_valid\":false}) -%}\n  {%- elif v.startswith(\"\
        <\") or v.endswith(\">\") -%}\n    {%- do ret.update({\"input_valid\":false})\
        \ -%}\n  {%- elif v.startswith(\"[\") or v.endswith(\"]\") -%}\n    {%- do\
        \ ret.update({\"input_valid\":false}) -%}\n  {%-endif -%}\n{% endfor %}\n\n\
        {{ret}}"
      config_data: "{%- set config_input = {} -%}\n{%- if vars.steps.render_jinja_input.output.config\
        \ -%}\n  {%- set config_input = vars.steps.render_jinja_input.output.config\
        \ -%}\n{%- endif -%}\n\n{%- set config = vars.config_default | combine (config_input\
