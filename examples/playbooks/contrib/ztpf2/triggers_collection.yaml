  annotations:
  - id: details
    uuid: 00000000-0000-0000-0000-000000000019
    title: Details
    body: 'Wait for Condition trigger: polls the action''s Proxy API endpoint at
      a configurable interval (default 30s, max 10 attempts) until the outputStatusTemplate
