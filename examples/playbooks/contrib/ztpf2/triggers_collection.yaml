- name: '> device step (Running) - ZTPF Wait for Condition'
  uuid: 00000000-0000-0000-0000-000000000002
  description: Triggered when a Wait for Condition step starts running. Polls the
    action's Proxy API endpoint at a configurable interval until the outputStatusTemplate
    no longer reports an exception, or a timeout is reached.
  # SUPERSEDED -- MUST STAY is_active: false.
  # Replaced by '> device step (Running) - ZTPF Wait for Condition (poller)'
  # (a1f0c3d2-7b45-4e18-9c62-5d8e0a2f4001). Both filter the SAME trigger key
  # 'ZTPF Wait for Condition', so activating this one gives step 14 of BOTH real
  # profiles (HA Post: Wait for HA Rejoin) two runners -- and FortiSOAR refuses to
  # dispatch this one at all (CS-WF-13: it is cyclic, not a DAG). It also neither
  # waited (poll_interval parsed and never read) nor bounded itself (wait-and-retry
  # routed past the attempt check). Guard: check_trigger_keys.py.
  is_active: false
  trigger_step_id: start
  steps:
  - type: start_on_update
    name: Start
    step_variables:
      input:
        params: []
        records:
        - '{{vars.input.records[0]}}'
    resource: ztpf_device_automation_steps
    resources:
    - ztpf_device_automation_steps
    __triggerLimit: true
    triggerOnSource: true
    fieldbasedtrigger:
      sort: []
      limit: 30
      logic: AND
      filters:
      - type: object
        field: status
        value: ''
        _value:
          '@id': ''
          display: ''
          itemValue: ''
        operator: changed
      - type: object
        field: status
        value: /api/3/picklists/b2b405dc-97e6-40cd-98bb-9132e37d5b6d
        _value:
          '@id': /api/3/picklists/b2b405dc-97e6-40cd-98bb-9132e37d5b6d
          display: Running
          itemValue: Running
        operator: eq
      - type: primitive
        field: triggerKey
        value: ZTPF Wait for Condition
        operator: eq
        _operator: eq
    next: step_trigger_pre_run
    uuid: 00000000-0000-0000-0000-000000000010
    top: '40'
    left: '40'
  - type: workflow_reference
    name: step trigger pre_run
    apply_async: false
    step_variables: []
    stepargs_yaml: '{{vars.input.records[0].stepARGS}}'
    trigger_step_input_record: '{{vars.input.records[0]}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/1c59904d-0333-48f4-a608-d73a85117e81
    next: run_automation
    uuid: 00000000-0000-0000-0000-000000000011
    top: '120'
    left: '40'
  - type: set_variable
    name: run automation
    vars:
      device_step_id: '{{vars.input.records[0].id}}'
      max_attempts: '{%- set args = vars.input.records[0].stepARGS | default(''input:\n  max_attempts: 10\n  poll_interval: 30\n'')
        -%}{%- set parsed = args | from_yaml -%}{{ parsed.get(''input'', {}).get(''max_attempts'',
        10) | default(10) }}'
      poll_interval: '{%- set args = vars.input.records[0].stepARGS | default(''input:\n  max_attempts: 10\n  poll_interval: 30\n'')
        -%}{%- set parsed = args | from_yaml -%}{{ parsed.get(''input'', {}).get(''poll_interval'',
        30) | default(30) }}'
    next: check_attempts
