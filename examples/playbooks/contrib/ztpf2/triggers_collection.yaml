    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/41623f62-3a00-5681-8638-8bade02a76e4
    next: check_condition
    uuid: 00000000-0000-0000-0000-000000000014
    top: '360'
    left: '160'
  - type: decision
    name: check condition
    step_variables: []
    conditions:
    - display: met
      when: '{{ vars.steps.run_proxy_api.output.output_status.status != "Exceptions
        Found" }}'
      next: step_post_run
    - display: not yet
      default: true
      next: wait_and_retry
    uuid: 00000000-0000-0000-0000-000000000015
    top: '440'
    left: '160'
  - type: set_variable
    name: wait and retry
    vars:
      max_attempts: '{{ vars.steps.run_automation.max_attempts | int - 1 }}'
    next: run_proxy_api
