      jinja_vars: "{%- set ret = {} -%}\n{%- if vars.jinja_vars -%}\n  {%- set ret\
        \ = vars.jinja_vars -%}\n{%- endif -%}\n{%- do ret.update({\"input\":vars.input_data.input_args})\
