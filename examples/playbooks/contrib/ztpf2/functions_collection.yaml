- name: '> render jinja template'
  uuid: b9e9fe1a-4964-4631-ba81-97987676884d
  description: Leverage the FortiSOAR API /api/wf/api/jinja-editor/ to render jinja.
  is_active: true
  trigger_step_id: start
  parameters:
  - script_vars
  - script_template
  - yaml2json_flag
  steps:
  - type: decision
    name: Check if Error present
    step_variables: []
    conditions:
    - display: Error
      when: '{{ "data" not in vars.steps.Convert_Jinja_to_String }}'
      next: return_error
    - display: Success
      default: true
      next: extract_results
    uuid: b3e774e4-4be6-4384-abca-213694d77383
    top: '280'
    left: '540'
  - type: connector
    name: Convert Jinja to String
    ignore_errors: true
    pickFromTenant: false
    params:
      iri: /api/wf/api/jinja-editor/?format=json
      body: '{{vars.post_data}}'
      method: POST
    connector: cyops_utilities
    operation: make_cyops_request
    next: check_if_error_present
    uuid: e6347f1a-29fb-4060-9edf-40b5a3d6c5a6
    top: '180'
    left: '540'
  - type: set_variable
    name: create_post_data
    vars:
      post_data: "{%- set t = vars.input.params['script_template'] -%}\n{#\n  The\
        \ jinja-editor API compiles `template` as TEXT. A metadata source whose script\n\
        \  is written as JSON arrives here already parsed into a dict/list, and the\n\
        \  API answers 400 \"Can't compile non template nodes\" -- which surfaces far\n\
        \  downstream as a blank api_url and an opaque FortiManager 400. Serialise\n\
        \  anything that is not already a string; yaml2json_flag parses it back.\n#}\n\
        {{ {\"template\": t if t is string else t | to_json, \"values\": vars.input.params['script_vars']\
        \ or {}} }}"
    next: convert_jinja_to_string
    uuid: 607a1b50-5be9-46f9-b515-eceb68c82527
    top: '80'
    left: '540'
  - type: workflow_reference
    name: create yaml2json
    when: '{{vars.extract_results_type == "TEXT" and vars.input.params[''yaml2json_flag'']
      == True}}'
    apply_async: false
    step_variables:
      extract_results: '{{vars.steps.create_yaml2json.output}}'
    yaml: '{{vars.extract_results}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/e8a9ca65-8ba2-4da5-993a-e98d1e22283c
    next: return
    uuid: 9f2c7ed0-8141-4ee2-b596-a77f3cf4d4de
    top: '500'
    left: '540'
  - type: set_variable
    name: extract_results
    vars:
      extract_results: |-
        {%- set output = vars.steps.Convert_Jinja_to_String.data.result -%}
        {%- if output is not defined or output is none -%}
          {{ "Error: No output found" }}
        {%- elif (output | type_debug == "dict") or (output | type_debug == "list") -%}
          {{ output }}
        {%- elif output | type_debug == "str" -%}
          {%- set trimmed = output.strip() -%}
          {%- if trimmed.startswith('"') and trimmed.endswith('"') -%}
            {%- set inner = trimmed | toDict -%}
            {%- if inner is string and (inner.strip().startswith('{') or inner.strip().startswith('[')) -%}
              {{ inner | toDict }}
            {%- else -%}
              {{ inner }}
            {%- endif -%}
          {%- else -%}
            {{ output }}
          {%- endif -%}
        {%- else -%}
          {{ "Error: Unexpected data type: " + (output | type_debug) }}
        {%- endif -%}
      extract_results_msg: ok
      extract_results_error: 'False'
    next: result_flag
    uuid: 7a018d89-216f-4bab-82df-6abf200ab803
    top: '380'
    left: '180'
  - type: decision
    name: result flag
    step_variables: []
    conditions:
    - display: Branch 1
      default: true
      next: return
    - display: convert results
      when: '{{ vars.input.params[''yaml2json_flag''] == True }}'
      next: results_type
    uuid: 9bcfdd0e-3c39-41dd-995b-55092a55ce80
    top: '480'
    left: '180'
  - type: set_variable
    name: results_type
    vars:
      extract_results_type: "{%- set v = vars.extract_results -%}\n{%- set ret = \"\
        TEXT\" -%}\n{%- if v is mapping -%}\n    {%- set ret = \"dict\" -%}\n{%- elif\
        \ v is sequence and v is not string -%}\n    {%- set ret = \"list\" -%}\n\
        {%- endif -%}\n{{ret}}"
    next: create_yaml2json
    uuid: 609fd6d6-a62c-4cfb-a1d7-c47105dfe108
    top: '400'
    left: '540'
  - type: set_variable
    name: return
    vars:
      output: '{{vars.extract_results}}'
      params: '{{vars.input.params}}'
      status: "{\n  \"error\":{{vars.extract_results_error}},\n  \"msg\":\"{{vars.extract_results_msg}}\"\
        \n}"
    uuid: c6aff749-6b4e-44de-a76a-deee227862f7
    top: '600'
    left: '540'
  - type: set_variable
    name: return_error
    vars:
      extract_results_msg: "ERROR: Tried to render Jinja Template:\n\n```\n{{vars.input.params['script_template']}}\n\
        ```\n\nwith variables:\n```\n{{vars.input.params['script_vars']| to_nice_json}}\n\
        ```\n\nbut got Error: \n{% set matches = vars.steps.Convert_Jinja_to_String[\"\
        Error message\"] | regex_findall(\"'message': \\\"(.*?)\\\"\") -%}\n{{ matches[0]\
        \ if matches else 'Unable to parse clean error message. {}'.format(vars.steps.Convert_Jinja_to_String[\"\
        Error message\"]) }}"
      extract_results_error: 'True'
      extract_results_output: '{}'
    next: return
    uuid: eea3d0a1-10cd-4594-bb26-2e9cbab4dba1
    top: '380'
    left: '920'
  - type: start
    name: Start
    step_variables:
      input:
        params: []
    next: create_post_data
    uuid: 5091a4b4-20d6-459b-b709-11b312fddc87
    top: '40'
    left: '40'
  annotations:
  - id: details
    uuid: dbcd0b78-1b3b-4112-899d-50312c6a8349
    title: Details
    body: 'Taking an input of a jinja template with jinja_vars use the FortiSOAR API
      ( /api/wf/api/jinja-editor/ ) to render the results.


      If yaml2json is set and the results is not JSON then run yaml2json and return
      the results.'
    position:
      top: 140
      left: 40
      height: 214
      width: 400
  tags:
  - fsr_api
  - function
