    top: '420'
    left: '880'
  - type: update_record
    name: cancel remaining steps
    description: 'Abort mode: set every not-yet-run step in the run group to Cancelled
      (terminal, not resumable; does not fire the Fail dispatcher).'
    operation: Append
    fieldOperation:
      recordTags: Append
    module: ztpf_device_automation_steps
    record: '{{vars.item[''@id'']}}'
    fields:
      status: '{{"ztpfDeviceStepStatus" | picklist("Cancelled", "@id")}}'
      queueStatus: '{{"ztpfDeviceStepStatus" | picklist("Cancelled", "@id")}}'
      # A cancelled step is a FINISHED step: it will never run, so anything that
      # counts progress by stepDone must see it as done. Without this the run
      # group can never reach a terminal tally and the device looks half-run.
      stepDone: true
    for_each:
      item: '{{vars.steps.find_remaining_steps}}'
      __bulk: true
      condition: '{{vars.item.status.itemValue in ["New", "Preparing", "Input Needed",
        "Ready", "Queued"]}}'
      batch_size: 100
    next: fail_run_group
