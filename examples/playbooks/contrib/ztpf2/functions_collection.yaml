        \ = dev.name -%}\n    {%- set recdata = find_device_records \n      | json_query('[?ztpfManagers.connectorConfig==`{}`]'\n\
        \          .format(concfg))\n      | json_query('[?name==`{}`]'\n        \
        \  .format(devname))\n    -%}\n   {%- do sd.update({\"record\":recdata[0],\"\
        apidata\":{\"dvmdb\":dev}}) -%}\n   {%- do table.append(sd) -%}    \n  {%\
