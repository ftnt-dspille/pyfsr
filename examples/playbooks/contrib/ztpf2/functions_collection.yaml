        \ -%}\n      {%- do out.append(\"  \" + key + \": \" + value|string) -%}\n\
        \  {%- endfor %}\n{{out|sort|join(\"\\n\")}}\n  {%- endif -%}\n{%- endmacro\
        \ -%}\n\n{%- if args -%}\n{{ render_section(\"input\", args.get(\"input\"\
        )) }}\n{{ render_section(\"config\", args.get(\"config\")) }}\n{%- endif -%}"
