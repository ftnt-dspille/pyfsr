    uuid: c609d776-6878-4966-b70d-06fe7ed3d9d7
    top: '280'
    left: '40'
  - type: set_variable
    name: setup vars
    vars:
      record_ids: "{%- set in_field = vars.input.params['record_ids'] -%}\n{%- set\
        \ ret = \"\" -%}\n\n{%- if in_field not in ['',None] -%}\n  {%- if in_field\
