- name: '> move step number on a device'
  uuid: 5d68c5d6-adb5-4add-90c5-ca3f94dde0de
  description: Use the device_step_id to find the device and all pending steps to
    then re-order the list as needed.
  is_active: true
  trigger_step_id: start
  parameters:
  - device_step_id
  - new_step_number
  steps:
  - type: find_record
    name: find pending steps
    when: '{{vars.steps.find_step_to_move[0].ztpfDevices}}'
    step_variables: []
    module: ztpf_device_automation_steps?$limit=5000
    checkboxFields: true
    filters:
    - field: ztpfDevices
      value: '{{vars.steps.find_step_to_move[0].ztpfDevices[''@id'']}}'
      operator: eq
      type: object
      _value:
        '@id': '{{vars.steps.find_step_to_move[0].ztpfDevices[''@id'']}}'
        display: ''
        itemValue: ''
    - field: ztpfRunGroups
      value: 'true'
      operator: isnull
      type: object
      _value:
        '@id': 'true'
        display: ''
        itemValue: ''
    - field: stepDone
      value: true
      operator: neq
    sort:
    - field: stepNumber
      direction: ASC
      _fieldName: stepNumber
      _fieldTitle: Step Number
    next: invert_step_numbers
    uuid: cf23fedf-02e8-4811-968e-5925e5ce291a
    top: '40'
    left: '640'
  - type: find_record
    name: find step to move
    step_variables: []
    module: ztpf_device_automation_steps?$limit=1
    checkboxFields: true
    filters:
    - field: id
      value: '{{vars.input.params[''device_step_id'']}}'
      operator: eq
    next: find_pending_steps
    uuid: 1e852d1d-baf0-45ed-9bec-ea60b4873954
    top: '40'
    left: '340'
  - type: update_record
    name: invert step numbers
    when: '{{vars.steps.find_pending_steps}}'
    description: Invert step numbers to prevent unique constraints on the module.
    operation: Append
    fieldOperation:
      recordTags: Append
    module: ztpf_device_automation_steps
    record: '{{vars.item[''@id'']}}'
    fields:
      stepNumber: -{{vars.item.stepNumber}}
    for_each:
      item: '{{vars.steps.find_pending_steps}}'
      __bulk: true
      condition: ''
      batch_size: 100
    next: reordered_steps
    uuid: 2ba94945-b72d-46d0-a984-d27658560f83
    top: '120'
    left: '640'
  - type: set_variable
    name: reordered_steps
    vars:
      reordered_steps: "{%- macro reorder_steps(steps, move_id, new_step) -%}\n  {%-\
        \ set ordered = steps | sort(attribute='stepNumber') | list -%}\n  {%- set\
        \ ns = namespace(item=None) -%}\n  {%- for s in ordered -%}\n      {%- if\
        \ s.id == move_id -%}\n          {%- set ns.item = s -%}\n          {%- do\
        \ ordered.remove(s) -%}\n          {%- break -%}\n      {%- endif -%}\n  {%-\
        \ endfor -%}\n  {%- if ns.item -%}\n      {%- if new_step < 1 -%}\n      \
        \    {%- set new_step = 1 -%}\n      {%- elif new_step > ordered | length\
        \ + 1 -%}\n          {%- set new_step = ordered | length + 1 -%}\n      {%-\
        \ endif -%}\n      {%- do ordered.insert(new_step - 1, ns.item) %}\n     \
        \ {%- for s in ordered -%}\n          {%- do s.update({'stepNumber': loop.index})\
        \ -%}\n      {%- endfor -%}\n  {%- endif -%}\n  {{ ordered }}\n{%- endmacro\
        \ -%}\n\n{%- set stepid = vars.steps.find_step_to_move[0].id -%}\n{%- set\
        \ newstep = vars.input.params['new_step_number'] -%}\n{{ reorder_steps(vars.steps.find_pending_steps,\
        \ stepid, newstep) }}"
    next: update_step_numbers
    uuid: 66455646-ff8d-40df-a5ae-db267fcd0e46
    top: '200'
    left: '640'
  - type: set_variable
    name: return
    vars:
      output: '{{vars.steps.update_step_numbers}}'
      params: '{{vars.input.params}}'
      status: "{%- set status = {\"error\":true,\"msg\":\"No Steps Updated\"} -%}\n\
        {%- if vars.steps.update_step_numbers|length > 0 -%}\n  {%- do status.update(\n\
        \      {\n        \"error\":false,\n        \"msg\": \"Updated \" \n     \
        \               + vars.steps.update_step_numbers|length|string \n        \
        \            + \" Steps.\"\n      }) \n  -%}\n{%- endif -%}\n{{status}}"
    uuid: 0ad866aa-4edc-49a4-96e3-91f2805cc465
    top: '280'
    left: '40'
  - type: start
    name: Start
    step_variables:
      input:
        params: []
    next: find_step_to_move
    uuid: 9a83c706-5dcd-47b5-98be-7673be6557ee
    top: '40'
    left: '40'
  - type: update_record
    name: update step numbers
    operation: Append
    fieldOperation:
      recordTags: Append
    module: ztpf_device_automation_steps
    record: '{{vars.item[''@id'']}}'
    fields:
      stepNumber: '{{vars.item["stepNumber"]}}'
    for_each:
      item: '{{vars.reordered_steps}}'
      __bulk: true
      condition: ''
      batch_size: 100
    next: return
    uuid: c262b43c-6216-465b-b8fd-19017735887b
    top: '280'
    left: '640'
  annotations:
  - id: details
    uuid: 8ebac787-7071-44be-a617-18fc70850ef6
    title: Details
    body: "Find all pending steps on a device. Update all steps on the device to invert\
