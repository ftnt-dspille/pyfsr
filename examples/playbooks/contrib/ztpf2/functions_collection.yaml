    name: get device jinja_vars
    apply_async: false
    step_variables: []
    device_id: '{{vars.device_id}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/7b1c12a7-a422-45f4-87e4-96f01a4c03f2
    next: create_jinja_vars_device
    uuid: 3b7f943c-aa70-49c1-80a0-22c6e13f1f77
    top: '240'
    left: '800'
  - type: workflow_reference
    name: get yaml2json
    when: '{{vars.input_yaml}}'
    apply_async: false
    step_variables: []
    yaml: '{{vars.input_yaml}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/e8a9ca65-8ba2-4da5-993a-e98d1e22283c
    next: get_device_jinja_vars
    uuid: 9006af5f-34ae-4522-bef2-fb33c829462f
    top: '140'
