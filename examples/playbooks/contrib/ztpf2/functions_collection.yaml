- name: '> version match matrix'
  uuid: 99a05d7e-1a17-4375-b475-b315e14cdd1f
  description: Standard Method for checking for a version.
  is_active: true
  trigger_step_id: start
  parameters:
  - find_version_list
  - version
  steps:
  - type: code_snippet
    name: compare versions
    config: acbb094c-db08-49d5-9772-2aaca10c0311
    code: "# Install the packaging library if you don't have it:\r\n# pip install\
      \ packaging\r\n\r\nimport operator\r\nimport json\r\nfrom packaging.version\
      \ import parse\r\n\r\ndef compare_versions(version1, version_check):\r\n   \
      \ oper, version2 = version_check.split(\" \")\r\n    v1 = parse(version1)\r\n\
      \    v2 = parse(version2)\r\n\r\n    ops = {\r\n        \"<=\": operator.le,\r\
      \n        \"<\": operator.lt,\r\n        \">=\": operator.ge,\r\n        \"\
      >\": operator.gt,\r\n        \"==\": operator.eq,\r\n        \"!=\": operator.ne\r\
      \n    }\r\n\r\n    if ops[oper](v1, v2):\r\n        return True\r\n    else:\r\
      \n        return False\r\n\r\n#\r\n# Script to Compare\r\n#\r\n\r\n\r\nVERSION\
      \ = \"{{vars.version_parsed}}\"\r\n#VERSION = \"v7.6.6-build3654 260127 (GA.M)\"\
      \r\n#VERSION = \"7.6.6-build3654 260127 (GA.M)\"\r\n#VERSION = \"v7.6.6-build3654\"\
      \r\n#VERSION = \"7.6.6-build3654\"\r\n#VERSION = \"v7.6.6\"\r\n#VERSION = \"\
      7.6.6\"\r\n\r\nFIND_VERSIONS = {{vars.find_version_list}}\r\nresults = {}\r\n\
      \r\nfor v in FIND_VERSIONS:\r\n    results[v] = compare_versions(VERSION, v)\r\
      \n\r\nprint(json.dumps(results, indent=2))\r\n"
    next: return
    uuid: 3995d087-63a9-4961-8ec9-59f7dcd70fc5
    top: '340'
    left: '420'
  - type: set_variable
    name: parse version
    vars:
      version_parsed: '{%- set v = vars.version_full|split(''-'') -%}

        {{v[0]}}'
    next: compare_versions
    uuid: 0f2e95ec-153b-46da-ad94-42e71fdb7f91
    top: '140'
    left: '940'
  - type: set_variable
    name: return
    vars:
      output: "{%- set ret = {} -%}\n{%- do ret.update({\n  \"version_parsed\":vars.version_parsed,\n\
        \  \"version_check\":vars.steps.compare_versions.data['code_output']\n}) -%}\n\
        {{ret}}"
      params: '{{vars.input.params}}'
      status: "{%- set ret = {\"error\":false} -%}\n\n{%- if vars.steps.compare_versions.status\
        \ != \"Success\" -%}\n  {%- do ret.update({\n    \"error\":true,\n    \"message\"\
        :\"Status from compare_versions is \" + vars.steps.compare_versions.status\n\
        \  }) -%}\n{%- endif -%}\n\n{{ret}}"
    uuid: 609ddbcf-6e84-47fc-8559-d07a4e3ae243
    top: '120'
    left: '40'
