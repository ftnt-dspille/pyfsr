- name: '> device step running trigger post-run'
  uuid: 9e61ba1a-4371-4d35-825d-9cea8f79feff
  description: Post-run the step when completed running
  is_active: true
  trigger_step_id: start
  parameters:
  - trigger_step_input_record
  steps:
  - type: update_record
    name: complete step
    operation: Append
    fieldOperation:
      recordTags: Append
    module: ztpf_device_automation_steps
    record: '{{vars.device_step_fqid}}'
    fields:
      status: '{%- set s = vars.step_status -%}{%- if s == "Flag" -%}{%- set s =
        "Complete" -%}{%- elif s == "Abort" -%}{%- set s = "Fail" -%}{%- endif -%}{{"ztpfDeviceStepStatus"
        | picklist(s, "@id")}}'
      stepDone: false
      stepTime: '{{vars.step_time}}'
      queueStatus: '{%- set s = vars.step_status -%}{%- if s == "Flag" -%}{%- set
        s = "Complete" -%}{%- elif s == "Abort" -%}{%- set s = "Fail" -%}{%- endif
        -%}{{"ztpfDeviceStepStatus" | picklist(s, "@id")}}'
      stepTimeSeconds: '{{vars.step_time_seconds}}'
    next: step_failed
    uuid: e1f64272-c2df-4dd8-a41a-0dd4ba96dbdc
    top: '340'
    left: '460'
  - type: update_record
    name: pause run group
    description: Set run group status to Reviewing to pause the queue
    operation: Append
    fieldOperation:
      recordTags: Append
    module: ztpf_run_groups
    record: '{{vars.rungroup_fqid}}'
    fields:
      status: /api/3/picklists/606a0e6c-9c08-4081-bb17-bc8c3872fb68
    next: return
    uuid: 49fe6e70-a8e2-58cd-a467-1196ed6dea42
    top: '250'
    left: '880'
  - type: find_record
    name: find remaining steps
    description: 'Abort mode: find all steps in this run group to cancel the ones
      not yet run.'
    step_variables: []
    module: ztpf_device_automation_steps?$limit=5000
    checkboxFields: true
    filters:
    - field: ztpfRunGroups
      value: '{{vars.rungroup_fqid}}'
      operator: eq
      type: object
      _value:
        '@id': '{{vars.rungroup_fqid}}'
        display: ''
