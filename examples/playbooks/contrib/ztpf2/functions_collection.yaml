- name: '> diff json return json'
  uuid: 4d7e9b21-8c53-4a16-b0e9-1f62a7c3d804
  description: Structural (semantic) diff of two JSON blobs. Prunes ignore_keys
    anywhere in the tree, then reports added/removed/changed key paths -- cosmetic
    churn (counters, uptime) is excluded by listing those keys in ignore_keys.
  is_active: true
  trigger_step_id: start
  parameters:
  - json1
  - json2
  - ignore_keys_json
  steps:
  - type: start
    name: Start
    step_variables:
      input:
        params: []
    next: setup_vars
    uuid: 8d1c3f25-6ea4-7b51-c079-9f3d4b8eac62
    top: '40'
    left: '40'
  - type: set_variable
    name: setup vars
    vars:
      json1: '{{vars.input.params.json1}}'
      json2: '{{vars.input.params.json2}}'
      ignore_keys_json: "{%- set ik = vars.input.params.ignore_keys_json -%}{%- if\
        \ ik in ['',None] -%}[]{%- else -%}{{ik}}{%- endif -%}"
    next: jsondiff
    uuid: 7c0b2e14-5d93-6a40-bf68-8e2c3a7d9b51
    top: '40'
    left: '340'
  - type: connector
    name: jsondiff
    description: 'Unrestricted Python (code-runner) semantic diff. Data arrives via
      the input param (not interpolated into code), so no auto-parse/quote/sandbox
      pitfalls.'
    pickFromTenant: false
    config: Default
    params:
      input: '{{ {"json1": vars.json1, "json2": vars.json2, "ignore": vars.ignore_keys_json} }}'
      code: |-
        import json

        def parse(x):
            if isinstance(x, str):
                x = x.strip()
                return json.loads(x) if x else None
            return x

        def prune(o, ignore):
            if isinstance(o, dict):
                return {k: prune(v, ignore) for k, v in o.items() if k not in ignore}
            if isinstance(o, list):
                return [prune(v, ignore) for v in o]
            return o

        def walk(a, b, path, changes):
            if isinstance(a, dict) and isinstance(b, dict):
                for k in sorted(set(a) | set(b), key=lambda x: str(x)):
                    p = (path + "." + str(k)) if path else str(k)
                    if k not in a:
                        changes.append({"path": p, "change": "added", "old": None, "new": b[k]})
                    elif k not in b:
                        changes.append({"path": p, "change": "removed", "old": a[k], "new": None})
                    else:
                        walk(a[k], b[k], p, changes)
            elif isinstance(a, list) and isinstance(b, list):
                for i in range(max(len(a), len(b))):
                    p = "%s[%d]" % (path, i)
                    if i >= len(a):
                        changes.append({"path": p, "change": "added", "old": None, "new": b[i]})
                    elif i >= len(b):
                        changes.append({"path": p, "change": "removed", "old": a[i], "new": None})
                    else:
                        walk(a[i], b[i], p, changes)
            else:
                if a != b:
                    changes.append({"path": path or "/", "change": "changed", "old": a, "new": b})

        err = None
        try:
            j1 = parse(params.get("json1"))
            j2 = parse(params.get("json2"))
            ignore = params.get("ignore") or []
            if isinstance(ignore, str):
                ignore = json.loads(ignore) if ignore.strip() else []
        except Exception as e:
            j1, j2, ignore, err = None, None, [], "parse failed: " + str(e)

        changes = []
        if err is None:
            walk(prune(j1, ignore), prune(j2, ignore), "", changes)

        added = removed = changed = 0
        for ch in changes:
            if ch["change"] == "added":
                added += 1
            elif ch["change"] == "removed":
                removed += 1
            elif ch["change"] == "changed":
                changed += 1

        return {
            "changes": changes,
            "error": err,
            "summary": {
                "total_changes": len(changes),
                "total_lines": len(changes),
                "lines_added": added,
                "lines_removed": removed,
                "lines_changed": changed,
                "added": added,
                "removed": removed,
                "changed": changed,
            },
        }
    connector: code-runner
    operation: run_python
    next: return
    uuid: 5a8f0c92-3b71-4e28-9d46-6c0a1e5b7f39
    top: '40'
    left: '640'
  - type: set_variable
    name: return
    vars:
      output: '{{vars.steps.jsondiff.data[''code_output'']}}'
      status: '{%- set ret = {"error":false,"msg":"ok"} -%}{%- if vars.steps.jsondiff.status
        != "Success" -%}{%- set ret = {"error":true,"msg":"Code Not Successful: " +
        vars.steps.jsondiff.status} -%}{%- endif -%}{{ret}}'
    uuid: 6b9a1d03-4c82-5f39-ae57-7d1b2f6c8a40
    top: '160'
    left: '340'
  annotations:
  - id: details
    uuid: 3f2a1b09-5c84-4d73-ae62-9b1c0d5e8f47
    title: Details
    body: 'Semantic JSON diff. ignore_keys_json is a JSON array of leaf-key names to
      prune anywhere in the tree before comparing (e.g. ["uptime","tx_bytes"]).
      Returns {summary, changes[]} where each change has path/change/old/new.'
    position:
      top: 120
      left: 40
      height: 115
      width: 400
  - id: changelog
    uuid: c1a90020-0003-4a10-9e01-aa0000000003
    title: Changelog
    body: "NEW. Semantic JSON diff on the code-runner connector (unrestricted Python; stock code-snippet sandbox blocks set/sum/dict/list). Data via input param, not code interpolation."
    position:
      top: 400
      left: 40
      width: 460
