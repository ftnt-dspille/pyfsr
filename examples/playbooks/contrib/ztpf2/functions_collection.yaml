- name: '> create run group for pending steps on a device_ids'
  uuid: eb1813ff-496a-49b6-bcc6-bc158775db68
  description: Find pending steps and crate a queue group and start the steps in order
  is_active: true
  trigger_step_id: start
  parameters:
  - device_ids
  steps:
  - type: update_record
    name: add artfiacts to devices
    operation: Append
    fieldOperation:
      recordTags: Append
    module: ztpf_devices
    record: '{{vars.item}}'
    fields:
      __link:
        ztpfRunGroups: '{{vars.steps.create_run_group[''@id'']}}'
      ztpfRunning: false
      ztpfArtifacts: '{{vars.step_records[''artifacts'']}}'
    for_each:
      item: '{{vars.device_records_fqids}}'
      __bulk: true
      condition: ''
      batch_size: 100
    next: cancel_stale_steps
    uuid: b64086d5-832c-4f59-8da9-7705308c696f
    top: '480'
    left: '60'
  # D9 -- a device can carry Ready steps from MORE THAN ONE "Add Steps to Device
  # from Profile" click. `find steps` returns all of them, and this playbook used
  # to sweep every one into a single run group: seen live as a 50-step group that
  # executed the rollback profile twice back-to-back, and as an orphaned step
  # running FIRST and cancelling the run the operator actually wanted.
  #
  # The batch is read from `ztpfGroup`, stamped per add by
  # `> create device automation steps from profile`. Two cheaper discriminators
  # were tried live and BOTH are wrong: step numbers do not restart per add (a
  # second add continues 13..24), and record ids do not stay contiguous (two adds
  # fired together interleave). Guessing from either ran 3 of 12 steps.
  #
  # Newest batch wins, keyed off the highest-id step per device. Steps predating
  # the stamp carry an empty ztpfGroup and simply form one legacy batch, so an
  # untouched device behaves exactly as before.
  - type: set_variable
    name: split batches
    vars:
      run_steps: >-
        {%- set ns = namespace(keep=[]) -%}
        {%- for dev in vars.steps.find_steps|map(attribute='ztpfDevices.id')|unique|list -%}
        {%- set rows = vars.steps.find_steps|selectattr('ztpfDevices.id','equalto',dev)|sort(attribute='id')|list -%}
        {%- set newest = (rows|last).ztpfGroup | default('', true) -%}
        {%- for s in rows -%}
        {%- if (s.ztpfGroup | default('', true)) == newest -%}
        {%- do ns.keep.append(s) -%}
        {%- endif -%}
        {%- endfor -%}
        {%- endfor -%}
        {{ ns.keep|sort(attribute='stepNumber')|list }}
      stale_steps: >-
        {%- set ns = namespace(keep=[]) -%}
        {%- for dev in vars.steps.find_steps|map(attribute='ztpfDevices.id')|unique|list -%}
        {%- set rows = vars.steps.find_steps|selectattr('ztpfDevices.id','equalto',dev)|sort(attribute='id')|list -%}
        {%- set newest = (rows|last).ztpfGroup | default('', true) -%}
        {%- for s in rows -%}
        {%- if (s.ztpfGroup | default('', true)) != newest -%}
        {%- do ns.keep.append(s) -%}
        {%- endif -%}
        {%- endfor -%}
        {%- endfor -%}
        {{ ns.keep|list }}
    next: setup_queue
    uuid: f385c374-2a10-4a09-a606-0c17bbde41dd
    top: '220'
    left: '660'
  # D9 (second half) -- take the superseded batch OUT of Ready. Left Ready they
  # would simply be swept into the next fire, which is the same defect one click
  # later. Cancelled is terminal AND visible in the UI, so the operator can see
  # exactly what was dropped and why rather than having it silently discarded.
  - type: update_record
    name: cancel stale steps
    when: '{{ vars.stale_steps|length > 0 }}'
    operation: Append
    fieldOperation:
      recordTags: Append
    module: ztpf_device_automation_steps
    record: '{{vars.item[''@id'']}}'
    fields:
      status: /api/3/picklists/b0f9808b-bb32-4659-beb2-281fe00f9bf8
      queueStatus: /api/3/picklists/b0f9808b-bb32-4659-beb2-281fe00f9bf8
      outputStatusMessage: 'Superseded: created by an earlier "Add Steps to Device
        from Profile" that was never run, and cancelled so it could not execute
        alongside the newer batch. Re-add the profile if this step is still wanted.'
    for_each:
      item: '{{vars.stale_steps}}'
      __bulk: true
      condition: ''
      batch_size: 100
    next: run_queued_steps
    uuid: 16948dc3-3f38-4429-9858-af13e7fb9a7b
    top: '530'
    left: '60'
  - type: update_record
    name: add steps to run group
    operation: Append
    fieldOperation:
      recordTags: Append
    module: ztpf_device_automation_steps
    record: '{{vars.item[''fqid'']}}'
    fields:
      status: /api/3/picklists/91ff63f2-78cd-4bb5-92e3-36c99ec4d2c1
      triggerKey: '{{vars.item[''action_category'']}} {{vars.item[''action_type'']}}'
      queueStatus: /api/3/picklists/91ff63f2-78cd-4bb5-92e3-36c99ec4d2c1
      ztpfRunGroups: '{{vars.steps.create_run_group[''@id'']}}'
    for_each:
      item: '{{vars.step_records["steps"]}}'
      __bulk: true
      condition: ''
      batch_size: 100
    next: add_artfiacts_to_devices
    uuid: 947d12de-bb15-4194-9407-210dcecea5c0
    top: '380'
    left: '60'
  - type: create_record
    name: create run group
    operation: Overwrite
    fieldOperation:
      recordTags: Overwrite
    module: ztpf_run_groups
    fields:
      name: '{{vars.ztpfGroup}}'
      status: /api/3/picklists/1f7e18dc-5763-4bd7-955c-0dd728a2cb6e
      __replace: ''
      ztpfRunning: true
    next: find_actions
    uuid: f1b330d4-b684-4f27-9546-8b5e11656410
    top: '300'
    left: '1000'
  - type: set_variable
    name: create step_records
    vars:
      step_records: "{%- set artf = {\n  \"artifacts\" : {\n    \"ztfGroup\":vars.ztpfGroup,\n\
        \    \"ztfGroup_id\":vars.steps.create_run_group['id'],\n    \"ztfGroup_fqid\"\
        :vars.steps.create_run_group['@id']\n  },\n  \"steps\":[]\n} -%}\n\n{%- set\
        \ steps = vars.run_steps -%}\n{%- for s in steps -%}\n  {%- set rec\
        \ = {} -%}\n  {%- set act_id = s.ztpfAutomationActions.id -%}\n  {%- set act\
        \ = vars.steps.find_actions\n      |json_query('[?id==`{}`]'.format(act_id))\
        \ \n  -%}\n  {%- set dev = vars.steps.find_device\n      |json_query('[?id==`{}`]'.format(s.ztpfDevices.id))\
        \ \n  -%}\n  {%- do rec.update({\n    \"fqid\": s['@id'],\n    \"id\": s.id,\n\
        \    \"name\":s.name,\n    \"stepNumber\": s.stepNumber,\n    \"action_category\"\
        : act[0].category.itemValue,\n    \"action_type\": act[0].type.itemValue,\n\
        \    \"device_fqid\":dev[0]['@id'],\n    \"device_id\":dev[0].id,\n    \"\
        device_name\":dev[0].name\n  }) -%}\n  {%- do artf.steps.append(rec) -%}\n\
        {%- endfor -%}\n{{artf}}"
      device_records_fqids: '{{vars.run_steps|json_query(''[].ztpfDevices."@id"'')|unique}}'
    next: add_steps_to_run_group
    uuid: 4f94a4e8-17df-4ee0-880e-04e130dd9962
    top: '380'
    left: '360'
  - type: find_record
    name: find actions
    step_variables: []
    module: ztpf_automation_actions?$limit=5000
    checkboxFields: true
    filters:
    - field: id
      value: '{{vars.action_ids}}'
      operator: in
    next: create_step_records
    uuid: 3cc6eeac-5a69-4f18-8d73-5651ad227e9e
    top: '380'
    left: '660'
  - type: find_record
    name: find device
    step_variables: []
    module: ztpf_devices?$limit=5000
    checkboxFields: true
    filters:
    - field: id
      value: '{{vars.input.params[''device_ids'']}}'
      operator: in
    - field: ztpfRunning
      value: true
      operator: neq
    next: find_steps
    uuid: 27a44508-ba19-4f30-b7a4-3142eb3de785
    top: '40'
    left: '340'
  - type: find_record
    name: find steps
    when: '{{vars.steps.find_device[0][''@id'']}}'
    step_variables: []
    module: ztpf_device_automation_steps?$limit=5000
    checkboxFields: true
    filters:
    - field: ztpfDevices
      value: '{{vars.steps.find_device|json_query(''[]."@id"'')}}'
      operator: in
      type: object
      _value:
        '@id': '{{vars.steps.find_device|json_query(''[]."@id"'')}}'
        display: ''
        itemValue: ''
    - field: status
      value: /api/3/picklists/0102f438-8c8e-4a81-840d-a68a58e242d6
      operator: eq
      type: object
      _value:
        '@id': /api/3/picklists/0102f438-8c8e-4a81-840d-a68a58e242d6
        display: Ready
        itemValue: Ready
    sort:
    - field: stepNumber
      direction: ASC
      _fieldName: stepNumber
      _fieldTitle: Step Number
    next: steps_found
    uuid: bed2d849-683c-4bed-a645-6b0e34b99ed4
    top: '40'
    left: '660'
  - type: set_variable
    name: no steps
    uuid: b31b8d97-17d7-4cd2-92c0-47770a92647d
    top: '100'
    left: '1000'
  - type: workflow_reference
    name: run queued steps
    apply_async: false
    step_variables: []
    rungroup_id: '{{vars.steps.create_run_group.id}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/cbdaa8de-e983-4006-92cd-fd332703d2c4
    uuid: 2f97f193-e053-49ea-bfc2-ac05b51396c2
    top: '580'
    left: '60'
  - type: set_variable
    name: setup queue
    vars:
      # The device id is part of the name because the epoch timestamp alone is
      # 1-second resolution: firing several devices concurrently (the multi-device
      # path) produced colliding names, and `create run group` is an Overwrite, so
      # the collision silently REUSED one run group and left one device's steps
      # stranded at Ready with no run group at all. A device can only be in one
      # active run group (find device filters ztpfRunning), so timestamp + first
      # device id is unique per fire.
      ztpfGroup: ztpf-{{arrow.utcnow().int_timestamp}}-{{vars.steps.find_device[0].id}}
      action_ids: '{{vars.run_steps|json_query(''[].ztpfAutomationActions.id'')|unique}}'
    next: create_run_group
    uuid: b64d3df8-82cd-402f-876c-135edd63041c
    top: '220'
    left: '1000'
  - type: start
    name: Start
    step_variables:
      input:
        params: []
    next: find_device
    uuid: ab26146c-a3b9-4612-839f-22417a4d0c7c
    top: '40'
    left: '40'
  - type: decision
    name: steps found
    step_variables: []
    conditions:
    - display: Branch 1
      when: '{{ vars.steps.find_steps|length > 0 }}'
      next: split_batches
    - display: Branch 2
      default: true
      next: no_steps
    uuid: 5f6bb670-ae0e-48e8-a1de-e3efe49fd643
    top: '160'
    left: '660'
  annotations:
  - id: create_group
    uuid: d20f2298-3ba4-4085-b296-f3d9c8604074
    title: Create Group
    body: Create the ztpfRunGroup ID to monitor and maintain the run of this group
      of steps.
    position:
      top: 240
      left: 640
      height: 112
      width: 300
  - id: details
    uuid: aa004cd0-23e2-416f-8b3f-3247f9bfd8c3
    title: Details
    body: "If devices are not already set with ztpfRunning, find all steps that are\
      \ pending to add to the queue.\n\nCreate a ztpfRunGroup record and assign all\
      \ steps from all devices to this record and set the steps to queued. Update\
      \ steps with the Action Type to be used by the Step Running Triggers. \n\nRun\
      \ the Group of steps by Device from the Group."
    position:
      top: 120
