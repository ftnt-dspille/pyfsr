- name: '> get jinja_vars from metadata sources for device_id'
  uuid: 05070bbe-a848-4286-8f33-269ed1a943b0
  description: Given a device_id and metadata_source_ids build jinja_vars.
  is_active: true
  trigger_step_id: start
  parameters:
  - device_id
  - metadata_source_ids
  - input_yaml
  steps:
  - type: set_variable
    name: create jinja_vars device
    vars:
      jinja_vars: "{%- set ret = {\n  \"record\":{}\n} -%}\n\n{%- do ret.update( vars.steps.get_device_jinja_vars.output\
        \ ) -%}\n\n{%- if vars.steps.get_yaml2json -%}\n  {%- set ret = ret | combine(vars.steps.get_yaml2json.output)\
        \ -%}\n{%- endif -%}\n\n{{ret}}"
    next: run_metadata_source
    uuid: 6e593b5c-7700-42b5-9327-ba12ad29678b
    top: '340'
