- name: '> run action from step_id - ZTPF Diff Step Output'
  uuid: f23963fd-d890-44a1-8f93-d966d669e769
  description: Run a script on a device using the step_id and script type
  is_active: true
  trigger_step_id: start
  parameters:
  - device_step_id
  steps:
  - type: set_variable
    name: create text1 and text2
    vars:
      text1: "{%- macro filter_lines(text, include_regex=[], exclude_regex=[]) -%}\n\
        \    {%- set ns = namespace(lines=[], include=false, exclude=false) -%}\n\n\
        \    {%- for line in text.splitlines() -%}\n        {%- set ns.include = not\
        \ include_regex -%}\n        {%- set ns.exclude = false -%}\n\n        {%-\
        \ for pattern in include_regex -%}\n            {%- if line | regex_search(pattern)\
        \ -%}\n                {%- set ns.include = true -%}\n            {%- endif\
        \ -%}\n        {%- endfor -%}\n\n        {%- for pattern in exclude_regex\
        \ -%}\n            {%- if line | regex_search(pattern) -%}\n             \
        \   {%- set ns.exclude = true -%}\n            {%- endif -%}\n        {%-\
        \ endfor -%}\n\n        {%- if ns.include and not ns.exclude -%}\n       \
        \     {%- set ns.lines = ns.lines + [line] -%}\n        {%- endif -%}\n  \
        \  {%- endfor -%}\n\n    {{- ns.lines | join('\\n') -}}\n{%- endmacro %}\n\
        \n{%- set include = vars.diff_script_json.include_regex -%}\n{%- set exclude\
        \ = vars.diff_script_json.exclude_regex -%}\n{%- if include in ['',None] -%}\n\
        \  {%- set include = [] -%}\n{%- endif -%}\n{%- if exclude in ['',None] -%}\n\
        \  {%- set exclude = [] -%}\n{%- endif -%}\n\n{{ filter_lines(\n   vars.steps.find_diff_steps[0].outputText,\n\
        \    include_regex=include,\n    exclude_regex=exclude\n) }}"
      text2: "{%- macro filter_lines(text, include_regex=[], exclude_regex=[]) -%}\n\
        \    {%- set ns = namespace(lines=[], include=false, exclude=false) -%}\n\n\
        \    {%- for line in text.splitlines() -%}\n        {%- set ns.include = not\
        \ include_regex -%}\n        {%- set ns.exclude = false -%}\n\n        {%-\
        \ for pattern in include_regex -%}\n            {%- if line | regex_search(pattern)\
        \ -%}\n                {%- set ns.include = true -%}\n            {%- endif\
        \ -%}\n        {%- endfor -%}\n\n        {%- for pattern in exclude_regex\
        \ -%}\n            {%- if line | regex_search(pattern) -%}\n             \
        \   {%- set ns.exclude = true -%}\n            {%- endif -%}\n        {%-\
        \ endfor -%}\n\n        {%- if ns.include and not ns.exclude -%}\n       \
        \     {%- set ns.lines = ns.lines + [line] -%}\n        {%- endif -%}\n  \
        \  {%- endfor -%}\n\n    {{- ns.lines | join('\\n') -}}\n{%- endmacro %}\n\
        \n{%- set include = vars.diff_script_json.include_regex -%}\n{%- set exclude\
        \ = vars.diff_script_json.exclude_regex -%}\n{%- if include in ['',None] -%}\n\
        \  {%- set include = [] -%}\n{%- endif -%}\n{%- if exclude in ['',None] -%}\n\
        \  {%- set exclude = [] -%}\n{%- endif -%}\n\n{{ filter_lines(\n   vars.steps.find_diff_steps[1].outputText,\n\
        \    include_regex=include,\n    exclude_regex=exclude\n) }}"
    next: diff_mode_setup
