  - type: workflow_reference
    name: render save metadata
    apply_async: false
    step_variables: []
    # The step's stored jinjaVars carry `record` (device + metadata + input) --
    # the same context the output/status templates render with. Without them a
    # saveMetadata template could only see its own output, so it could not
    # compute anything relative to the device (e.g. "the next patch above the
    # version this device is running"). Merged defensively: a step with no
    # jinjaVars degrades to the previous output/source-only context.
    #
    # `source` MUST be an explicit projection of JSON-safe step fields, NEVER the
    # whole `update step stop` result. That step updates with
    # `fieldOperation: {recordTags: Append}` and FSR hands an appended field back
    # as a Python **set**; a workflow_reference's params are written straight into
    # the child run's env row, and psycopg's json.dumps has no encoder for a set.
    # Passing the whole result kills post-run with
    #   TypeError: Object of type set is not JSON serializable
    # AFTER `update step stop` and `render action output` but BEFORE `complete step`
    # -- so the step carries queueStatus Complete + outputStatus OK and status
    # Running FOREVER, and the device's remaining steps never dequeue. There is no
    # error on any record; the only evidence is celeryd.log.
    # Keep in sync with SCRIPT_VARS in deploy_savemeta_record.py.
