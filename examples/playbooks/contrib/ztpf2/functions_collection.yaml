- name: '> diff text return json'
  uuid: ba73dd4a-eec7-4c94-be0c-b1db9401d078
  description: Simply diff two text blocks and return the results in json.
  is_active: true
  trigger_step_id: start
  parameters:
  - text1
  - text2
  steps:
  - type: code_snippet
    name: diff2json
    config: acbb094c-db08-49d5-9772-2aaca10c0311
    code: "import difflib\r\nimport json\r\n\r\n\r\ndef sdiff_json(text1, text2):\r\
      \n    \"\"\"\r\n    Compares two text sections and returns a structured JSON\
      \ with diff lines and summary statistics.\r\n    Uses `|` for modified lines,\
      \ `<` for removed, and `>` for added.\r\n    Returns a dict with 'lines' containing\
      \ the diff and 'summary' containing statistics.\r\n    \"\"\"\r\n\r\n    # Split\
      \ text into lines\r\n    lines1 = text1.splitlines()\r\n    lines2 = text2.splitlines()\r\
      \n\r\n    # Initialize counters for summary\r\n    total_changes = 0\r\n   \
      \ lines_added = 0\r\n    lines_removed = 0\r\n    lines_changed = 0\r\n\r\n\
      \    # Compute the difference\r\n    diff = list(difflib.ndiff(lines1, lines2))\r\
      \n\r\n    # Prepare JSON structure\r\n    result = []\r\n    left_buffer = None\
      \  # Store removed lines to detect modifications\r\n\r\n    for line in diff:\r\
      \n        tag = line[0]  # First character indicates the type of change\r\n\
      \        content = line[2:]  # Actual content\r\n\r\n        if tag == ' ':\
      \  # Unchanged line\r\n            if left_buffer:  # Flush removed lines if\
      \ no addition followed\r\n                for l in left_buffer:\r\n        \
      \            result.append({\r\n                        \"original\": l,\r\n\
      \                        \"symbol\": \"<\",\r\n                        \"modified\"\
      : \"\"\r\n                    })\r\n                    lines_removed += 1\r\
      \n                    total_changes += 1\r\n                left_buffer = None\
      \  # Reset buffer\r\n\r\n            result.append({\r\n                \"original\"\
      : content,\r\n                \"symbol\": \" \",\r\n                \"modified\"\
      : content\r\n            })\r\n\r\n        elif tag == '-':  # Removed line\
      \ (store it for potential modification)\r\n            left_buffer = [content]\r\
      \n\r\n        elif tag == '+':  # Added line\r\n            if left_buffer:\
      \  # If a removed line exists, it's a modification\r\n                result.append({\r\
      \n                    \"original\": left_buffer.pop(0),\r\n                \
      \    \"symbol\": \"|\",\r\n                    \"modified\": content\r\n   \
      \             })\r\n                lines_changed += 1\r\n                total_changes\
      \ += 1\r\n                left_buffer = None  # Reset buffer\r\n           \
      \ else:  # Pure addition\r\n                result.append({\r\n            \
      \        \"original\": \"\",\r\n                    \"symbol\": \">\",\r\n \
      \                   \"modified\": content\r\n                })\r\n        \
      \        lines_added += 1\r\n                total_changes += 1\r\n\r\n    #\
      \ If any remaining removed lines exist, add them\r\n    if left_buffer:\r\n\
      \        for l in left_buffer:\r\n            result.append({\r\n          \
      \      \"original\": l,\r\n                \"symbol\": \"<\",\r\n          \
      \      \"modified\": \"\"\r\n            })\r\n            lines_removed +=\
      \ 1\r\n            total_changes += 1\r\n\r\n    # Create the final output structure\r\
      \n    output = {\r\n        \"lines\": result,\r\n        \"summary\": {\r\n\
      \            \"total_lines\": len(result),\r\n            \"total_changes\"\
      : total_changes,\r\n            \"lines_added\": lines_added,\r\n          \
