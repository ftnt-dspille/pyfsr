  - type: set_variable
    name: return
    vars:
      output: '{{vars.jinja_vars}}'
      params: '{{vars.input.params}}'
      status: '{"error":false}'
    uuid: eb490ce4-517a-4dc8-9e49-94d4b899e868
    top: '120'
    left: '40'
  - type: workflow_reference
    name: run metadata source
    apply_async: false
    step_variables: []
    # `type` is a CHILD-playbook parameter and MUST ride in child_args. At step
    # level the compiler reads `type:` as the step type and drops it silently --
    # which is exactly what happened: every metadata source then fell through to
    # the callee's `uknown type` default branch, its return rendered
    # {Undefined: Undefined}, the parent's combine() got a str instead of a dict,
    # and every metadata-backed step hung at Preparing forever.
    child_args:
      type: '{{vars.item.type.itemValue}}'
      datakey: '{{vars.item.datakey}}'
      jinja_vars: '{{vars.jinja_vars}}'
      source_data: '{{vars.item.script}}'
    pass_parent_env: false
    pass_input_record: false
    workflowReference: /api/3/workflows/18d2347a-2e96-4f78-909c-dbfbd7c861f1
    for_each:
      item: '{{vars.steps.find_mdsources}}'
      parallel: false
      condition: ''
    next: update_jinja_vars_data
    uuid: 3865239b-4cfa-4a4a-893f-baf19ee0cff6
    top: '440'
    left: '800'
  - type: set_variable
    name: setup vars
    vars:
      device_id: '{{vars.input.params[''device_id'']}}'
      input_yaml: '{{vars.input.params[''input_yaml'']}}'
      metadata_source_ids: "{%- set in_field = vars.input.params['metadata_source_ids']\
        \ -%}\n{%- set ret = \"\" -%}\n\n{%- if in_field not in ['',None] -%}\n  {%-\
        \ if in_field is sequence \n        and in_field is not string \n        and\
        \ in_field is not integer -%}\n    {%- set ret = in_field -%}\n  {%- else\
        \ -%}\n    {%- set cmt = in_field | regex_replace('[,\\n]+', ',') -%}\n  \
        \  {%- set ret = cmt.split(',') -%}\n  {%- endif -%}\n{%- endif -%}\n{{ret|unique}}"
    next: find_mdsources
    uuid: d182d2ee-b9c9-49c3-a998-0d58b75131f8
    top: '40'
    left: '340'
  - type: start
    name: Start
    step_variables:
      input:
        params: []
    next: setup_vars
    uuid: 8f79511e-7d7d-42e2-b9e0-a2bf49e764ba
    top: '40'
    left: '40'
  - type: set_variable
    name: update jinja_vars data
    vars:
      jinja_vars: "{%- set jv = vars.jinja_vars -%}\n{%- do jv.update({\"data\":{}})\
        \ -%}\n\n{%- for d in vars.steps.run_metadata_source -%}\n  {%- set dk = d.params.datakey\
        \ -%}\n  {%- if dk in jv.data -%}\n    {% if jv.data[dk] is mapping and d.output[dk]\
        \ is mapping  %}\n      {%- set data = jv.data[dk] | combine(d.output[dk])\
        \ -%}\n    {%- else -%}\n      {%- set data = d.output[dk] -%}\n    {%- endif\
        \ -%}\n  {%- else -%}\n    {%- set data = d.output[dk] -%}\n  {%- endif -%}\n\
        \  {%- do jv.data.update({dk:data}) -%}\n{% endfor -%}\n\n{{jv}}"
    next: return
    uuid: 77e471b5-8eb2-4c88-b6f3-255e36d7bc38
    top: '440'
    left: '40'
  annotations:
  - id: details
    uuid: 0ef4ab25-ac1a-42a0-acea-92c391d399da
    title: Details
    body: "Collect metadata for a device and metadata records.\n - Find all Metadata\
      \ Source records in order of priority\n - Run each Metadata Source record with\
      \ the jinja_vars from the device\n - Merge results into jinja_vars[data][data\
      \ key]"
    position:
      top: 280
      left: 280
      height: 144
      width: 498
  tags:
  - jinja_vars
  - ztpfDevice
  - ztpfMetadataSource
