  - type: connector
    name: eval when
    description: Evaluate the when expression (Python, dot-accessible record context)
      via code-runner. Fail-open (run) if it cannot be evaluated, so nothing is
      silently skipped.
    pickFromTenant: false
    config: Default
    params:
      input: '{{ {"when": vars.steps.find_steps[0].stepWhen, "context": vars.steps.get_when_context.output}
        }}'
      code: |-
        import types

        def wrap(o):
            if isinstance(o, dict):
                ns = types.SimpleNamespace()
                for k, v in o.items():
                    try:
                        setattr(ns, k, wrap(v))
                    except Exception:
                        pass
                return ns
            if isinstance(o, list):
                return [wrap(v) for v in o]
            return o

        w = params.get("when")
        ctx = params.get("context") or {}
        if isinstance(w, bool):
            return {"run": w, "expr": w, "error": None}
        if w is None or (isinstance(w, str) and not str(w).strip()):
            return {"run": True, "expr": w, "error": None}
        scope = {"true": True, "false": False, "null": None}
        for k, v in ctx.items():
            scope[k] = wrap(v)
        try:
            run = bool(eval(str(w), scope))
            err = None
        except Exception as e:
            run = True
            err = str(e)
        return {"run": run, "expr": str(w), "error": err}
    connector: code-runner
    operation: run_python
    next: when_result
    uuid: c1a90030-0005-4b20-9e01-aa0000000005
    top: '800'
    left: '740'
  - type: decision
