        \ -%}\n\n{%- do ret.update({\"ztpfAutomationAction\":\n       root\n     \
        \   | json_query('[].id')\n        | sort\n}) -%}\n\n{%- do ret.update({\"\
        ztpfMetadataSource\":\n       ( ret.ztpfMetadataSource \n       + root\n \
        \       | json_query('[].ztpfMetadataSources')\n        | json_query('[].id'))\
        \ | sort | unique\n        \n}) -%}\n\n{%- do ret.update({\"ztpfAutomationProfileStep\"\
        :\n       ( ret.ztpfAutomationProfileStep\n       + root\n        | json_query('[].ztpfAutomationProfileSteps')\n\
        \        | json_query('[].id')) | sort | unique\n        \n}) -%}\n\n{{ret}}"
    next: find_ztpftemplate
    uuid: 90fe60e7-f14c-4849-92cb-95f4cbc23744
    top: '140'
    left: '620'
