      type2record: "{\n  \"ztpfAutomationProfile\":[],\n  \"ztpfAutomationProfileStep\"\
        :[],\n  \"ztpfAutomationAction\":[],\n  \"ztpfMetadataSource\":[],\n  \"ztpfTemplate\"\
