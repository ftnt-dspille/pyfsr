# MT Health - master side.
#
# Runs the pushed "MT Health Marker" playbook on ONE tenant with a Trigger Tenant
# Playbook step (RemotePlaybookReference). Exposed as an API endpoint so a health
# check can call it without the UI:
#
#   POST /api/triggers/1/mt-health-trigger
#   {"alias": "<playbook alias uuid>", "tenant_id": "<tenant's 32-hex id>"}
#
# Both values are box-specific and are read at runtime, never hard-coded:
#   alias      GET /api/postman/wf-alias/  -> results[].uuid where name == "MT Health Marker"
#              (the push of the "MT Health - Tenant" collection creates it)
#   tenant_id  the tenant node's own id (the tenantId used in Add Tenant)
collection: MT Health - Master
description: Trigger the MT Health Marker playbook on a tenant from the master.
playbooks:
  - name: MT Health Trigger
    description: Run the MT Health Marker playbook on the tenant named in the request body.
    steps:
      - name: Start
        type: api_endpoint
        route: mt-health-trigger
        next: Read Request
      - name: Read Request
        type: set_variable
        vars:
          req: "{{ vars.request.body | from_json if vars.request.body is string else vars.request.body }}"
        next: Trigger Marker On Tenant
      - name: Trigger Marker On Tenant
        type: trigger_tenant_playbook
        playbook_alias_id: "{{ vars.req.alias }}"
        tenant_id: "{{ vars.req.tenant_id }}"
        next: Done
      - name: Done
        type: end
