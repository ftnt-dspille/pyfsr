# Data ingestion playbooks for NVD (nvd-cve).
# Generated by fsr_playbooks.ingestion_template. The 'Fetch' step is a
# Utilities > Make REST API Call stand-in: swap in the connector action.

collection: Sample - NVD - 1.0.0
description: Data ingestion playbooks for NVD. Generated by fsr_playbooks.ingestion_template; clone before
  customising.
visible: true
tags:
- nvd-cve
- dataingestion
exported_tags:
- nvd-cve
- dataingestion
- fetch
- create
- ingest
playbooks:
- name: '>> NVD > Init Macros'
  description: Creates the NVD last-pull-time macro if it does not already exist. Called by Fetch during
    the wizard's environment-setup pass, and by Fetch whenever the macro is missing.
  tags:
  - nvd-cve
  - dataingestion
  is_active: true
  parameters:
  - NVDMacroName
  - NVDMacroValue
  - overrideIfNoMatch
  steps:
  - name: Start
    type: start
    next: Get Macros
  - name: Get Macros
    type: connector
    connector: cyops_utilities
    operation: make_cyops_request
    config: ''
    next: Macro Exists
    params:
      iri: /api/wf/api/dynamic-variable/?format=json&name={{vars.input.params.NVDMacroName}}
      body: ''
      method: GET
  - name: Macro Exists
    type: decision
    conditions:
    - display: Not Exist
      when: '{{ vars.steps.Get_Macros.data[''hydra:totalItems''] == 0 }}'
      next: Create Macro
    - display: Exist
      default: true
      next: Fetch Macro Current Value
  - name: Create Macro
    type: connector
    connector: cyops_utilities
    operation: make_cyops_request
    config: ''
    params:
      iri: /api/wf/api/dynamic-variable/?format=json
      body: '{ ''name'': ''{{vars.input.params.NVDMacroName}}'', ''value'': ''{{vars.input.params.NVDMacroValue}}''
        }'
      method: POST
  - name: Fetch Macro Current Value
    type: set_variable
    vars:
      macroExistingRecord: '{{vars.steps.Get_Macros.data[''hydra:member''][0]}}'
    next: Update Macro If Required
  - name: Update Macro If Required
    type: connector
    connector: cyops_utilities
    operation: make_cyops_request
    config: ''
    when: '{{ (vars.input.params.overrideIfNoMatch == true) and (vars.macroExistingRecord.value != vars.input.params.NVDMacroValue)
      }}'
    params:
      iri: /api/wf/api/dynamic-variable/{{ vars.macroExistingRecord.id }}/
      body: '{ ''name'': ''{{vars.input.params.NVDMacroName}}'', ''value'': ''{{vars.input.params.NVDMacroValue}}''
        }'
      method: PUT
- name: '> NVD > Fetch'
  description: 'Reads the last-pull-time watermark and fetches NVD records since then. STAND-IN: the Fetch
    step is Utilities > Make REST API Call; replace it with the NVD connector action when one exists and
    keep the step name.'
  tags:
  - nvd-cve
  - fetch
  - dataingestion
  is_active: true
  steps:
  - name: Start
    type: start
    configuration_schema:
    - title: Initial Backfill (Days)
      required: true
      editable: true
      visible: true
      type: text
      name: backfill_days
      value: '7'
      tooltip: How many days back the first run reads, before a last-pull-time watermark exists. Later
        runs read from the watermark.
    - title: Maximum Records Per Run
      required: false
      editable: true
      visible: true
      type: text
      name: max_items
      value: '10000'
      tooltip: Safety cap. A window that reaches it FAILS the run instead of silently skipping records;
        raise it or shorten the schedule rather than let it bind.
    next: Configuration
  - name: Configuration
    type: set_variable
    comment: Wizard-editable defaults; the schema field names map 1:1 onto these keys (the wizard writes
      the analyst's values here). The macro name is scoped to this playbook's UUID so two ingestion configurations
      never share a watermark.
    vars:
      backfill_days: '7'
      max_items: '10000'
      NVDMacroName: NVDLastPullTime_{{vars['audit_info']['cyops_playbook_iri'].split('/')[-1].replace('-','_')}}
    next: Get Macro Value
  - name: Get Macro Value
    type: connector
    connector: cyops_utilities
    operation: make_cyops_request
    config: ''
    next: Environment Setup
    params:
      iri: /api/wf/api/dynamic-variable/?format=json&name={{vars.NVDMacroName}}
      body: ''
      method: GET
  - name: Environment Setup
    type: workflow_reference
    comment: 'Runs on the wizard''s env_setup pass AND whenever the macro is missing: Update Last Pull
      Time does not create it, so a missing macro would re-read the backfill forever. Primed to ''0'',
      read as a cold start.'
    when: '{{ vars.request.env_setup or not vars.steps.Get_Macro_Value.data["hydra:member"] }}'
    target: '>> NVD > Init Macros'
    NVDMacroName: '{{vars.NVDMacroName}}'
    NVDMacroValue: '0'
    overrideIfNoMatch: 'false'
    apply_async: false
    pass_parent_env: false
    pass_input_record: false
    next: Set Time Configuration
  - name: Set Time Configuration
    type: set_variable
    comment: The window end is 60s behind the clock and written back only after Create Record succeeds.
      A cold start (macro missing or '0') reads now minus the backfill instead of the watermark.
    vars:
      curr_timestamp: '{{ arrow.utcnow().shift(seconds=-60).format(''YYYY-MM-DDTHH:mm:ss.SSS[Z]'') }}'
      last_pull_time: '{% if vars.request.env_setup or not vars.steps.Get_Macro_Value.data[''hydra:member'']
        or vars.steps.Get_Macro_Value.data[''hydra:member''][0].value == ''0'' %}{% else %}{{ vars.steps.Get_Macro_Value.data[''hydra:member''][0].value
        }}{% endif %}'
      window_from: '{% if vars.last_pull_time %}{{ vars.last_pull_time }}{% else %}{{ arrow.utcnow().shift(days=-(vars.backfill_days|int)).format(''YYYY-MM-DDTHH:mm:ss.SSS[Z]'')
        }}{% endif %}'
    next: Fetch
  - name: Fetch
    type: connector
    connector: cyops_utilities
    operation: api_call
    config: ''
    comment: 'STAND-IN for the NVD connector: Utilities > Make REST API Call. Replace with the connector''s
      fetch action and keep the step name ''Fetch''. This is the FIRST page; it also reports the window''s
      total.'
    mock_result: |
      {
        "data": {
          "vulnerabilities": [
            {
              "cve": {
                "id": "CVE-2026-0001",
                "published": "2026-01-01T00:00:00.000",
                "lastModified": "2026-01-02T00:00:00.000",
                "descriptions": [
                  {
                    "lang": "en",
                    "value": "Sample CVE for the Data Mapping preview."
                  }
                ],
                "metrics": {
                  "cvssMetricV31": [
                    {
                      "cvssData": {
                        "baseScore": 9.8,
                        "baseSeverity": "CRITICAL"
                      }
                    }
                  ]
                }
              }
            }
          ]
        }
      }
    next: Paging Plan
    params:
      url: https://services.nvd.nist.gov/rest/json/cves/2.0
      method: GET
      params: '{"lastModStartDate": "{{ vars.window_from }}", "lastModEndDate": "{{ vars.curr_timestamp
        }}", "startIndex": "0", "resultsPerPage": "2000"}'
      verify: true
  - name: Paging Plan
    type: set_variable
    comment: The window's true total (from the first page) and the offsets of the remaining pages (FortiAnalyzer's
      offset-list pattern).
    vars:
      total: '{{ vars.steps.Fetch.data[''totalResults''] | default(0) | int }}'
      offset_list: '{% set out = [] %}{% for n in range(2000, 0 + (vars.steps.Fetch.data[''totalResults'']
        | default(0) | int), 2000) %}{% set _ = out.append(n) %}{% endfor %}{{ out }}'
    next: Within Cap
  - name: Within Cap
    type: decision
    comment: A window over Maximum Records Per Run fails the run rather than advance the watermark past
      records it never read (FortiEDR v2's count-verified window). With paging the count is the API's
      own total, so every page up to the cap is read.
    conditions:
    - display: Over Cap
      when: '{{ (vars.total | int) > (vars.max_items | int) }}'
      next: Window Over Cap
    - display: Within Cap
      default: true
      next: Fetch Remaining Pages
  - name: Window Over Cap
    type: connector
    connector: cyops_utilities
    operation: raise_exception
    config: ''
    mock_result: |
      {"error": "window over Maximum Records Per Run"}
    params:
      msg: '{{ (vars.total | int) }} NVD records in the window from {{vars.window_from}} reach Maximum
        Records Per Run ({{vars.max_items}}); the watermark was not advanced. Raise the cap or shorten
        the schedule.'
  - name: Fetch Remaining Pages
    type: connector
    connector: cyops_utilities
    operation: api_call
    config: ''
    comment: One request per remaining offset; for_each keeps every page's envelope, in order, for Save
      Result to concatenate.
    when: '{{ vars.offset_list | length > 0 }}'
    for_each:
      item: '{{ vars.offset_list }}'
      condition: ''
    mock_result: |
      {
        "data": {
          "vulnerabilities": [
            {
              "cve": {
                "id": "CVE-2026-0001",
                "published": "2026-01-01T00:00:00.000",
                "lastModified": "2026-01-02T00:00:00.000",
                "descriptions": [
                  {
                    "lang": "en",
                    "value": "Sample CVE for the Data Mapping preview."
                  }
                ],
                "metrics": {
                  "cvssMetricV31": [
                    {
                      "cvssData": {
                        "baseScore": 9.8,
                        "baseSeverity": "CRITICAL"
                      }
                    }
                  ]
                }
              }
            }
          ]
        }
      }
    next: Save Result
    params:
      url: https://services.nvd.nist.gov/rest/json/cves/2.0
      method: GET
      params: '{"lastModStartDate": "{{ vars.window_from }}", "lastModEndDate": "{{ vars.curr_timestamp
        }}", "startIndex": "{{ vars.item }}", "resultsPerPage": "2000"}'
      verify: true
  - name: Save Result
    type: set_variable
    comment: The Fetch -> Ingest contract; Ingest reads these off its workflow_reference step.
    vars:
      data: '{% set out = [] %}{% for r in (vars.steps.Fetch.data[''vulnerabilities''] | default([]) or
        []) %}{% set _ = out.append(r) %}{% endfor %}{% for env in (vars.steps.Fetch_Remaining_Pages |
        default([]) or []) %}{% for r in (env.data[''vulnerabilities''] | default([]) or []) %}{% set
        _ = out.append(r) %}{% endfor %}{% endfor %}{{ out }}'
      current_time: '{{vars.curr_timestamp}}'
      NVDMacroName: '{{vars.NVDMacroName}}'
- name: NVD > Ingest
  description: 'Orchestrator: calls Fetch, then either returns a sample record for the wizard''s Data
    Mapping preview (env_setup) or upserts one alerts record per item and advances the last-pull-time
    watermark.'
  tags:
  - nvd-cve
  - ingest
  - dataingestion
  - create
  is_active: true
  steps:
  - name: Start
    type: start
    module: alerts
    button_label: NVD > Ingest
    requires_record: false
    next: Fetch Records
  - name: Fetch Records
    type: workflow_reference
    target: '> NVD > Fetch'
    apply_async: false
    pass_parent_env: false
    pass_input_record: false
    next: Mapping Preview
  - name: Mapping Preview
    type: decision
    comment: The wizard runs Ingest with vars.request.env_setup == true while the analyst maps fields;
      return a sample and write nothing.
    conditions:
    - display: Mapping Preview
      when: '{{ vars.request.env_setup | default(false) | bool }}'
      next: Return Sample
    - display: Ingest
      default: true
      next: Configuration
  - name: Return Sample
    type: set_variable
    vars:
      sample: '{% if vars.steps.Fetch_Records.data | default([]) | length > 0 %}{{ vars.steps.Fetch_Records.data[0]
        }}{% else %}{{ {"cve": {"id": "CVE-2026-0001", "published": "2026-01-01T00:00:00.000", "lastModified":
        "2026-01-02T00:00:00.000", "descriptions": [{"lang": "en", "value": "Sample CVE for the Data Mapping
        preview."}], "metrics": {"cvssMetricV31": [{"cvssData": {"baseScore": 9.8, "baseSeverity": "CRITICAL"}}]}}}
        }}{% endif %}'
  - name: Configuration
    type: set_variable
    comment: The window's records, the macro holding its watermark, and the vendor -> picklist mappings
      Create Record reads with resolveRange (the shipped M365 Defender / Elasticsearch shape). Edit the
      mappings here.
    vars:
      incident_source_data: '{{ vars.steps.Fetch_Records.data }}'
      NVDMacroName: '{{ vars.steps.Fetch_Records.NVDMacroName }}'
      severity_map: '{''critical'': {{ ''Severity'' | picklist(''Critical'') }}, ''high'': {{ ''Severity''
        | picklist(''High'') }}, ''medium'': {{ ''Severity'' | picklist(''Medium'') }}, ''low'': {{ ''Severity''
        | picklist(''Low'') }}}'
    next: Create Record
  - name: Create Record
    type: create_record
    module: alerts
    operation: Overwrite
    is_upsert: true
    comment: 'Named exactly ''Create Record'': the wizard shows the Data Mapping page only for a step
      of that name. Upsert keyed on sourceId so a re-read window updates rather than duplicates. __fieldsToUpdate
      leaves the create-only fields (state/status) alone on an update, so a re-read never resets triage.'
    for_each:
      item: '{{ vars.incident_source_data }}'
      condition: ''
    fields:
      name: '{{ vars.item.cve.id }}: {{ (vars.item.cve.descriptions[0].value if vars.item.cve.descriptions
        else ''no description'') | truncate(200) }}'
      source: NVD
      sourceId: '{{ vars.item.cve.id | string }}'
      severity: '{{ ((((vars.item.cve.metrics.cvssMetricV31 | default([{}]))[0].cvssData | default({})).baseSeverity)
        | default('''') | string | lower | resolveRange(vars.severity_map)) or (''Severity'' | picklist(''Minimal''))
        }}'
      description: '{{ (vars.item.cve.descriptions[0].value if vars.item.cve.descriptions else '''') |
        e }}'
      sourcedata: '{{ vars.item | toJSON }}'
      state: '{{ "AlertState" | picklist("New") }}'
      status: '{{ "AlertStatus" | picklist("Open") }}'
      __replace: 'true'
      __fieldsToUpdate: '{{ [''name'', ''source'', ''sourceId'', ''severity'', ''description'', ''sourcedata'']
        }}'
    next: Update Last Pull Time
  - name: Update Last Pull Time
    type: connector
    connector: cyops_utilities
    operation: updatemacro
    config: ''
    operationTitle: 'FSR: Update Global Variables'
    comment: Advance the watermark LAST, only after the records are written.
    params:
      macro: '{{vars.NVDMacroName}}'
      value: '{{vars.steps.Fetch_Records.current_time}}'
