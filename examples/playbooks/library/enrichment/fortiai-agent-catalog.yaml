      body: '{{ vars.agent_body }}'
    step_variables:
      task_id: '{{ vars.steps.Trigger_Agent.data.task_id }}'
    next: Wait
  - type: delay
    name: Wait
    seconds: 90
    next: Get Result
  - type: connector
    name: Get Result
    connector: cyops_utilities
    operation: make_cyops_request
    operationTitle: 'FSR: Make FortiSOAR API Call'
    params:
      iri: '/api/ai/agents/{{ vars.task_id }}/result'
      method: GET
    step_variables:
      result_data: '{{ vars.steps.Get_Result.data.data | tojson | default("{}") }}'
    next: Add Comment
  - type: create_record
    name: Add Comment
    module: comments
    fields:
      alerts: '{{ vars.input.records[0]["@id"] }}'
      content: >-
        <p><b>FortiAI fortisoar-data-access</b></p>
        <pre>{{ vars.result_data }}</pre>
      isImportant: true
    operation: Overwrite
    next: End
  - type: connector
    name: End
    connector: cyops_utilities
    operation: no_op
    params: []
    version: 3.4.0
    operationTitle: 'Utils: No Operation'
