    button_label: SIEM Search
    next: Build Input
  - type: set_variable
    name: Build Input
    vars:
      host: '{{ vars.input.records[0].sourceIP | default("192.168.100.20") }}'
      agent_body: >-
        {{ {"intent": "search_events",
            "question": "Show recent events from host " ~ vars.host,
            "indicatorRecordType": "Host",
            "indicatorRecordValue": vars.host} | tojson }}
    next: Trigger Agent
  - type: connector
    name: Trigger Agent
    connector: cyops_utilities
    operation: make_cyops_request
    operationTitle: 'FSR: Make FortiSOAR API Call'
    params:
      iri: /api/ai/agents/siem/trigger
      method: POST
      body: '{{ vars.agent_body }}'
    step_variables:
      task_id: '{{ vars.steps.Trigger_Agent.data.task_id }}'
    next: Wait
  - type: delay
    name: Wait
    seconds: 45
    next: Get Result
  - type: connector
    name: Get Result
    connector: cyops_utilities
    operation: make_cyops_request
    operationTitle: 'FSR: Make FortiSOAR API Call'
    params:
      iri: '/api/ai/agents/{{ vars.task_id }}/result'
      method: GET
    step_variables:
      answer: '{{ vars.steps.Get_Result.data.answer | default("(no answer)") }}'
      confidence: '{{ vars.steps.Get_Result.data.confidence | default("") }}'
      evidence: '{{ vars.steps.Get_Result.data.evidence | default("") }}'
    next: Add Comment
  - type: create_record
    name: Add Comment
    module: comments
    fields:
      alerts: '{{ vars.input.records[0]["@id"] }}'
      content: >-
        <p><b>FortiAI siem</b> — verdict: <b>{{ vars.answer }}</b>
        (confidence: {{ vars.confidence }})</p>
        <p>{{ vars.evidence }}</p>
      isImportant: true
    operation: Overwrite
    next: End
  - type: connector
    name: End
    connector: cyops_utilities
    operation: no_op
    params: []
    version: 3.4.0
    operationTitle: 'Utils: No Operation'

