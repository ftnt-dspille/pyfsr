# Library playbook collection: FortiAI Agent Catalog
#
# One collection, one playbook per on-appliance FortiAI agent — so you can
# deploy a single file and see every agent's input shape + result shape in
# the FortiSOAR UI. Each playbook triggers a named agent via the fsr-ai
# service API (POST /api/ai/agents/<name>/trigger), waits, fetches the
# result, and writes the agent's answer back as a comment.
#
# Two result families:
#   VERDICT agents (ioc-enrichment, siem, identity-context, itsm,
#   endpoint-telemetry, asset-enrichment, organization-context) return:
#     {answer: str, confidence: str, evidence: str}
#
#   STRUCTURED agents (summary, metric-computation, risk-evaluation,
#   task-planner, fortisoar-data-access) return:
#     {data: str | object}  — no answer/confidence/evidence
#
# Requirements:
#   - FortiAI features enabled (System Settings)
#   - The calling role needs execute.ai_agents
#   - cyops_utilities connector configured (make_cyops_request is the
#     loopback HTTP caller)
#
# Input format discovery:
#   The documented inputformat is at GET /api/ai/agent/{name}/{version}
#   (client.ai.agent_input_schema(name)). It is sometimes INCOMPLETE —
#   task-planner requires chain_of_thought (undocumented), conversation
#   requires user_id (undocumented). Send an empty payload to the trigger
#   endpoint and read the error to discover the real required fields:
#     POST /api/ai/agents/<name>/trigger  {}  →  error names missing keys
#
# Live-verified on .159 (8.0.0) — all response shapes captured through
# make_cyops_request via /api/integration/execute/ (exactly how a playbook
# step calls them), so the Jinja in the comment steps matches the real
# wire format.

collection: FortiAI Agent Catalog
description: 'One playbook per FortiAI agent — trigger, wait, result, comment. Deploy this single collection to see every agent work in the UI.'
visible: true
playbooks:
# ─────────────────────────────────────────────────────────────────────
# VERDICT FAMILY — result: {answer, confidence, evidence}
# ─────────────────────────────────────────────────────────────────────

- name: 01 – IOC Enrichment Agent
  description: Ask the Threat Intelligence Provider agent whether a source IP is malicious.
  is_active: true
  trigger_step_id: Start
  steps:
  - type: start
    name: Start
    module: alerts
    button_label: IOC Enrichment
    next: Build Input
  - type: set_variable
    name: Build Input
    vars:
      ioc_value: '{{ vars.input.records[0].sourceIP | default(vars.input.records[0].sourceip) | default("8.8.8.8") }}'
      agent_body: >-
        {{ {"question": "Is this source IP associated with known malicious activity?",
            "ioc": [{"type": "IP Address", "value": vars.ioc_value}]} | tojson }}
    next: Trigger Agent
  - type: connector
    name: Trigger Agent
    connector: cyops_utilities
    operation: make_cyops_request
    operationTitle: 'FSR: Make FortiSOAR API Call'
    params:
      iri: /api/ai/agents/ioc-enrichment/trigger
      method: POST
      body: '{{ vars.agent_body }}'
    step_variables:
      task_id: '{{ vars.steps.Trigger_Agent.data.task_id }}'
    next: Wait
  - type: delay
    name: Wait
    seconds: 30
    next: Get Result
  - type: connector
    name: Get Result
    connector: cyops_utilities
    operation: make_cyops_request
    operationTitle: 'FSR: Make FortiSOAR API Call'
    params:
      iri: '/api/ai/agents/{{ vars.task_id }}/result'
      method: GET
    step_variables:
      answer: '{{ vars.steps.Get_Result.data.answer | default("(no answer)") }}'
      confidence: '{{ vars.steps.Get_Result.data.confidence | default("") }}'
      evidence: '{{ vars.steps.Get_Result.data.evidence | default("") }}'
    next: Add Comment
  - type: create_record
    name: Add Comment
    module: comments
    fields:
      alerts: '{{ vars.input.records[0]["@id"] }}'
      content: >-
        <p><b>FortiAI ioc-enrichment</b> — verdict: <b>{{ vars.answer }}</b>
        (confidence: {{ vars.confidence }})</p>
        <p>{{ vars.evidence }}</p>
      isImportant: true
    operation: Overwrite
    next: End
  - type: connector
    name: End
    connector: cyops_utilities
    operation: no_op
    params: []
    version: 3.4.0
    operationTitle: 'Utils: No Operation'

- name: 02 – SIEM Search Agent
  description: Ask the Query SIEM agent for recent events from the alert's source host.
  is_active: true
  trigger_step_id: Start
  steps:
