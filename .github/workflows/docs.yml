name: Documentation

# No `push` trigger of its own. pr-tests.yml now runs on pushes to main and
# calls this workflow as its `docs` job, which is what produces the required
# `docs / docs` context. A standalone push trigger here would build the docs a
# second time on every main push and report under the name `docs`, which is not
# the context the ruleset asks for.
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        description: 'The Git ref to checkout'
  # Manual deploy: refresh the public site for a docs-only change without
  # cutting a release (which would also ship a new PyPI version). The title
  # will carry the current ``X.Y.Z+devN`` dev suffix until the next release.
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    # The build is read-only; the gh-pages deploy (release only) pushes a branch.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Sphinx >=9.1 (the pinned docs-gate version) requires Python >=3.12.
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Locked, for the same reason as pr-tests.yml: this job resolved fresh on
      # every run, so the day fsr_playbooks published 0.6.22 the docs gate went
      # red on a commit that touched neither docs nor playbooks. `[playbooks]`
      # is needed so the playbook-authoring doctests (compile_yaml ->
      # CompiledPlaybook shape) can run under `make doctest`.
      #
      # Called by pr-tests.yml, so `github.event_name` is the CALLER's event and
      # the weekly schedule re-resolves here too -- drift still surfaces, in the
      # run meant to find it.
      - name: Install package and dependencies (locked)
        if: github.event_name != 'schedule'
        run: uv sync --locked --extra docs --extra playbooks

      - name: Install package and dependencies (latest)
        if: github.event_name == 'schedule'
        run: uv sync --upgrade --extra docs --extra playbooks

      # Every step below invokes `python`, `make` (-> sphinx-build) or the
      # `pyfsr` console script directly. uv syncs into .venv without activating
      # it, so without this they would run against the runner's system Python
      # and miss the whole dependency set.
      - name: Put the synced environment on PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Verify package installation
        run: |
          python -c "import pyfsr; print(pyfsr.__file__)"
          python -c "from pyfsr.api import alerts; print(alerts.__file__)"

      - name: Setup Doc Directory
        run: |
          mkdir -p docs/build/html
          mkdir -p docs/source/_autosummary
          mkdir -p docs/source/_static
          mkdir -p docs/source/_templates
          touch docs/source/_static/.gitkeep
          touch docs/source/_templates/.gitkeep

      - name: Build documentation
        run: |
          cd docs
          make clean
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/src make html SPHINXOPTS="-W --keep-going -n"

      - name: Run doctests
        # Executes the explicit doctest directives in the guides so documented
        # examples can't silently rot (illustrative `>>>` snippets are excluded
        # via doctest_test_doctest_blocks="" in conf.py).
        run: |
          cd docs
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/src make doctest

      - name: Validate doc code examples
        # Checks that pyfsr symbols and CLI flags named in *plain* fenced code
        # blocks (which `make doctest` skips) still resolve against the installed
        # package/CLI -- catches drift after a namespace regroup or flag rename.
        run: |
          cd docs
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/src make check-examples

      - name: Check build output
        run: |
          if [ ! -f docs/build/html/index.html ]; then
            echo "Documentation build failed - index.html not found"
            exit 1
          fi

      - name: Deploy to GitHub Pages
        # Deploy on release so the public site always reflects the published
        # version (hatch-vcs derives a clean ``X.Y.Z`` only at the tagged commit).
        # A plain main push builds for verification but does not deploy -- that
        # would re-publish a ``X.Y.Z+1.devN`` title between releases. A manual
        # workflow_dispatch deploys on demand for docs-only fixes.
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/build/html
          force_orphan: true
          commit_message: 'docs: update documentation [skip ci]'
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
