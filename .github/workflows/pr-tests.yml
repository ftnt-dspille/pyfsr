name: Tests

# The `protect-main` ruleset requires exactly the six contexts this workflow
# produces (lint, test (3.10..3.13), docs / docs). Two consequences shape the
# triggers below, and both are load-bearing:
#
#   1. No `paths` filter. A required status check that never runs never
#      reports, and GitHub treats "not reported" as "not satisfied" -- so a
#      docs-only change would be unmergeable rather than trivially green. Path
#      filters and required checks do not combine; the checks win.
#   2. `push` on main is listed. Without it these six jobs have no trigger that
#      fires on a direct push, so every push to main bypassed all six -- not
#      because the bypass was wanted, but because the checks were structurally
#      unreachable. See RELEASING.md.
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
        description: 'The Git ref to checkout'
  # Weekly run on main so unpinned (`>=`) runtime/docs deps that break the build
  # surface on a schedule, not at release time. Mondays 07:00 UTC.
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

# Cancel superseded runs for the same PR/branch to save CI minutes; never cancel
# scheduled or release (workflow_call) runs.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: format --check
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: mypy (typed CLI surface)
        run: |
          pip install -e '.[typecheck]'
          mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    # Pin uv to the matrix interpreter; left unset it picks its own and the
    # matrix would silently test one Python four times.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from tags -- need full history + tags.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: '**/pyproject.toml'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # PR and push runs install the LOCKED set. Dependencies here are declared
      # as ranges (correct for a library), so resolving fresh on every run means
      # an upstream release lands in whatever CI run happens next -- an unrelated
      # PR goes red for something nobody in it touched. That is exactly how
      # fsr_playbooks 0.6.22 broke main twice in one session. `--locked` fails
      # rather than silently updating if uv.lock has drifted from pyproject.
      - name: Install dependencies (locked)
        if: github.event_name != 'schedule'
        run: uv sync --locked --extra test --extra playbooks

      # The weekly run re-resolves to the newest versions the ranges allow. That
      # is the point of the schedule (see the trigger comment): drift surfaces
      # here, in a run whose only job is to find it, instead of ambushing a PR.
      # A failure here means a dependency moved -- bump the floor deliberately.
      - name: Install dependencies (latest)
        if: github.event_name == 'schedule'
        run: uv sync --upgrade --extra test --extra playbooks

      - name: Run tests
        run: uv run --no-sync pytest tests/ --cov=pyfsr --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    needs: test
    permissions:
      contents: write
    uses: ./.github/workflows/docs.yml
    with:
      # Fall back to the triggering ref for schedule / workflow_dispatch /
      # workflow_call runs, which have no pull_request context.
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
